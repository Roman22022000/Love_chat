<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Переворот</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@700&family=Pacifico&display=swap');

:root {
  --tg-blue: #0088cc;
  --tg-blue-light: #54a9eb;
  --bg-dark: #17212b;
  --panel-dark: #232e3c;
  --header-dark: #1c2733;
  --text-dark: #e4ecf3;
  --muted-dark: #7d8b99;
  --border-dark: #2f3d4c;

  --bg-light: #e6ebee;
  --panel-light: #ffffff;
  --header-light: #ffffff;
  --text-light: #1a1a1a;
  --muted-light: #707579;
  --border-light: #d6dce1;

  --accent: var(--tg-blue);
  --accent2: var(--tg-blue-light);
  --panel: var(--panel-dark);
  --text: var(--text-dark);
  --muted: var(--muted-dark);
  --border-color: var(--border-dark);
  --menu-bg: var(--header-dark);
  --modal-bg: var(--panel-dark);
  --input-bg: #1e2836;
  --btn-bg: rgba(255,255,255,.06);
  --btn-bg-hover: rgba(255,255,255,.12);

  --card-radius: 14px;
  --bottom-bar-height: 56px;
  --app-padding: clamp(12px, 3vw, 18px);
  --app-bottom-padding: clamp(96px, 14vh, 120px);
}

body.light-theme {
  --panel: var(--panel-light);
  --text: var(--text-light);
  --muted: var(--muted-light);
  --border-color: var(--border-light);
  --menu-bg: var(--header-light);
  --modal-bg: var(--panel-light);
  --input-bg: #f4f4f5;
  --btn-bg: rgba(0,0,0,.04);
  --btn-bg-hover: rgba(0,0,0,.08);
}
body.light-theme .panel {
  box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04) !important;
}
body.light-theme .card-back {
  background:
    radial-gradient(circle at 50% 40%, rgba(0,136,204,.18), transparent 45%),
    linear-gradient(145deg,#e8eef4,#c5d8ea 52%,#a9c3dd);
  border-color: #b9cddf;
}
body.light-theme .card-back::before { color: #2b5278; border-color: rgba(43,82,120,.35); }
body.light-theme .bottom-bar,
body.light-theme .profile-menu,
body.light-theme .bar-panel,
body.light-theme .modal {
  box-shadow: 0 4px 20px rgba(0,0,0,.08) !important;
}

* { box-sizing: border-box; }
html { min-height: 100%; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: clamp(13px, 1.05vw, 14px);
  line-height: 1.4;
  background: linear-gradient(-45deg,#17212b,#2b5278,#17212b,#4a76a8,#1c2733);
  background-size: 400% 400%;
  animation: wallpaper 20s ease infinite;
  user-select: none;
  -webkit-user-select: none;
  transition: color .3s, background .5s;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}
body.light-theme {
  background: linear-gradient(-45deg,#eef3f7,#dbe7f1,#f4f7fa,#cfe0ee,#e6eef5);
  background-size: 400% 400%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: var(--bg-icons, none);
  background-size: clamp(120px, 20vw, 200px) clamp(120px, 20vw, 200px);
  background-repeat: repeat;
  opacity: 0.06;
  filter: grayscale(100%);
}
body.light-theme::before { opacity: 0.04; }

@keyframes wallpaper {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

button, input, textarea { font: inherit; }
button {
  color: var(--text);
  border: 1px solid var(--border-color);
  background: var(--btn-bg);
  cursor: pointer;
  border-radius: 8px;
  transition: transform .15s, background .15s;
  min-height: 44px;
  touch-action: manipulation;
}
button:hover { background: var(--btn-bg-hover); }
button:active { transform: scale(.98); }
button:disabled { opacity: .4; cursor: default; }

input, textarea {
  color: var(--text);
  background: var(--input-bg);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: clamp(9px, 1.6vw, 11px) clamp(10px, 1.8vw, 13px);
  outline: none;
  width: 100%;
  font-size: clamp(13px, 1.05vw, 14px);
  transition: border-color .2s;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 72px; user-select: text; -webkit-user-select: text; }
button, .card, .star { -webkit-tap-highlight-color: transparent; }

.panel, .bottom-bar, .profile-menu, .modal, .card, .card-inner,
.card-face, .gender-option, .form-section, .dropdown, .toast,
.theme-switch, .profile-avatar-preview, .profile-button,
.back-button, .action-button, .small-button, .icon-button {
  box-shadow: none !important;
}
button:focus, button:focus-visible, input:focus, textarea:focus {
  outline: none !important;
  box-shadow: none !important;
}

/* SPLASH */
#splashScreen {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 50% 45%, rgba(84,169,235,.2), transparent 60%),
    linear-gradient(160deg, #17212b 0%, #2b5278 50%, #0e1620 100%);
  padding: 20px; text-align: center; transition: opacity .5s ease;
}
#splashScreen.fade-out { opacity: 0; pointer-events: none; }
.splash-table {
  position: relative; width: min(340px, 80vw); height: clamp(140px, 24vw, 180px);
  margin-bottom: 24px; display: flex; justify-content: center; align-items: center;
  gap: clamp(10px, 3vw, 18px);
}
.splash-card {
  width: clamp(60px, 15vw, 90px); height: clamp(86px, 21.6vw, 130px);
  border-radius: 12px; border: 2px solid #c9a050;
  background:
    radial-gradient(circle at 50% 40%, rgba(84,169,235,.2), transparent 50%),
    linear-gradient(145deg,#232e3c,#4a76a8 52%,#17212b);
  position: relative; display: grid; place-items: center;
  font-size: clamp(22px, 6vw, 34px); color: #a8d4ff;
  animation: cardFloat 3s ease-in-out infinite;
}
.splash-card:nth-child(2) { animation-delay: .6s; }
.splash-card::before { content: "✦"; }
@keyframes cardFloat {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}
.splash-crowd { position: absolute; inset: -40px -30px; pointer-events: none; font-size: clamp(16px, 4vw, 24px); opacity: .6; }
.splash-crowd span { position: absolute; animation: crowdSway 3.5s ease-in-out infinite; }
.splash-crowd span:nth-child(1) { top: -10px; left: 15%; }
.splash-crowd span:nth-child(2) { top: -5px; right: 18%; animation-delay: .4s; }
.splash-crowd span:nth-child(3) { top: 20%; left: -10px; animation-delay: .8s; }
.splash-crowd span:nth-child(4) { top: 18%; right: -12px; animation-delay: 1.2s; }
.splash-crowd span:nth-child(5) { bottom: -15px; left: 25%; animation-delay: .6s; }
.splash-crowd span:nth-child(6) { bottom: -18px; right: 22%; animation-delay: 1s; }
@keyframes crowdSway {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-5px) scale(1.06); }
}
.splash-title {
  font-family: 'Pacifico', cursive; font-size: clamp(24px, 6vw, 42px);
  font-weight: 700; color: #fff; margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(84,169,235,.5);
}
.splash-sub { font-size: clamp(12px, 3vw, 16px); color: #a8d4ff; margin-bottom: 28px; letter-spacing: .05em; }
.splash-bar { width: min(240px, 70vw); height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
.splash-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--tg-blue), var(--tg-blue-light));
  border-radius: 3px; animation: splashLoad 3s ease forwards;
}
@keyframes splashLoad { from { width: 0%; } to { width: 100%; } }

/* APP */
.app {
  min-height: 100vh; min-height: 100dvh; max-width: 1080px; margin: auto;
  padding: var(--app-padding);
  padding-bottom: var(--app-bottom-padding);
  padding-bottom: max(var(--app-bottom-padding), env(safe-area-inset-bottom));
  position: relative; z-index: 1;
}
.topline { display: flex; justify-content: flex-end; align-items: center; gap: 10px; position: relative; z-index: 10; }
.icon-button {
  width: clamp(36px, 5vw, 40px); height: clamp(36px, 5vw, 40px);
  border-radius: 50%; font-size: clamp(18px, 2.6vw, 22px);
  display: grid; place-items: center; background: var(--btn-bg);
  border: 1px solid var(--border-color); color: var(--text); min-height: 0;
}
.dropdown {
  position: absolute; top: calc(100% + 8px); right: 0;
  width: min(260px, calc(100vw - 24px)); padding: 6px;
  border: 1px solid var(--border-color); border-radius: 12px;
  background: var(--menu-bg); z-index: 30;
}
.dropdown button {
  width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px;
  border-color: transparent; background: transparent;
  font-size: clamp(13px, 1.1vw, 14px); min-height: 40px;
}
.dropdown button:hover { background: var(--btn-bg-hover); }

main { width: 100%; max-width: 800px; margin: 14px auto 0; }

.panel {
  border: 1px solid var(--border-color); border-radius: clamp(12px, 2vw, 16px);
  background: var(--panel); padding: clamp(13px, 2.6vw, 22px); margin-bottom: 14px;
}
.section-title { font-size: clamp(14px, 1.3vw, 15px); font-weight: 700; margin: 0 0 12px; }
.muted { color: var(--muted); font-size: clamp(12px, 1.1vw, 13px); line-height: 1.5; }

.gender-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(6px, 1.2vw, 8px); }
.gender-option {
  border-radius: 12px; padding: clamp(8px, 1.8vw, 12px) 4px;
  min-height: clamp(70px, 12vw, 84px); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; line-height: 1.2;
  font-size: clamp(9px, 1.05vw, 11px); letter-spacing: .03em;
  text-transform: uppercase; font-weight: 600; border: 1px solid var(--border-color);
  background: var(--btn-bg); text-align: center; overflow-wrap: anywhere;
}
.gender-option .pair-icons { display: flex; gap: 4px; font-size: clamp(18px, 4vw, 26px); line-height: 1; }
.gender-option.selected { border-color: var(--accent); background: rgba(0,136,204,.15); color: var(--accent2); }
body.light-theme .gender-option.selected { background: rgba(0,136,204,.12); }

.name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 1.4vw, 10px); }
.field-wrap { position: relative; }
.field-label {
  display: block; font-size: clamp(11px, 1vw, 12px); color: var(--muted);
  margin-bottom: 6px; font-weight: 500;
}
.comment-box { margin-top: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

.name-input-row { position: relative; display: flex; align-items: center; }
.name-input-row input { padding-right: 52px; flex: 1; min-width: 0; }
.photo-upload-btn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border-color);
  background: var(--btn-bg); color: var(--muted); display: grid; place-items: center;
  font-size: 15px; cursor: pointer; flex-shrink: 0;
  transition: border-color .2s, color .2s, background .2s; min-height: 0; padding: 0; z-index: 3;
  pointer-events: auto;
}
.photo-upload-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--btn-bg-hover); }
.photo-upload-btn.hidden { display: none !important; }

.photo-preview-btn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 8px; border: 2px solid var(--accent);
  overflow: visible; display: none; z-index: 3; background: var(--input-bg);
  cursor: pointer; padding: 0; min-height: 0;
}
.photo-preview-btn.visible { display: block; }
.photo-preview-btn img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  border-radius: 6px; overflow: hidden;
}
.photo-remove-btn {
  position: absolute; right: -9px; top: -9px;
  width: 22px; height: 22px; border-radius: 50%;
  background: #ff4f83; color: #fff;
  border: 2px solid var(--input-bg); font-size: 12px; font-weight: 700;
  display: grid; place-items: center; cursor: pointer; line-height: 1; padding: 0;
  min-height: 0; z-index: 5; box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.photo-remove-btn:hover { background: #ff2d68; }
.photo-file-input { display: none; }

/* BAR PANELS */
.bar-panel {
  position: fixed; z-index: 45;
  bottom: calc(max(10px, env(safe-area-inset-bottom, 10px)) + var(--bottom-bar-height) + 10px);
  left: 50%; transform: translateX(-50%) translateY(20px);
  width: min(420px, calc(100vw - 20px));
  padding: 14px; border-radius: 14px;
  background: var(--menu-bg); border: 1px solid var(--border-color);
  opacity: 0; pointer-events: none;
  transition: transform .35s cubic-bezier(.2,.75,.2,1), opacity .3s ease;
  max-height: min(78vh, 620px); overflow-y: auto; overscroll-behavior: contain;
}
.bar-panel.is-open {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.bar-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding-bottom: 10px; margin-bottom: 10px;
  border-bottom: 1px solid var(--border-color);
}
.bar-panel-head h3 { margin: 0; font-size: clamp(13px, 1.3vw, 14px); font-weight: 700; }
.bar-panel-close {
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; min-height: 0; font-size: 16px;
  background: var(--btn-bg); border: 1px solid var(--border-color);
}
.bar-panel .gender-options { grid-template-columns: repeat(3, 1fr); }
.bar-panel .name-grid { grid-template-columns: 1fr; gap: 10px; }

.bar-toggle-btn {
  height: 36px; padding: 0 12px; border-radius: 18px;
  background: var(--btn-bg); border: 1px solid var(--border-color);
  color: var(--text); font-size: clamp(11px, 1vw, 12px);
  font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
  min-height: 0; flex-shrink: 0; cursor: pointer;
  transition: background .15s, border-color .15s, transform .12s;
}
.bar-toggle-btn:hover { background: var(--btn-bg-hover); }
.bar-toggle-btn:active { transform: scale(.97); }
.bar-toggle-btn.active {
  border-color: var(--accent);
  background: rgba(0,136,204,.15);
  color: var(--accent2);
}
.bar-toggle-btn .ico { font-size: 14px; }

.start-bar-btn {
  flex: 1 1 auto;
  height: 36px; padding: 0 14px; border-radius: 18px;
  border: 0 !important;
  background: linear-gradient(135deg, #00c853, #00b0ff, #ff9100, #00c853, #00b0ff, #ff9100) !important;
  background-size: 400% 400% !important;
  animation: btnGlow 6s ease infinite;
  font-weight: 800; color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,.35);
  font-size: clamp(12px, 1.05vw, 13px);
  min-height: 0; cursor: pointer;
  transition: background .2s, transform .12s;
  white-space: nowrap;
}
.start-bar-btn:hover {
  background: linear-gradient(135deg, #00e676, #40c4ff, #ffab40, #00e676, #40c4ff, #ffab40) !important;
  background-size: 400% 400% !important;
  animation: btnGlow 3s ease infinite;
}
.start-bar-btn:active { transform: scale(.98); }

.primary {
  border: 0 !important;
  background: linear-gradient(135deg, #00c853, #00b0ff, #ff9100, #00c853, #00b0ff, #ff9100) !important;
  background-size: 400% 400% !important;
  animation: btnGlow 6s ease infinite; font-weight: 700; color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,.35);
}
.primary:hover {
  background: linear-gradient(135deg, #00e676, #40c4ff, #ffab40, #00e676, #40c4ff, #ffab40) !important;
  background-size: 400% 400% !important; animation: btnGlow 3s ease infinite;
}
@keyframes btnGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.action-button {
  min-height: clamp(40px, 6vw, 45px);
  padding: clamp(9px, 1.6vw, 12px) clamp(12px, 2.2vw, 18px);
  border-radius: 10px; font-size: clamp(13px, 1.1vw, 14px);
}
.actions .primary { flex: 1; }
.hidden { display: none !important; }

.status {
  min-height: 22px; margin: 0 0 12px; text-align: center;
  color: var(--muted); font-size: clamp(12px, 1.1vw, 13px);
}

/* =========================================================
   КАРТЫ — проверено: корректный 3D-переворот и отображение фото
   ========================================================= */
.cards {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(10px, 2.4vw, 20px); max-width: 560px; margin: 0 auto;
}
.card {
  width: 100%; aspect-ratio: 3 / 4; perspective: 1200px;
  padding: 0; border: 0; background: transparent; border-radius: var(--card-radius);
  min-width: 0; min-height: 0; -webkit-appearance: none; appearance: none;
  transition: transform .2s ease;
}
.card:disabled { opacity: 1; cursor: default; }
.card:not(:disabled):hover { transform: translateY(-3px); }

.card-inner {
  display: block; position: relative; width: 100%; height: 100%;
  border-radius: var(--card-radius);
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  transform-origin: center center;
  transition: transform .72s cubic-bezier(.2,.75,.2,1);
  will-change: transform;
}
.card.flipped .card-inner { transform: rotateY(180deg); }

.card-face {
  display: flex; position: absolute; inset: 0; width: 100%; height: 100%;
  box-sizing: border-box; flex-direction: column; align-items: center;
  justify-content: center; overflow: hidden; border-radius: var(--card-radius);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
}

.card-back {
  background:
    radial-gradient(circle at 50% 40%, rgba(84,169,235,.15), transparent 45%),
    linear-gradient(145deg,#232e3c,#4a76a8 52%,#17212b);
  border: 1px solid var(--border-color);
}
.card-back::before {
  content: "✦"; display: grid; place-items: center;
  width: clamp(40px, 12vw, 70px); height: clamp(40px, 12vw, 70px);
  border: 1px solid rgba(255,255,255,.25); border-radius: 50%;
  font-size: clamp(20px, 5vw, 32px); color: #a8d4ff;
}

.card-front {
  transform: rotateY(180deg);
  border: 2px solid var(--person-color, #54a9eb);
  background-color: #1b5685;
  background-image:
    radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.12), transparent 55%),
    linear-gradient(150deg, var(--person-bg1, #1b5685), var(--person-bg2, #10253f));
  padding: clamp(6px, 1.4vw, 12px);
}

.card-front .card-photo {
  width: 64%; aspect-ratio: 1; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.4); overflow: hidden;
  background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.25), transparent 45%), rgba(255,255,255,.06);
  display: grid; place-items: center;
  font-size: clamp(32px, 8vw, 66px); flex-shrink: 0;
  position: relative;
  /* NEW: гарантируем, что фото не «схлопывается» после переворота */
  transform: translateZ(1px);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.card-front .card-photo img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  pointer-events: none; user-select: none; -webkit-user-drag: none;
  /* NEW: img не должен скрываться из-за backface-visibility родителя */
  backface-visibility: visible;
  -webkit-backface-visibility: visible;
  transform: translateZ(2px);
  /* NEW: плавное появление после переворота */
  animation: photoFadeIn .3s ease;
}
@keyframes photoFadeIn {
  from { opacity: 0; transform: translateZ(2px) scale(.96); }
  to { opacity: 1; transform: translateZ(2px) scale(1); }
}
.card-front .crown { font-size: clamp(20px, 5vw, 40px); margin-bottom: 6px; }
.card-front .person-name {
  margin-top: clamp(6px, 1.4vw, 12px);
  font-size: clamp(12px, 2.6vw, 18px); font-weight: 800;
  text-align: center; overflow-wrap: anywhere; padding: 0 2px;
}
.card-front .person-label {
  margin-top: 4px; color: rgba(255,255,255,.75);
  font-size: clamp(8px, 1vw, 10px); letter-spacing: .12em; text-transform: uppercase;
}
.card.chosen .card-inner { filter: drop-shadow(0 0 14px rgba(84,169,235,.5)); }

/* NEW: кнопки редактирования над картой */
.card-edit-overlay {
  position: absolute;
  top: -10px;
  right: -10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 6;
}
.card-edit-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--menu-bg); border: 1px solid var(--border-color);
  color: var(--text); font-size: 14px; display: grid; place-items: center;
  cursor: pointer; min-height: 0; padding: 0;
  transition: background .15s, border-color .15s, transform .12s;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.card-edit-btn:hover { background: var(--btn-bg-hover); border-color: var(--accent); }
.card-edit-btn:active { transform: scale(.94); }

.card-wrap {
  position: relative;
  width: 100%;
  min-width: 0;
}

/* РЕЗУЛЬТАТ */
.result-card { max-width: min(280px, 70vw); margin: 0 auto; }
.result-summary { text-align: center; margin-top: 16px; }
.result-summary h2 {
  font-size: clamp(17px, 2.2vw, 20px); margin: 0 0 6px;
  font-weight: 700; overflow-wrap: anywhere; padding: 0 4px;
}
.result-summary p {
  margin: 4px 0; color: var(--muted); line-height: 1.5;
  overflow-wrap: anywhere; font-size: clamp(12px, 1.15vw, 14px); padding: 0 4px;
}
.result-quote {
  font-style: italic; font-size: clamp(12px, 1.2vw, 14px); color: var(--text);
  padding: clamp(10px, 1.8vw, 12px) clamp(12px, 2vw, 16px);
  margin: 10px 0; border-left: 3px solid var(--accent);
  background: rgba(0,136,204,.1); border-radius: 8px; text-align: left; line-height: 1.55;
}
body.light-theme .result-quote { background: rgba(0,136,204,.08); }
.result-comment {
  text-align: left; white-space: pre-wrap; overflow-wrap: anywhere;
  margin-top: 14px; padding: 12px; border-radius: 10px;
  background: rgba(255,255,255,.04); border: 1px solid var(--border-color);
  font-size: clamp(12px, 1.1vw, 13px);
}
body.light-theme .result-comment { background: rgba(0,0,0,.03); }

.result-note-box {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--border-color); text-align: left;
}
.result-note-box label {
  font-size: clamp(11px, 1vw, 12px); color: var(--muted);
  font-weight: 600; margin-bottom: 6px; display: block;
}
.result-note-box textarea { min-height: 60px; font-size: clamp(12px, 1.05vw, 13px); }
.result-note-saved {
  font-size: 11px; color: #00c853; margin-top: 4px;
  min-height: 14px; font-weight: 600;
}

/* АРХИВ */
.archive-list { display: grid; gap: 14px; margin-top: 12px; }

.archive-item {
  border: 1px solid var(--border-color); background: rgba(255,255,255,.03);
  padding: clamp(30px, 6vw, 38px) clamp(10px, 1.8vw, 12px) clamp(10px, 1.8vw, 12px);
  border-radius: 12px; min-width: 0; position: relative;
  margin-top: 14px;
}
body.light-theme .archive-item { background: rgba(0,0,0,.02); }

.archive-bookmark-top {
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  width: 54px;
  height: 22px;
  pointer-events: none;
  z-index: 2;
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 3px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.35));
}
.archive-bookmark-top::before,
.archive-bookmark-top::after {
  content: "";
  flex: 1 1 50%;
  height: 100%;
  background: var(--bookmark-color, #ffd166);
  border-radius: 6px 6px 2px 2px;
  clip-path: polygon(
    0 0, 100% 0,
    100% 70%, 55% 100%, 100% 100%,
    100% 100%, 0 100%,
    45% 100%, 0 70%
  );
}
.archive-bookmark-top .bm-tail {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 16px;
  display: flex;
  gap: 3px;
}
.archive-bookmark-top .bm-tail::before,
.archive-bookmark-top .bm-tail::after {
  content: "";
  flex: 1 1 50%;
  height: 100%;
  background: var(--bookmark-color, #ffd166);
  border-radius: 0 0 4px 4px;
  clip-path: polygon(0 0, 100% 0, 65% 100%, 50% 60%, 35% 100%);
}

.archive-card-mini {
  width: 64px;
  height: 86px;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid var(--person-color, #54a9eb);
  background: linear-gradient(150deg, var(--person-bg1, #1b5685), var(--person-bg2, #10253f));
  display: grid;
  place-items: center;
  flex-shrink: 0;
  position: relative;
}
.archive-card-mini .mini-photo {
  width: 100%; height: 100%;
  display: grid; place-items: center;
  font-size: 28px; overflow: hidden;
}
.archive-card-mini .mini-photo img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.archive-card-mini .mini-crown {
  position: absolute; top: 4px; left: 50%;
  transform: translateX(-50%);
  font-size: 14px; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.5);
}

.archive-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
.archive-head-left { display: flex; gap: 10px; align-items: flex-start; min-width: 0; flex: 1; }
.archive-head-text { min-width: 0; flex: 1; }
.archive-title { font-weight: 700; overflow-wrap: anywhere; font-size: clamp(13px, 1.2vw, 14px); min-width: 0; }
.archive-meta { color: var(--muted); font-size: clamp(11px, 1vw, 12px); margin-top: 4px; line-height: 1.5; }
.archive-comment {
  white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 8px;
  padding-top: 8px; border-top: 1px solid var(--border-color);
  color: var(--text); font-size: clamp(11px, 1vw, 12px); line-height: 1.5; opacity: .85;
}
.archive-share-btn {
  padding: 6px 10px; border-radius: 8px; background: var(--btn-bg);
  border: 1px solid var(--border-color); font-size: clamp(11px, 1vw, 12px);
  color: var(--text); cursor: pointer; display: inline-flex;
  align-items: center; gap: 4px; min-height: 32px; flex-shrink: 0;
}
.archive-share-btn:hover { background: var(--btn-bg-hover); }
.archive-note-display {
  margin-top: 8px; padding: 8px 10px; border-radius: 8px;
  font-size: clamp(11px, 1vw, 12px); line-height: 1.5;
  color: #1a1a1a; white-space: pre-wrap; overflow-wrap: anywhere;
}
.archive-note-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.archive-note-row textarea { flex: 1 1 100%; min-height: 50px; font-size: clamp(11px, 1vw, 12px); }
.bookmark-picker { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.bookmark-picker .bk-label { font-size: clamp(10px, .95vw, 11px); color: var(--muted); font-weight: 600; margin-right: 4px; }
.bookmark-color-btn {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--border-color); padding: 0; cursor: pointer;
  transition: transform .15s; min-height: 0;
}
.bookmark-color-btn:hover { transform: scale(1.15); }
.bookmark-color-btn.selected { border-color: var(--text); transform: scale(1.18); }

/* BOTTOM BAR */
.bottom-bar {
  position: fixed; z-index: 20; bottom: max(10px, env(safe-area-inset-bottom, 10px));
  left: 50%; transform: translateX(-50%);
  width: min(760px, calc(100% - 20px)); height: var(--bottom-bar-height);
  padding: 6px 10px; display: flex; align-items: center; gap: 6px;
  border-radius: 26px; background: var(--menu-bg); border: 1px solid var(--border-color);
  transition: transform .4s cubic-bezier(.2,.75,.2,1), opacity .3s ease;
}
.bottom-bar.is-hidden { transform: translate(-50%, calc(100% + 30px)); opacity: 0; pointer-events: none; }
.back-button {
  width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%;
  font-size: 18px; display: grid; place-items: center;
  background: var(--btn-bg); border: 1px solid var(--border-color);
  color: var(--text); min-height: 0;
}
.back-button:hover { background: var(--btn-bg-hover); }
.back-button.hidden { display: none !important; }
.profile-button {
  width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%;
  background: var(--tg-blue); border: 0; display: grid; place-items: center;
  font-size: 16px; overflow: hidden; color: #fff; min-height: 0;
}
.bottom-revealed-names {
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  margin-left: 4px; padding-left: 8px; border-left: 1px solid var(--border-color);
  font-size: 11px; color: var(--muted); max-width: min(280px, 45vw); min-width: 0;
}
.bottom-revealed-names .rev-name {
  padding: 3px 8px; border-radius: 6px; background: rgba(0,136,204,.25);
  color: var(--text); font-weight: 600; white-space: nowrap;
  font-size: clamp(10px, .95vw, 11px); overflow: hidden;
  text-overflow: ellipsis; max-width: 100%;
}
.bottom-revealed-names .rev-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  opacity: .7; width: 100%; margin-bottom: 2px;
}

/* PROFILE MENU */
.profile-menu {
  position: fixed; z-index: 40;
  bottom: calc(max(10px, env(safe-area-inset-bottom, 10px)) + var(--bottom-bar-height) + 10px);
  left: 50%; transform: translateX(-50%) translateY(20px);
  width: min(320px, calc(100vw - 20px)); padding: 12px; border-radius: 14px;
  background: var(--menu-bg); border: 1px solid var(--border-color);
  opacity: 0; pointer-events: none;
  transition: transform .35s cubic-bezier(.2,.75,.2,1), opacity .3s ease;
  max-height: min(80vh, 600px); overflow-y: auto; overscroll-behavior: contain;
}
.profile-menu.is-open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.profile-menu-header {
  display: flex; align-items: center; gap: 10px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border-color); margin-bottom: 10px;
}
.profile-avatar-preview {
  width: 48px; height: 48px; border-radius: 50%; background: var(--tg-blue);
  display: grid; place-items: center; font-size: 24px; flex-shrink: 0;
  border: 2px solid var(--border-color); overflow: hidden;
}
.profile-menu-name {
  font-size: 14px; font-weight: 700; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.profile-menu-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.profile-menu-list { display: grid; gap: 2px; }
.profile-menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  text-align: left; padding: 9px 10px; border-radius: 8px;
  border: 1px solid transparent; background: transparent;
  font-size: clamp(12px, 1.1vw, 13px); transition: background .15s; min-height: 40px;
}
.profile-menu-item:hover { background: var(--btn-bg-hover); }
.profile-menu-item .icon { width: 20px; text-align: center; font-size: 15px; flex-shrink: 0; }
.profile-menu-item .label { flex: 1; min-width: 0; }
.profile-menu-divider { height: 1px; background: var(--border-color); margin: 4px 0; }

.subscribe-btn { background: var(--btn-bg) !important; border: 1px solid var(--border-color) !important; font-weight: 800; }
.subscribe-btn:hover { background: var(--btn-bg-hover) !important; }
.subscribe-btn .label {
  background: linear-gradient(90deg, #ff4f83, #ffb347, #00c853, #00b0ff, #c8339a, #ff4f83);
  background-size: 400% 400%; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  animation: rainbowFlow 3s ease infinite; font-weight: 800; letter-spacing: .02em;
}
.subscribe-btn:hover .label { animation: rainbowFlow 1.6s ease infinite; }
.subscribe-btn .icon { -webkit-text-fill-color: initial; }
@keyframes rainbowFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* THEME SWITCH */
.theme-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
.theme-toggle-label { font-size: clamp(12px, 1.1vw, 13px); font-weight: 600; }
.theme-switch {
  position: relative; width: 60px; height: 30px; border-radius: 15px;
  background: #2b3a4a; border: 1px solid var(--border-color); cursor: pointer;
  transition: background .35s; flex-shrink: 0; padding: 0; overflow: hidden; min-height: 0;
}
.theme-switch .thumb {
  position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
  border-radius: 50%; background: #ffd166; display: grid; place-items: center;
  font-size: 12px; transition: transform .35s cubic-bezier(.2,.75,.2,1), background .35s;
}
.theme-switch.is-light { background: #cfe3f5; }
.theme-switch.is-light .thumb { transform: translateX(30px); background: #ffffff; }

/* MODAL */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: clamp(10px, 2vw, 16px);
  padding-bottom: max(clamp(10px, 2vw, 16px), env(safe-area-inset-bottom));
  background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
}
body.light-theme .modal-backdrop { background: rgba(0,0,0,.35); }
.modal {
  width: min(520px, 100%); max-height: min(85vh, 90dvh); overflow-y: auto;
  overscroll-behavior: contain; background: var(--modal-bg);
  border: 1px solid var(--border-color); border-radius: 14px;
  padding: clamp(14px, 2.4vw, 18px);
}
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.modal-head h2 { font-size: clamp(15px, 1.5vw, 17px); margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.close-button { border-radius: 50%; width: 32px; height: 32px; min-height: 0; flex-shrink: 0; }

.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.theme-button {
  border-radius: 10px; padding: 10px; min-height: 56px; text-align: left;
  font-size: clamp(11px, 1vw, 12px); overflow: hidden; min-height: 0;
  transition: transform .15s, border-color .15s;
  position: relative;
}
.theme-button:hover { transform: translateY(-2px); border-color: var(--accent); }
.theme-button.selected { border-color: var(--accent); background: rgba(0,136,204,.12); }
.theme-swatch {
  height: 24px; border-radius: 6px; margin-bottom: 6px;
  position: relative; overflow: hidden;
}
.theme-swatch::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
  background-size: 200% 100%;
  animation: swatchShine 3s linear infinite;
}
@keyframes swatchShine {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.color-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
.color-input { padding: 3px; height: 40px; cursor: pointer; min-height: 0; }
hr { border: 0; border-top: 1px solid var(--border-color); margin: 14px 0; }

.toast {
  position: fixed; z-index: 80; left: 50%;
  bottom: calc(max(10px, env(safe-area-inset-bottom, 10px)) + 76px);
  transform: translateX(-50%); padding: 10px 14px; border-radius: 10px;
  background: var(--menu-bg); border: 1px solid var(--border-color);
  color: var(--text); font-size: clamp(12px, 1.1vw, 13px);
  max-width: calc(100% - 20px); text-align: center;
}

.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; margin-top: 10px; }
.emoji-option {
  aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center;
  font-size: clamp(20px, 4vw, 26px); background: var(--btn-bg);
  border: 2px solid transparent; padding: 0; cursor: pointer;
  transition: border-color .15s, transform .12s; min-height: 0;
}
.emoji-option:hover { transform: translateY(-2px); background: var(--btn-bg-hover); }
.emoji-option.selected { border-color: var(--accent); background: rgba(0,136,204,.15); }

/* SUGGEST */
.suggest-panel {
  position: absolute; z-index: 60; top: calc(100% + 4px); left: 0; right: 0;
  max-height: min(260px, 44vh); overflow-y: auto; overscroll-behavior: contain;
  padding: 6px; border-radius: 12px; background: var(--menu-bg);
  border: 1px solid var(--border-color); display: grid; gap: 5px;
}
.suggest-tile {
  display: block; width: 100%; text-align: left; padding: 9px 11px;
  border-radius: 8px; border: 1px solid transparent; background: #ffffff;
  color: #1a1a1a; font-size: clamp(12px, 1.1vw, 13px); line-height: 1.4;
  cursor: pointer; transition: transform .12s, background .12s;
  white-space: normal; min-height: 0; overflow-wrap: anywhere;
}
.suggest-tile:hover { transform: translateY(-1px); background: #f0f0f0; }
.suggest-tile:active { transform: scale(.98); }
.suggest-tile.rainbow {
  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4);
  background: linear-gradient(135deg, #ff4f83, #ffb347, #00c853, #00b0ff, #c8339a, #ff4f83);
  background-size: 400% 400%; animation: rainbowFlow 4s ease infinite;
}
.suggest-tile.rainbow:hover { animation: rainbowFlow 2s ease infinite; }
.suggest-tile.blue { background: linear-gradient(135deg, #a8e0ff, #5bc0ff); color: #0a2540; }
.suggest-tile.blue:hover { background: linear-gradient(135deg, #c2ecff, #7dcfff); }
.suggest-tile.pink { background: linear-gradient(135deg, #ffc2d9, #ff8fb8); color: #4a0d28; }
.suggest-tile.pink:hover { background: linear-gradient(135deg, #ffd6e6, #ffa8c9); }

/* NEW: кнопка обновления списка подсказок (🔄) */
.suggest-tile.refresh {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--accent);
  color: #fff;
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .02em;
  padding: 8px 12px;
  border-radius: 8px;
  min-height: 36px;
  transition: background .15s, transform .12s;
}
.suggest-tile.refresh:hover { background: var(--accent2); transform: translateY(-1px); }
.suggest-tile.refresh:active { transform: scale(.97); }
.suggest-tile.refresh .refresh-ico {
  font-size: 15px;
  display: inline-block;
  transition: transform .4s ease;
}
.suggest-tile.refresh.spinning .refresh-ico {
  animation: refreshSpin .6s linear;
}
@keyframes refreshSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* TICKET */
.ticket {
  background: #ffffff; color: #1a1a1a; border-radius: 12px;
  padding: clamp(12px, 2.4vw, 16px); font-family: 'Inter', sans-serif;
  position: relative; border: 1px dashed #b0b0b0; overflow: hidden;
}
.ticket::before, .ticket::after {
  content: ""; position: absolute; width: 24px; height: 24px;
  border-radius: 50%; background: var(--modal-bg); left: -12px;
}
.ticket::before { top: 20px; }
.ticket::after { bottom: 20px; }
.ticket-head {
  font-family: 'Pacifico', cursive; font-size: clamp(16px, 2.4vw, 20px);
  text-align: center; margin-bottom: 8px; color: #1a1a1a;
}
.ticket-divider { border-top: 1px dashed #b0b0b0; margin: 10px 0; }
.ticket-row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: clamp(12px, 1.1vw, 13px); flex-wrap: wrap; }
.ticket-row .k { color: #707579; font-weight: 600; }
.ticket-row .v { color: #1a1a1a; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
.ticket-note {
  margin-top: 8px; padding: 8px; border-radius: 6px;
  font-size: clamp(11px, 1vw, 12px); line-height: 1.5;
  white-space: pre-wrap; overflow-wrap: anywhere;
}

/* SUB */
.sub-section { margin-top: 6px; }
.sub-section-title {
  font-size: clamp(11px, 1vw, 12px); text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); font-weight: 700;
  margin: 14px 0 6px; display: flex; align-items: center; gap: 6px;
}
.sub-cards { display: grid; gap: 8px; }
.sub-card {
  display: flex; align-items: center; gap: 10px;
  padding: clamp(10px, 1.8vw, 12px) clamp(10px, 1.8vw, 14px);
  border-radius: 12px; background: rgba(255,255,255,.04);
  border: 1px solid var(--border-color);
  transition: transform .15s, border-color .15s; min-width: 0;
}
body.light-theme .sub-card { background: rgba(0,0,0,.02); }
.sub-card:hover { transform: translateY(-1px); border-color: var(--accent); }
.sub-card .sub-ico {
  width: clamp(32px, 6vw, 38px); height: clamp(32px, 6vw, 38px);
  border-radius: 10px; display: grid; place-items: center;
  font-size: clamp(16px, 3vw, 20px); flex-shrink: 0;
  background: linear-gradient(135deg, rgba(255,79,131,.25), rgba(0,176,255,.25));
}
.sub-card .sub-info { flex: 1; min-width: 0; }
.sub-card .sub-name { font-weight: 700; font-size: clamp(12px, 1.15vw, 13.5px); color: var(--text); overflow-wrap: anywhere; }
.sub-card .sub-sub { font-size: clamp(10px, .95vw, 11px); color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.sub-card .sub-price {
  font-weight: 800; font-size: clamp(13px, 1.4vw, 15px);
  background: linear-gradient(90deg, #ff4f83, #ffb347, #00c853, #00b0ff);
  background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; animation: rainbowFlow 4s ease infinite;
  white-space: nowrap; flex-shrink: 0;
}
.sub-badge {
  display: inline-block; padding: 2px 6px; border-radius: 6px;
  font-size: 10px; font-weight: 700; background: rgba(0,200,83,.18);
  color: #00c853; margin-left: 6px; vertical-align: middle;
}
.sub-note { font-size: clamp(10px, 1vw, 11px); color: var(--muted); margin-top: 12px; text-align: center; line-height: 1.5; }

/* GIFT */
.gift-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 8px; }
.gift-card {
  position: relative; border-radius: 14px; padding: 16px 14px;
  min-height: 130px; display: flex; flex-direction: column;
  justify-content: space-between; overflow: hidden; cursor: pointer;
  transition: transform .18s; border: 1px solid rgba(255,255,255,.2);
  color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.gift-card:hover { transform: translateY(-2px); }
.gift-card::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 80% 20%, rgba(255,255,255,.35), transparent 45%),
    radial-gradient(circle at 15% 85%, rgba(255,255,255,.18), transparent 50%);
  pointer-events: none;
}
.gift-card::after {
  content: ""; position: absolute; top: -10px; right: -10px;
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(255,255,255,.15); pointer-events: none;
}
.gift-card.platinum {
  background: linear-gradient(135deg, #e0e7ff 0%, #b8c6f0 30%, #8a9bd6 60%, #5864a0 100%);
  color: #1a1f3a; text-shadow: 0 1px 2px rgba(255,255,255,.4); border-color: #d4def0;
}
.gift-card.platinum::before {
  background:
    radial-gradient(circle at 80% 20%, rgba(255,255,255,.75), transparent 40%),
    radial-gradient(circle at 15% 85%, rgba(255,255,255,.35), transparent 50%),
    linear-gradient(120deg, transparent 40%, rgba(255,255,255,.4) 50%, transparent 60%);
}
.gift-card.platinum::after { background: rgba(255,255,255,.4); }
.gift-card.gold {
  background: linear-gradient(135deg, #ffd166 0%, #ffb347 40%, #e88a1f 75%, #b56a10 100%);
  color: #3a1f00; text-shadow: 0 1px 2px rgba(255,255,255,.3); border-color: #ffe0a3;
}
.gift-card.gold::before {
  background:
    radial-gradient(circle at 80% 20%, rgba(255,255,255,.55), transparent 40%),
    radial-gradient(circle at 15% 85%, rgba(255,255,255,.25), transparent 50%);
}
.gift-card.gold::after { background: rgba(255,255,255,.3); }
.gift-card.bronze {
  background: linear-gradient(135deg, #ff9f7a 0%, #e8724a 45%, #c0502a 80%, #8a3a1d 100%);
  color: #fff; border-color: #ffb896;
}
.gift-card.bronze::before {
  background:
    radial-gradient(circle at 80% 20%, rgba(255,255,255,.4), transparent 40%),
    radial-gradient(circle at 15% 85%, rgba(255,255,255,.18), transparent 50%);
}
.gift-card.bronze::after { background: rgba(255,255,255,.22); }
.gift-card .gift-badge {
  position: relative; z-index: 1; font-size: 10px;
  text-transform: uppercase; letter-spacing: .14em; font-weight: 700; opacity: .85;
}
.gift-card .gift-title {
  position: relative; z-index: 1; font-family: 'Pacifico', cursive;
  font-size: clamp(20px, 3vw, 26px); line-height: 1.1; margin: 6px 0;
}
.gift-card .gift-desc {
  position: relative; z-index: 1; font-size: clamp(11px, 1vw, 12px);
  line-height: 1.4; opacity: .9; margin-bottom: 6px;
}
.gift-card .gift-price {
  position: relative; z-index: 1; font-size: clamp(15px, 1.6vw, 18px);
  font-weight: 800; letter-spacing: .02em;
}
.gift-card .gift-tag {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  background: rgba(0,0,0,.25); color: #fff; font-size: 10px;
  font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: .06em;
}
body.light-theme .gift-card.platinum { color: #1a1f3a; }

/* ABOUT */
.about-intro { font-size: clamp(13px, 1.15vw, 14px); line-height: 1.6; color: var(--text); margin: 0 0 16px; }
.rules-title { font-size: clamp(13px, 1.15vw, 14px); font-weight: 700; margin: 16px 0 10px; color: var(--text); }
.rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 6px; }
.rule-card {
  border: 1px solid var(--border-color); border-radius: 12px;
  background: rgba(255,255,255,.04); padding: 14px 10px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 160px;
}
body.light-theme .rule-card { background: rgba(0,0,0,.02); }
.rule-card .rule-img {
  width: 64px; height: 64px; border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,79,131,.18), rgba(0,176,255,.18));
  display: grid; place-items: center; font-size: 32px; flex-shrink: 0;
}
.rule-card .rule-text { font-size: clamp(11px, 1vw, 12px); line-height: 1.4; color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
.rule-card .rule-num {
  display: inline-block; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: 11px;
  font-weight: 700; line-height: 22px; text-align: center;
}

/* DONATE */
.donate-hero {
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; text-align: center; padding: 8px 4px 14px;
}
.donate-hero .donate-emoji {
  font-size: clamp(48px, 12vw, 72px); line-height: 1;
  filter: drop-shadow(0 6px 14px rgba(255,79,131,.35));
}
.donate-hero h3 { margin: 0; font-size: clamp(16px, 2.2vw, 20px); font-weight: 800; color: var(--text); }
.donate-hero p {
  margin: 0; color: var(--muted);
  font-size: clamp(12px, 1.15vw, 13px); line-height: 1.55; max-width: 420px;
}
.donate-games { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 6px 0 14px; }
.donate-game {
  border: 1px solid var(--border-color); border-radius: 12px;
  background: rgba(255,255,255,.04); padding: 10px;
  display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
body.light-theme .donate-game { background: rgba(0,0,0,.02); }
.donate-game .dg-img {
  height: 56px; border-radius: 8px; display: grid; place-items: center;
  font-size: 28px; background: linear-gradient(135deg, rgba(84,169,235,.22), rgba(255,79,131,.22));
}
.donate-game .dg-name { font-weight: 700; font-size: clamp(11px, 1.05vw, 12.5px); overflow-wrap: anywhere; }
.donate-game .dg-meta { font-size: clamp(10px, .95vw, 11px); color: var(--muted); line-height: 1.4; }
.donate-chart {
  border: 1px solid var(--border-color); border-radius: 12px;
  padding: 12px 10px 8px; background: rgba(255,255,255,.03); margin-bottom: 14px;
}
body.light-theme .donate-chart { background: rgba(0,0,0,.02); }
.donate-bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-bottom: 4px; }
.donate-bar-col {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; min-width: 0; height: 100%; justify-content: flex-end;
}
.donate-bar {
  width: 100%; max-width: 34px; border-radius: 6px 6px 0 0;
  background: linear-gradient(180deg, var(--accent2), var(--accent));
  transition: height .6s cubic-bezier(.2,.75,.2,1); min-height: 4px;
}
.donate-bar-label {
  font-size: 9.5px; color: var(--muted); text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
.donate-box {
  border: 1px solid var(--border-color); border-radius: 12px;
  padding: 12px; background: linear-gradient(135deg, rgba(255,79,131,.08), rgba(0,176,255,.08));
}
.donate-box label {
  display: block; font-size: clamp(11px, 1vw, 12px);
  color: var(--muted); font-weight: 600; margin-bottom: 6px;
}
.donate-wallet { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.donate-wallet input {
  flex: 1 1 200px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: clamp(11px, 1vw, 12px); color: var(--text);
  background: var(--input-bg); border: 1px solid var(--border-color);
  border-radius: 8px; padding: 10px; min-width: 0;
  user-select: all; -webkit-user-select: all;
}
.donate-copy-btn {
  flex: 0 0 auto; padding: 10px 14px; border-radius: 8px; border: 0;
  background: var(--accent); color: #fff; font-weight: 700;
  font-size: clamp(12px, 1.05vw, 13px); min-height: 40px; cursor: pointer;
  transition: background .2s, transform .12s;
}
.donate-copy-btn:hover { background: var(--accent2); }
.donate-copy-btn:active { transform: scale(.97); }
.donate-hint { margin-top: 8px; font-size: clamp(10px, .95vw, 11px); color: var(--muted); line-height: 1.5; }

/* SUPPORT */
.support-hero {
  display: flex; flex-direction: column; align-items: center;
  gap: 8px; text-align: center; padding: 4px 4px 12px;
}
.support-hero .support-img {
  width: 96px; height: 96px; border-radius: 24px;
  display: grid; place-items: center; font-size: 52px;
  background: linear-gradient(135deg, rgba(84,169,235,.25), rgba(255,79,131,.25));
  border: 2px solid var(--border-color); flex-shrink: 0;
}
.support-hero h3 { margin: 0; font-size: clamp(15px, 2vw, 18px); font-weight: 800; }
.support-hero p {
  margin: 0; color: var(--muted); font-size: clamp(12px, 1.1vw, 13px);
  line-height: 1.5; max-width: 380px;
}
.support-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.support-tag {
  padding: 6px 10px; border-radius: 999px;
  font-size: clamp(10.5px, 1vw, 12px); font-weight: 700;
  border: 1px solid transparent; background: var(--btn-bg); color: var(--text);
  cursor: pointer; transition: transform .12s, background .15s, border-color .15s;
  min-height: 0; line-height: 1.2;
}
.support-tag:hover { transform: translateY(-1px); }
.support-tag.selected { border-color: currentColor; transform: translateY(-1px); }
.support-tag.tag-sub   { background: rgba(255,79,131,.18); color: #ff4f83; }
.support-tag.tag-service { background: rgba(0,176,255,.18); color: #00b0ff; }
.support-tag.tag-idea  { background: rgba(255,179,71,.18); color: #ffb347; }
.support-tag.tag-help  { background: rgba(0,200,83,.18); color: #00c853; }
.support-tag.tag-bug   { background: rgba(200,51,154,.18); color: #c8339a; }
.support-tag.tag-other { background: rgba(125,139,153,.18); color: #7d8b99; }
.support-counter { display: flex; justify-content: flex-end; font-size: 11px; color: var(--muted); margin-top: 4px; }
.support-counter.warn { color: #ffb347; }
.support-counter.over { color: #ff4f83; }
.support-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.support-actions .action-button { flex: 1 1 140px; }

.support-photos {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin: 10px 0 4px;
}
.support-photo-slot {
  position: relative; aspect-ratio: 1;
  border: 1.5px dashed var(--border-color); border-radius: 10px;
  background: rgba(255,255,255,.03); display: grid; place-items: center;
  cursor: pointer; overflow: visible;
  transition: border-color .2s, background .2s; min-height: 0; padding: 0;
}
body.light-theme .support-photo-slot { background: rgba(0,0,0,.02); }
.support-photo-slot:hover { border-color: var(--accent); background: rgba(0,136,204,.08); }
.support-photo-slot.filled { border-style: solid; border-color: var(--accent); background: var(--input-bg); }
.support-photo-slot img {
  width: 100%; height: 100%; object-fit: cover;
  border-radius: 8px; display: block;
}
.support-photo-slot .slot-add {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: var(--muted); font-size: 20px; line-height: 1; pointer-events: none;
}
.support-photo-slot .slot-add small {
  font-size: 9px; text-transform: uppercase; letter-spacing: .06em;
  font-weight: 700; opacity: .8;
}
.support-photo-slot .slot-remove {
  position: absolute; right: -8px; top: -8px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #ff4f83; color: #fff;
  border: 2px solid var(--input-bg); font-size: 11px; font-weight: 700;
  display: grid; place-items: center; cursor: pointer; line-height: 1; padding: 0;
  min-height: 0; z-index: 4; box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.support-photo-slot .slot-remove:hover { background: #ff2d68; }
.support-photo-info { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 6px; line-height: 1.4; }

/* =========================================================
   NEW: Промокоды — только официальный шрифт, пустое состояние
   ========================================================= */
.promo-section-title {
  font-size: clamp(11px, 1vw, 12px); text-transform: uppercase;
  letter-spacing: .08em; color: var(--muted); font-weight: 700;
  margin: 14px 0 8px; display: flex; align-items: center; gap: 6px;
}
.promo-grid { display: grid; gap: 10px; }

/* NEW: пустое состояние промокодов */
.promo-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 32px 16px;
  border: 1px dashed var(--border-color);
  border-radius: 12px;
  background: rgba(255,255,255,.02);
  text-align: center;
}
body.light-theme .promo-empty { background: rgba(0,0,0,.02); }
.promo-empty .pe-emoji {
  font-size: 56px;
  line-height: 1;
  filter: grayscale(0.15);
  animation: sadBounce 2.4s ease-in-out infinite;
}
@keyframes sadBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.promo-empty .pe-text {
  font-size: clamp(12px, 1.1vw, 13px);
  color: var(--muted);
  max-width: 260px;
  line-height: 1.5;
}

.promo-item {
  display: flex; gap: 12px; align-items: stretch;
  border: 1px solid var(--border-color); border-radius: 12px;
  background: rgba(255,255,255,.03); overflow: hidden;
  position: relative;
}
body.light-theme .promo-item { background: rgba(0,0,0,.02); }
.promo-item .promo-ico {
  flex: 0 0 64px; display: grid; place-items: center;
  font-size: 30px; background: linear-gradient(135deg, rgba(84,169,235,.22), rgba(255,79,131,.22));
}
.promo-item .promo-body { flex: 1; padding: 10px 12px 10px 0; min-width: 0; }
.promo-item .promo-name {
  font-weight: 700; font-size: clamp(12px, 1.1vw, 13px);
  overflow-wrap: anywhere; margin-bottom: 4px;
}
.promo-item .promo-desc {
  font-size: clamp(10px, .95vw, 11px); color: var(--muted);
  line-height: 1.4; margin-bottom: 6px;
}
.promo-item .promo-code {
  display: inline-block; padding: 4px 8px; border-radius: 6px;
  background: var(--input-bg); border: 1px dashed var(--border-color);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: clamp(11px, 1vw, 12px); font-weight: 700;
  letter-spacing: .04em; user-select: all; -webkit-user-select: all;
  color: var(--text);
}
.promo-item .promo-actions {
  display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
}
.promo-btn {
  padding: 6px 10px; border-radius: 8px;
  background: var(--btn-bg); border: 1px solid var(--border-color);
  font-size: clamp(10.5px, .95vw, 11.5px); font-weight: 700;
  color: var(--text); cursor: pointer; min-height: 32px;
  transition: background .15s, border-color .15s;
}
.promo-btn:hover { background: var(--btn-bg-hover); border-color: var(--accent); }
.promo-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.promo-btn.primary:hover { background: var(--accent2); }
.promo-btn:disabled { opacity: .45; cursor: default; }
.promo-item.used { opacity: .6; }
.promo-item.used::after {
  content: "активирован";
  position: absolute; top: 8px; right: 10px;
  font-size: 9px; text-transform: uppercase; letter-spacing: .08em;
  color: #00c853; font-weight: 800;
}
.promo-input-row {
  display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap;
}
.promo-input-row input {
  flex: 1 1 180px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  text-transform: uppercase; letter-spacing: .04em;
}

/* =========================================================
   NEW: Новости — только официальный шрифт, адаптивные
   ========================================================= */
.news-list { display: grid; gap: 14px; }

.news-tile {
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border-color);
  background: #ffffff;
  color: #1a1a1a;
  position: relative;
  cursor: pointer;
  transition: transform .18s, box-shadow .18s;
  font-family: 'Inter', sans-serif;
  aspect-ratio: 9 / 3;
  min-height: 180px;
}
.news-tile:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.15); }

.news-photo {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 33.333%;
  overflow: hidden;
  background: #e8eef4;
}
.news-photo img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.news-photo .news-photo-emoji {
  width: 100%; height: 100%;
  display: grid; place-items: center;
  font-size: clamp(36px, 8vw, 64px);
  background: linear-gradient(135deg, rgba(84,169,235,.25), rgba(255,79,131,.25));
}
.news-fade {
  position: absolute;
  top: 0; bottom: 0;
  left: 33.333%;
  width: 5.555%;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, #ffffff 100%);
  pointer-events: none;
  z-index: 1;
}
.news-body {
  margin-left: calc(33.333% + 5.555%);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 6px;
  height: 100%;
  min-width: 0;
  background: #ffffff;
  color: #1a1a1a;
}
.news-headline {
  font-weight: 800;
  font-size: clamp(12px, 1.2vw, 14px);
  line-height: 1.25;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow-wrap: anywhere;
}
.news-meta {
  font-size: clamp(9.5px, .9vw, 11px);
  color: #707579;
  display: flex; gap: 8px; flex-wrap: wrap;
  align-items: center;
}
.news-meta .news-tag {
  padding: 2px 6px; border-radius: 6px;
  background: rgba(0,136,204,.12); color: #0088cc;
  font-weight: 700; font-size: 9.5px;
  text-transform: uppercase; letter-spacing: .04em;
}
.news-preview {
  font-size: clamp(10.5px, 1vw, 12px);
  color: #444;
  line-height: 1.4;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow-wrap: anywhere;
}
.news-actions {
  display: flex; gap: 6px; flex-wrap: wrap;
  align-items: center;
}
.news-action-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 9px; border-radius: 8px;
  border: 1px solid #d6dce1; background: #f4f6f8;
  font-size: 11px; font-weight: 700; color: #1a1a1a;
  cursor: pointer; min-height: 30px;
  transition: background .15s, border-color .15s, transform .12s;
}
.news-action-btn:hover { background: #e9eef3; border-color: #b9cddf; }
.news-action-btn:active { transform: scale(.96); }
.news-action-btn.liked { color: #ff4f83; border-color: #ff4f83; background: #ffe8ef; }
.news-action-btn .news-ico { font-size: 13px; }

/* NEW: детальный просмотр новости + комментарии */
.news-detail-photo {
  width: 100%; aspect-ratio: 16 / 9;
  border-radius: 12px; overflow: hidden; margin-bottom: 12px;
  background: linear-gradient(135deg, rgba(84,169,235,.25), rgba(255,79,131,.25));
  display: grid; place-items: center;
  font-size: 64px;
}
.news-detail-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.news-detail-title {
  font-size: clamp(15px, 1.6vw, 18px); font-weight: 800;
  margin: 0 0 6px; overflow-wrap: anywhere;
}
.news-detail-meta {
  font-size: 11px; color: var(--muted); margin-bottom: 10px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.news-detail-body {
  font-size: clamp(12px, 1.1vw, 13px); line-height: 1.6;
  white-space: pre-wrap; overflow-wrap: anywhere;
  margin-bottom: 14px;
}
.news-comments {
  border-top: 1px solid var(--border-color);
  padding-top: 10px; margin-top: 6px;
}
.news-comments-title {
  font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); font-weight: 700; margin-bottom: 8px;
}
.news-comment {
  border: 1px solid var(--border-color); border-radius: 10px;
  padding: 8px 10px; margin-bottom: 6px;
  font-size: 12px; line-height: 1.4; overflow-wrap: anywhere;
  background: rgba(255,255,255,.03);
}
body.light-theme .news-comment { background: rgba(0,0,0,.02); }
.news-comment .nc-name { font-weight: 700; font-size: 11px; color: var(--accent2); }
.news-comment .nc-text { margin-top: 2px; }
.news-comment-row {
  display: flex; gap: 6px; margin-top: 8px;
}
.news-comment-row input { flex: 1; }
.news-comment-row button { flex: 0 0 auto; padding: 0 14px; border-radius: 10px; }

/* ADAPTIVE */
@media (max-width: 900px) {
  :root { --app-padding: 14px; }
  main { max-width: 100%; }
}
@media (max-width: 700px) {
  :root { --app-padding: 12px; --bottom-bar-height: 52px; }
  .theme-grid { grid-template-columns: repeat(2, 1fr); }
  .color-grid { grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .color-input { height: 36px; }
  .result-card { max-width: min(260px, 68vw); }
  .gift-grid { grid-template-columns: 1fr 1fr; }
  .rules-grid { grid-template-columns: 1fr 1fr; }

      localStorage.removeItem(LAST_NAMES_KEY);

  } catch { return { one: "", two: "" }; }

function escapeHTML(v) {

}
function randomItem(list) { return list[Math.floor(Math.random() * list.length)]; }

}

function bindPhotoLoader(opts) {
  const { suffix, onSet, getPhoto } = opts;
  const uploadBtn = $(`photoUpload${suffix}`);
  const fileInput = $(`photoFile${suffix}`);
  const preview = $(`photoPreview${suffix}`);
  const previewImg = $(`photoPreview${suffix}Img`);
  const removeBtn = $(`photoRemove${suffix}`);

  if (!uploadBtn || !fileInput) return;

  uploadBtn.addEventListener("click", (e) => {
    e.preventDefault(); e.stopPropagation();
    fileInput.click();
  });

  fileInput.addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const okTypes = ["image/png", "image/jpeg", "image/jpg"];
    if (!okTypes.includes(f.type)) { showToast("Только PNG или JPG."); fileInput.value = ""; return; }
    if (f.size > PHOTO_MAX_BYTES) { showToast("Фото больше 2 МБ."); fileInput.value = ""; return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      if (!/^data:image\/(png|jpeg|jpg);base64,/.test(dataUrl)) { showToast("Некорректный файл."); return; }
      onSet(dataUrl);
      previewImg.src = dataUrl;
      preview.classList.add("visible");
      uploadBtn.classList.add("hidden");
      fileInput.value = "";
      refreshGameCards();
    };
    reader.readAsDataURL(f);
  });

  removeBtn.addEventListener("click", (e) => {
    e.stopPropagation(); e.preventDefault();
    onSet("");
    previewImg.src = "";
    preview.classList.remove("visible");
    uploadBtn.classList.remove("hidden");
    fileInput.value = "";
    refreshGameCards();
  });

  const existing = getPhoto();
  if (existing) {
    previewImg.src = existing;
    preview.classList.add("visible");
    uploadBtn.classList.add("hidden");
  }
}

function setupBarPhotoLoader(idx) {
  const suffix = idx === 1 ? "OneBar" : "TwoBar";
  bindPhotoLoader({
    suffix,
    onSet: (val) => { if (idx === 1) photoOne = val; else photoTwo = val; },
    getPhoto: () => (idx === 1 ? photoOne : photoTwo)
  });
}

function makeCharacter(gender, name, color, bg1, bg2, photo) {
  return {
    gender: gender || "Мужской",
    name: name || "",
    color: color || "#54a9eb",
    bg1: bg1 || "#1b5685",
    bg2: bg2 || "#10253f",
    photo: photo || "",
    symbol: gender === "Мужской" ? "♔" : "♕",
    portrait: gender === "Мужской" ? "🤴" : "👸"
  };
}

function readNameValue(idx) {
  const candidates = idx === 1 ? ["nameOneBar"] : ["nameTwoBar"];
  for (const id of candidates) {
    const el = $(id);
    if (el && el.value && el.value.trim()) return el.value;
  }
  return "";
}
function readCommentValue() {
  const el = $("battleCommentBar");
  return el && el.value ? el.value : "";
}

function buildCharacters() {
  const pair = selectedGender === "mm"
    ? ["Мужской","Мужской"]
    : selectedGender === "ff"
      ? ["Женский","Женский"]
      : ["Мужской","Женский"];

  const manualNames = [sanitizeName(readNameValue(1)), sanitizeName(readNameValue(2))];
  const usedNames = [];

  return pair.map((gender, index) => {
    let name = manualNames[index];
    if (!name) name = randomName(gender, usedNames);
    usedNames.push(name);

    const color = gender === "Мужской"
      ? (index === 0 ? "#77c5ff" : "#77f0d0")
      : (index === 0 ? "#ff8bb8" : "#d6a0ff");
    const bg1 = gender === "Мужской"
      ? (index === 0 ? "#1b5685" : "#176c5b")
      : (index === 0 ? "#8f2452" : "#603783");
    const bg2 = gender === "Мужской"
      ? (index === 0 ? "#10253f" : "#102f2d")
      : (index === 0 ? "#42142f" : "#281b42");

    const photo = index === 0 ? photoOne : photoTwo;
    return makeCharacter(gender, name, color, bg1, bg2, photo);
  });
}

/*
 * cardMarkup — рендер карты.
 * Фото/портрет внутри .card-photo. При перевороте (.card.flipped)
 * весь .card-front поворачивается, а img имеет backface-visibility: visible
 * и плавную анимацию появления — фото не «схлопывается».
 */
function cardMarkup(character, index, faceUp = false) {
  if (!character) return "";
  const isMale = character.gender === "Мужской";
  const symbol = character.symbol || (isMale ? "♔" : "♕");
  const portrait = character.portrait || (isMale ? "🤴" : "👸");
  const color = character.color || (isMale ? "#77c5ff" : "#ff8bb8");
  const bg1 = character.bg1 || (isMale ? "#1b5685" : "#8f2452");
  const bg2 = character.bg2 || (isMale ? "#10253f" : "#42142f");
  const name = character.name || "";
  const genderText = character.gender || "";

  const photoHtml = character.photo
    ? `<img src="${character.photo}" alt="" loading="lazy" draggable="false">`
    : escapeHTML(portrait);

  const front = `
    <div class="card-face card-front" style="
      --person-color:${color};
      --person-bg1:${bg1};
      --person-bg2:${bg2};">
      <div class="crown">${escapeHTML(symbol)}</div>
      <div class="card-photo">${photoHtml}</div>
      <div class="person-name">${escapeHTML(name)}</div>
      <div class="person-label">${escapeHTML(genderText)}</div>
    </div>`;

  return `
    <button type="button" class="card ${faceUp ? "flipped" : ""}" data-index="${index}">
      <span class="card-inner">
        <span class="card-face card-back"></span>
        ${front}
      </span>
    </button>`;
}

function cardWrapMarkup(character, index, faceUp = false) {
  return `
    <div class="card-wrap" data-wrap-index="${index}">
      ${cardMarkup(character, index, faceUp)}
      <div class="card-edit-overlay">
        <button type="button" class="card-edit-btn" data-edit-name="${index}" title="Изменить имя">✏️</button>
        <button type="button" class="card-edit-btn" data-edit-photo="${index}" title="Загрузить фото">📷</button>
        <button type="button" class="card-edit-btn" data-edit-gender="${index}" title="Изменить пол">👥</button>
      </div>
    </div>
  `;
}

function renderGameCards(faceUp) {
  const container = $("gameCards");
  container.innerHTML = cards.map((c,i) => cardWrapMarkup(c,i,faceUp)).join("");

  container.querySelectorAll(".card").forEach(card => {
    card.disabled = (phase !== "choice");

    btn.addEventListener("click", (e) => {

}

/* =========================================================
   РАУНД
   ========================================================= */
function startRound() {
  if (roundTimer) { clearInterval(roundTimer); roundTimer = null; }

  const rawOne = readNameValue(1);
  const rawTwo = readNameValue(2);
  const cleanOne = sanitizeName(rawOne);
  const cleanTwo = sanitizeName(rawTwo);

  if (rawOne.trim() && !cleanOne) {
    showToast("Имя 1: только буквы, пробел, дефис.");
    if ($("nameOneBar")) $("nameOneBar").value = "";
    return;
  }
  if (rawTwo.trim() && !cleanTwo) {
    showToast("Имя 2: только буквы, пробел, дефис.");
    if ($("nameTwoBar")) $("nameTwoBar").value = "";
    return;
  }

  if ($("nameOneBar")) $("nameOneBar").value = cleanOne;
  if ($("nameTwoBar")) $("nameTwoBar").value = cleanTwo;

  roundComment = sanitizeComment(readCommentValue());
  cards = buildCharacters();
  revealedNames = cards.map(c => c.name);
  saveLastNames(cards[0].name, cards[1].name);

  selectedCardIndex = -1;
  currentRecord = null;

  $("exitButton").classList.add("hidden");
  $("resultNote").value = "";
  $("resultNoteSaved").textContent = "";
  $("resultCard").innerHTML = "";
  $("flipButton").classList.add("hidden");

  closeBarPanels();

  setPhase("preview");
  $("gameStatus").textContent = "Запоминай карты";
  renderGameCards(true);

  let seconds = 3;
  roundTimer = setInterval(() => {
    seconds--;
    if (seconds > 0) {
      $("gameStatus").textContent = "Запоминай: " + seconds;
    } else {
      clearInterval(roundTimer);
      roundTimer = null;
      $("gameStatus").textContent = "Готов?";
      $("flipButton").classList.remove("hidden");
    }
  }, 1000);

  $("flipButton").onclick = () => {
    $("flipButton").classList.add("hidden");
    renderGameCards(false);
    shuffleCards();
  };
}

function shuffleCards() {
  const n = cards.length;
  if (n === 2) {
    if (Math.random() < 0.5) cards = [cards[1], cards[0]];
  } else {
    cards = cards.slice().sort(() => Math.random() - .5);
  }
  setPhase("choice");
  $("gameStatus").textContent = "Выбирай";
  renderGameCards(false);
}

function chooseCard(index) {
  if (phase !== "choice" || !cards[index]) return;
  if (selectedCardIndex !== -1) return;

  const chosen = cards[index];
  selectedCardIndex = index;

  setPhase("result");
  currentQuote = randomItem(loveQuotes);

  currentRecord = {
    id: (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
    gender: chosen.gender,
    name: chosen.name,
    symbol: chosen.symbol,
    portrait: chosen.portrait,
    photo: chosen.photo || "",
    color: chosen.color,
    bg1: chosen.bg1,
    bg2: chosen.bg2,
    comment: roundComment,
    quote: currentQuote,
    resultNote: "",
    resultNoteColor: noteColors[0].bg,
    pairType: selectedGender,
    bookmarkColor: bookmarkColors[0]
  };

  renderResult();
  saveRecord();
  $("exitButton").classList.remove("hidden");
}

function renderResult() {
  if (!currentRecord) return;
  const holder = $("resultCard");
  holder.innerHTML = "";

  const characterForResult = {
    gender: currentRecord.gender,
    name: currentRecord.name,
    symbol: currentRecord.symbol,
    portrait: currentRecord.portrait,
    photo: currentRecord.photo,
    color: currentRecord.color,
    bg1: currentRecord.bg1,
    bg2: currentRecord.bg2
  };

  holder.innerHTML = cardMarkup(characterForResult, 0, false);
  const card = holder.querySelector(".card");
  if (!card) return;

  card.disabled = true;
  card.setAttribute("aria-disabled", "true");
  card.tabIndex = -1;
  void card.offsetWidth;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      card.classList.add("flipped");
      card.classList.add("chosen");
    });
  });

  $("resultTitle").textContent = currentRecord.name || "";
  $("resultGender").textContent = genderLabel(currentRecord.gender);
  $("resultQuote").textContent = currentQuote;

  const comment = $("resultComment");
  if (roundComment) {
    comment.textContent = roundComment;
    comment.classList.remove("hidden");
  } else {
    comment.textContent = "";
    comment.classList.add("hidden");
  }

  $("resultNote").value = "";
  $("resultNoteSaved").textContent = "";
}

function saveRecord() {
  if (!currentRecord) return;
  const idx = archive.findIndex(i => i.id === currentRecord.id);
  if (idx >= 0) archive[idx] = {...currentRecord};
  else archive.unshift({...currentRecord});
  archive = archive.slice(0, 200);
  saveArchive();
}

function goBack() {
  if (roundTimer) { clearInterval(roundTimer); roundTimer = null; }
  setPhase("setup");
  $("flipButton").classList.add("hidden");
  refreshGameCards();
}

function newGame() {
  if (roundTimer) { clearInterval(roundTimer); roundTimer = null; }
  roundComment = "";
  currentRecord = null;
  selectedCardIndex = -1;
  $("resultCard").innerHTML = "";
  if ($("battleCommentBar")) $("battleCommentBar").value = "";
  setPhase("setup");
  refreshGameCards();
}

/* =========================================================
   ПОДСКАЗКИ — с кнопкой обновления (🔄)
   ========================================================= */
function closeSuggest() {
  if (suggestPanel) { suggestPanel.remove(); suggestPanel = null; }
  suggestExpanded = false;
}

function showSuggest(anchor, allTiles, refreshCb) {
  closeSuggest();
  const wrap = anchor.closest(".field-wrap") || anchor.parentElement;
  suggestPanel = document.createElement("div");
  suggestPanel.className = "suggest-panel";

  const visible = suggestExpanded ? allTiles : allTiles.slice(0, 5);
  visible.forEach(t => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "suggest-tile " + (t.type || "");
    btn.textContent = t.text;
    btn.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      t.onPick();
      closeSuggest();
    });
    suggestPanel.appendChild(btn);
  });

  if (refreshCb) {
    const refreshBtn = document.createElement("button");
    refreshBtn.type = "button";
    refreshBtn.className = "suggest-tile refresh";
    refreshBtn.innerHTML = `<span class="refresh-ico">🔄</span><span>Обновить</span>`;
    refreshBtn.title = suggestExpanded ? "Обновить список" : "Показать все и обновить";
    refreshBtn.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      refreshBtn.classList.add("spinning");
      setTimeout(() => refreshBtn.classList.remove("spinning"), 600);
      suggestExpanded = true;
      const fresh = refreshCb();
      showSuggest(anchor, fresh, refreshCb);
    });
    suggestPanel.appendChild(refreshBtn);
  }

  wrap.style.position = "relative";
  wrap.appendChild(suggestPanel);
}

function bindSuggestFor(el, kind, genderFn) {
  if (!el) return;

  const buildTiles = () => {
    if (kind === "name") {
      const gender = genderFn ? genderFn() : "Мужской";
      const pool = (gender === "Мужской" ? maleNames : femaleNames).slice();
      const shuffled = pool.slice().sort(() => Math.random() - 0.5);
      const subset = shuffled.slice(0, 30);
      return subset.map(name => ({
        text: name, type: "",
        onPick: () => { el.value = sanitizeName(name); refreshGameCards(); }
      }));
    } else {
      const pool = commentSuggestions.slice();
      const shuffled = pool.slice().sort(() => Math.random() - 0.5);
      return shuffled.map(item => ({
        text: item.text, type: item.type,
        onPick: () => { el.value = sanitizeComment(item.text); }
      }));
    }
  };

  const refreshCb = () => {
    suggestExpanded = true;
    return buildTiles();
  };

  el.addEventListener("focus", () => {
    suggestExpanded = false;
    const tiles = buildTiles();
    showSuggest(el, tiles, refreshCb);
  });
}

bindSuggestFor($("nameOneBar"), "name", () => (selectedGender === "ff") ? "Женский" : "Мужской");

});

function applyTheme(theme) {
  document.body.classList.toggle("light-theme", theme === "light");
  settings.themeMode = theme;
  saveSettings();
  updateThemeSwitch();
}
function updateThemeSwitch() {
  const sw = $("themeSwitch");
  if (!sw) return;
  const isLight = settings.themeMode === "light";
  sw.classList.toggle("is-light", isLight);
  sw.querySelector(".thumb").textContent = isLight ? "☀️" : "🌙";
  sw.setAttribute("aria-checked", isLight ? "true" : "false");
}

function applyBgIcons(setIndex) {
  const set = bgIconSets[setIndex];
  if (!set) return;
  const cell = 60, cols = 4, rows = 4, size = cols * cell;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = (r * cols + c) % set.icons.length;
      const emoji = set.icons[idx];
      const x = c * cell + cell / 2;
      const y = r * cell + cell / 2 + 12;
      svg += `<text x="${x}" y="${y}" font-size="28" text-anchor="middle" fill="#888" opacity="0.9">${emoji}</text>`;
    }
  }
  svg += `</svg>`;
  const dataUri = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
  document.body.style.setProperty("--bg-icons", dataUri);
  settings.bgIconsSet = setIndex;
  saveSettings();
}

  } else if (type === "about") {
