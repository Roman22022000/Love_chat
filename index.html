<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Переворот</title>
<style>
/* =========================================================
   ШРИФТЫ
   ========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@700&family=Pacifico&display=swap');

:root {
  --tg-blue: #0088cc;
  --tg-blue-light: #54a9eb;
  --bg-dark: #17212b;
  --panel-dark: #232e3c;
  --header-dark: #1c2733;
  --text-dark: #e4ecf3;
  --muted-dark: #7d8b99;
  --border-dark: #2f3d4c;

  --bg-light: #e6ebee;
  --panel-light: #ffffff;
  --header-light: #ffffff;
  --text-light: #1a1a1a;
  --muted-light: #707579;
  --border-light: #d6dce1;

  --accent: var(--tg-blue);
  --accent2: var(--tg-blue-light);
  --panel: var(--panel-dark);
  --text: var(--text-dark);
  --muted: var(--muted-dark);
  --border-color: var(--border-dark);
  --menu-bg: var(--header-dark);
  --modal-bg: var(--panel-dark);
  --input-bg: #1e2836;
  --btn-bg: rgba(255,255,255,.06);
  --btn-bg-hover: rgba(255,255,255,.12);

  --card-radius: 14px;
  --bottom-bar-height: 52px;
  --app-padding: clamp(12px, 3vw, 18px);
  --app-bottom-padding: clamp(80px, 12vh, 96px);
}

body.light-theme {
  --panel: var(--panel-light);
  --text: var(--text-light);
  --muted: var(--muted-light);
  --border-color: var(--border-light);
  --menu-bg: var(--header-light);
  --modal-bg: var(--panel-light);
  --input-bg: #f4f4f5;
  --btn-bg: rgba(0,0,0,.04);
  --btn-bg-hover: rgba(0,0,0,.08);
}

* { box-sizing: border-box; }
html { min-height: 100%; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: clamp(13px, 1.05vw, 14px);
  line-height: 1.4;
  background: linear-gradient(-45deg,#17212b,#2b5278,#17212b,#4a76a8,#1c2733);
  background-size: 400% 400%;
  animation: wallpaper 20s ease infinite;
  user-select: none;
  -webkit-user-select: none;
  transition: color .3s;
  -webkit-font-smoothing: antialiased;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: var(--bg-icons, none);
  background-size: clamp(120px, 20vw, 200px) clamp(120px, 20vw, 200px);
  background-repeat: repeat;
  opacity: 0.06;
  filter: grayscale(100%);
}
body.light-theme::before { opacity: 0.05; }

@keyframes wallpaper {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

button, input, textarea { font: inherit; }
button {
  color: var(--text);
  border: 1px solid var(--border-color);
  background: var(--btn-bg);
  cursor: pointer;
  border-radius: 8px;
  transition: transform .15s, background .15s;
  min-height: 44px;
  touch-action: manipulation;
}
button:hover { background: var(--btn-bg-hover); }
button:active { transform: scale(.98); }
button:disabled { opacity: .4; cursor: default; }

input, textarea {
  color: var(--text);
  background: var(--input-bg);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: clamp(9px, 1.6vw, 11px) clamp(10px, 1.8vw, 13px);
  outline: none;
  width: 100%;
  font-size: clamp(13px, 1.05vw, 14px);
  transition: border-color .2s;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 72px; user-select: text; -webkit-user-select: text; }
button, .card, .star { -webkit-tap-highlight-color: transparent; }

.panel, .bottom-bar, .profile-menu, .modal, .card, .card-inner,
.card-face, .gender-option, .form-section, .dropdown, .toast,
.theme-switch, .profile-avatar-preview, .profile-button,
.back-button, .action-button, .small-button, .icon-button {
  box-shadow: none !important;
}
button:focus, button:focus-visible, input:focus, textarea:focus {
  outline: none !important;
  box-shadow: none !important;
}

/* =========================================================
   ЭКРАН ЗАГРУЗКИ
   ========================================================= */
#splashScreen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 45%, rgba(84,169,235,.2), transparent 60%),
    linear-gradient(160deg, #17212b 0%, #2b5278 50%, #0e1620 100%);
  padding: 20px;
  text-align: center;
  transition: opacity .5s ease;
}
#splashScreen.fade-out { opacity: 0; pointer-events: none; }

.splash-table {
  position: relative;
  width: min(340px, 80vw);
  height: clamp(140px, 24vw, 180px);
  margin-bottom: 24px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(10px, 3vw, 18px);
}
.splash-card {
  width: clamp(60px, 15vw, 90px);
  height: clamp(86px, 21.6vw, 130px);
  border-radius: 12px;
  border: 2px solid #c9a050;
  background:
    radial-gradient(circle at 50% 40%, rgba(84,169,235,.2), transparent 50%),
    linear-gradient(145deg,#232e3c,#4a76a8 52%,#17212b);
  position: relative;
  display: grid;
  place-items: center;
  font-size: clamp(22px, 6vw, 34px);
  color: #a8d4ff;
  animation: cardFloat 3s ease-in-out infinite;
}
.splash-card:nth-child(2) { animation-delay: .6s; }
.splash-card::before { content: "✦"; }
@keyframes cardFloat {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}
.splash-crowd {
  position: absolute;
  inset: -40px -30px;
  pointer-events: none;
  font-size: clamp(16px, 4vw, 24px);
  opacity: .6;
}
.splash-crowd span {
  position: absolute;
  animation: crowdSway 3.5s ease-in-out infinite;
}
.splash-crowd span:nth-child(1) { top: -10px; left: 15%; }
.splash-crowd span:nth-child(2) { top: -5px; right: 18%; animation-delay: .4s; }
.splash-crowd span:nth-child(3) { top: 20%; left: -10px; animation-delay: .8s; }
.splash-crowd span:nth-child(4) { top: 18%; right: -12px; animation-delay: 1.2s; }
.splash-crowd span:nth-child(5) { bottom: -15px; left: 25%; animation-delay: .6s; }
.splash-crowd span:nth-child(6) { bottom: -18px; right: 22%; animation-delay: 1s; }
@keyframes crowdSway {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-5px) scale(1.06); }
}
.splash-title {
  font-family: 'Pacifico', cursive;
  font-size: clamp(24px, 6vw, 42px);
  font-weight: 700;
  color: #fff;
  margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(84,169,235,.5);
}
.splash-sub {
  font-size: clamp(12px, 3vw, 16px);
  color: #a8d4ff;
  margin-bottom: 28px;
  letter-spacing: .05em;
}
.splash-bar {
  width: min(240px, 70vw);
  height: 6px;
  background: rgba(255,255,255,.15);
  border-radius: 3px;
  overflow: hidden;
}
.splash-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--tg-blue), var(--tg-blue-light));
  border-radius: 3px;
  animation: splashLoad 3s ease forwards;
}
@keyframes splashLoad {
  from { width: 0%; }
  to { width: 100%; }
}

/* =========================================================
   ОСНОВНОЙ КАРКАС
   ========================================================= */
.app {
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 1080px;
  margin: auto;
  padding: var(--app-padding);
  padding-bottom: var(--app-bottom-padding);
  padding-bottom: max(var(--app-bottom-padding), env(safe-area-inset-bottom));
  position: relative;
  z-index: 1;
}

.topline {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  position: relative;
  z-index: 10;
}
.icon-button {
  width: clamp(36px, 5vw, 40px);
  height: clamp(36px, 5vw, 40px);
  border-radius: 50%;
  font-size: clamp(18px, 2.6vw, 22px);
  display: grid; place-items: center;
  background: var(--btn-bg);
  border: 1px solid var(--border-color);
  color: var(--text);
  min-height: 0;
}
.dropdown {
  position: absolute;
  top: calc(100% + 8px); right: 0;
  width: min(260px, calc(100vw - 24px));
  padding: 6px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  background: var(--menu-bg);
  z-index: 30;
}
.dropdown button {
  width: 100%; text-align: left;
  padding: 10px 12px; border-radius: 8px;
  border-color: transparent; background: transparent;
  font-size: clamp(13px, 1.1vw, 14px);
  min-height: 40px;
}
.dropdown button:hover { background: var(--btn-bg-hover); }

main { width: 100%; max-width: 800px; margin: 14px auto 0; }
.hero { text-align: center; padding: 10px 8px clamp(12px, 2.4vw, 16px); }
.eyebrow {
  color: var(--accent2);
  text-transform: uppercase;
  letter-spacing: .2em;
  font-size: clamp(10px, 1vw, 11px);
  font-weight: 600;
}
h1 {
  font-family: 'Pacifico', cursive;
  font-size: clamp(28px, 7vw, 52px);
  margin: 8px 0;
  letter-spacing: .01em;
  font-weight: 700;
  color: var(--text);
  text-shadow: 0 2px 10px rgba(0,0,0,.25);
  line-height: 1.1;
  overflow-wrap: anywhere;
}
.subtitle {
  color: var(--muted);
  line-height: 1.5;
  margin: 0 auto;
  max-width: 520px;
  font-size: clamp(13px, 1.2vw, 15px);
  padding: 0 4px;
}

.panel {
  border: 1px solid var(--border-color);
  border-radius: clamp(12px, 2vw, 16px);
  background: var(--panel);
  padding: clamp(13px, 2.6vw, 22px);
  margin-bottom: 14px;
}
.section-title { font-size: clamp(14px, 1.3vw, 15px); font-weight: 700; margin: 0 0 12px; }
.muted { color: var(--muted); font-size: clamp(12px, 1.1vw, 13px); line-height: 1.5; }

/* =========================================================
   ВЫБОР ПАРЫ
   ========================================================= */
.gender-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(6px, 1.2vw, 8px);
}
.gender-option {
  border-radius: 12px;
  padding: clamp(8px, 1.8vw, 12px) 4px;
  min-height: clamp(70px, 12vw, 84px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  line-height: 1.2;
  font-size: clamp(9px, 1.05vw, 11px);
  letter-spacing: .03em;
  text-transform: uppercase;
  font-weight: 600;
  border: 1px solid var(--border-color);
  background: var(--btn-bg);
  text-align: center;
  overflow-wrap: anywhere;
}
.gender-option .pair-icons {
  display: flex;
  gap: 4px;
  font-size: clamp(18px, 4vw, 26px);
  line-height: 1;
}
.gender-option.selected {
  border-color: var(--accent);
  background: rgba(0,136,204,.15);
  color: var(--accent2);
}

/* =========================================================
   ФОРМА
   ========================================================= */
.form-section {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border-color);
  transition: opacity .3s ease, filter .3s ease;
  opacity: .55;
  filter: grayscale(85%);
}
.form-section.is-active { opacity: 1; filter: grayscale(0%); }
.form-section-title {
  font-size: clamp(11px, 1vw, 12px);
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 10px;
}
.name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 1.4vw, 10px); }
.field-label {
  display: block;
  font-size: clamp(11px, 1vw, 12px);
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}
.comment-box { margin-top: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

/* =========================================================
   КНОПКИ
   ========================================================= */
.primary {
  border: 0 !important;
  background: linear-gradient(135deg, #00c853, #00b0ff, #ff9100, #00c853, #00b0ff, #ff9100) !important;
  background-size: 400% 400% !important;
  animation: btnGlow 6s ease infinite;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,.35);
}
.primary:hover {
  background: linear-gradient(135deg, #00e676, #40c4ff, #ffab40, #00e676, #40c4ff, #ffab40) !important;
  background-size: 400% 400% !important;
  animation: btnGlow 3s ease infinite;
}
@keyframes btnGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.action-button {
  min-height: clamp(40px, 6vw, 45px);
  padding: clamp(9px, 1.6vw, 12px) clamp(12px, 2.2vw, 18px);
  border-radius: 10px;
  font-size: clamp(13px, 1.1vw, 14px);
}
.actions .primary { flex: 1; }
.hidden { display: none !important; }

.status {
  min-height: 22px;
  margin: 0 0 12px;
  text-align: center;
  color: var(--muted);
  font-size: clamp(12px, 1.1vw, 13px);
}

/* =========================================================
   КАРТЫ
   ========================================================= */
.cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(10px, 2.4vw, 20px);
  max-width: 560px;
  margin: 0 auto;
}
.card {
  width: 100%;
  aspect-ratio: 3 / 4;
  perspective: 1000px;
  padding: 0; border: 0; background: transparent;
  border-radius: var(--card-radius);
  min-width: 0;
  min-height: 0;
}
.card:disabled { opacity: 1; cursor: default; }
.card-inner {
  display: block;
  position: relative;
  width: 100%; height: 100%;
  border-radius: var(--card-radius);
  transform-style: preserve-3d;
  transition: transform .72s cubic-bezier(.2,.75,.2,1);
}
.card.flipped .card-inner { transform: rotateY(180deg); }
.card-face {
  display: flex;
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  box-sizing: border-box;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: var(--card-radius);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.card-back {
  background:
    radial-gradient(circle at 50% 40%, rgba(84,169,235,.15), transparent 45%),
    linear-gradient(145deg,#232e3c,#4a76a8 52%,#17212b);
  border: 1px solid var(--border-color);
}
.card-back::before {
  content: "✦";
  display: grid;
  place-items: center;
  width: clamp(40px, 12vw, 70px);
  height: clamp(40px, 12vw, 70px);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 50%;
  font-size: clamp(20px, 5vw, 32px);
  color: #a8d4ff;
}
.card-front {
  transform: rotateY(180deg);
  border: 2px solid var(--person-color, #54a9eb);
  background:
    radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.1), transparent 50%),
    linear-gradient(150deg,var(--person-bg1,#1b5685),var(--person-bg2,#10253f));
  padding: clamp(6px, 1.4vw, 12px);
}
.card-front .crown { font-size: clamp(20px, 5vw, 40px); margin-bottom: 6px; }
.card-front .portrait {
  display: grid;
  place-items: center;
  width: 64%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.35);
  background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.25), transparent 45%), rgba(255,255,255,.06);
  font-size: clamp(32px, 8vw, 66px);
}
.card-front .person-name {
  margin-top: clamp(6px, 1.4vw, 12px);
  font-size: clamp(12px, 2.6vw, 18px);
  font-weight: 800;
  text-align: center;
  overflow-wrap: anywhere;
  padding: 0 2px;
}
.card-front .person-label {
  margin-top: 4px;
  color: rgba(255,255,255,.75);
  font-size: clamp(8px, 1vw, 10px);
  letter-spacing: .12em;
  text-transform: uppercase;
}
.card.chosen .card-inner { filter: drop-shadow(0 0 14px rgba(84,169,235,.5)); }

/* =========================================================
   РЕЗУЛЬТАТ
   ========================================================= */
.result-card { max-width: min(280px, 70vw); margin: 0 auto; }
.result-summary { text-align: center; margin-top: 16px; }
.result-summary h2 {
  font-size: clamp(17px, 2.2vw, 20px);
  margin: 0 0 6px;
  font-weight: 700;
  overflow-wrap: anywhere;
  padding: 0 4px;
}
.result-summary p {
  margin: 4px 0;
  color: var(--muted);
  line-height: 1.5;
  overflow-wrap: anywhere;
  font-size: clamp(12px, 1.15vw, 14px);
  padding: 0 4px;
}
.result-quote {
  font-style: italic;
  font-size: clamp(12px, 1.2vw, 14px);
  color: var(--text);
  padding: clamp(10px, 1.8vw, 12px) clamp(12px, 2vw, 16px);
  margin: 10px 0;
  border-left: 3px solid var(--accent);
  background: rgba(0,136,204,.1);
  border-radius: 8px;
  text-align: left;
  line-height: 1.55;
}
body.light-theme .result-quote { background: rgba(0,136,204,.08); }
.result-comment {
  text-align: left;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border-color);
  font-size: clamp(12px, 1.1vw, 13px);
}
.rating { display: flex; justify-content: center; gap: 4px; margin: 10px 0 4px; flex-wrap: wrap; }
.star {
  padding: 0 2px;
  background: transparent;
  border: 0;
  outline: none;
  color: #7d8b99;
  font-size: clamp(24px, 4vw, 28px);
  line-height: 1.2;
  min-height: 0;
  min-width: 0;
}
.star:hover, .star:focus { background: transparent; border: 0; outline: none; }
.star.active, .star.hovered { color: #ffd166; }

.result-note-box {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border-color);
  text-align: left;
}
.result-note-box label {
  font-size: clamp(11px, 1vw, 12px);
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 6px;
  display: block;
}
.result-note-box textarea { min-height: 60px; font-size: clamp(12px, 1.05vw, 13px); }
.result-note-saved {
  font-size: 11px;
  color: #00c853;
  margin-top: 4px;
  min-height: 14px;
  font-weight: 600;
}

/* =========================================================
   АРХИВ
   ========================================================= */
.archive-list { display: grid; gap: 10px; margin-top: 12px; }
.archive-item {
  border: 1px solid var(--border-color);
  background: rgba(255,255,255,.03);
  padding: clamp(10px, 1.8vw, 12px) clamp(10px, 1.8vw, 12px) clamp(10px, 1.8vw, 12px) 26px;
  border-radius: 12px;
  min-width: 0;
  position: relative;
}
/* Язычок змеи */
.archive-item::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 12px;
  bottom: 12px;
  width: 6px;
  border-radius: 3px;
  background: var(--bookmark-color, #ffd166);
  clip-path: polygon(
    0 0, 100% 0, 100% 45%, 50% 45%, 100% 50%, 50% 55%, 100% 55%, 100% 100%, 0 100%
  );
}
.archive-item::after {
  content: "";
  position: absolute;
  left: 12px;
  top: 50%;
  width: 10px;
  height: 6px;
  transform: translateY(-50%);
  background: var(--bookmark-color, #ffd166);
  clip-path: polygon(0 0, 100% 30%, 80% 50%, 100% 70%, 0 100%, 20% 50%);
}

.archive-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.archive-title {
  font-weight: 700;
  overflow-wrap: anywhere;
  font-size: clamp(13px, 1.2vw, 14px);
  min-width: 0;
}
.archive-meta {
  color: var(--muted);
  font-size: clamp(11px, 1vw, 12px);
  margin-top: 6px;
  line-height: 1.5;
}
.archive-comment {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border-color);
  color: var(--text);
  font-size: clamp(11px, 1vw, 12px);
  line-height: 1.5;
  opacity: .85;
}
.archive-stars { color: #ffd166; letter-spacing: 1.5px; }

.archive-note-row {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.archive-note-row textarea {
  flex: 1 1 100%;
  min-height: 50px;
  font-size: clamp(11px, 1vw, 12px);
}

.archive-share-btn {
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--btn-bg);
  border: 1px solid var(--border-color);
  font-size: clamp(11px, 1vw, 12px);
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 32px;
  flex-shrink: 0;
}
.archive-share-btn:hover { background: var(--btn-bg-hover); }

.archive-note-display {
  margin-top: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: clamp(11px, 1vw, 12px);
  line-height: 1.5;
  color: #1a1a1a;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bookmark-picker {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 8px;
  align-items: center;
}
.bookmark-picker .bk-label {
  font-size: clamp(10px, .95vw, 11px);
  color: var(--muted);
  font-weight: 600;
  margin-right: 4px;
}
.bookmark-color-btn {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--border-color);
  padding: 0;
  cursor: pointer;
  transition: transform .15s;
  min-height: 0;
}
.bookmark-color-btn:hover { transform: scale(1.15); }
.bookmark-color-btn.selected { border-color: var(--text); transform: scale(1.18); }

/* =========================================================
   НИЖНЯЯ ПАНЕЛЬ
   ========================================================= */
.bottom-bar {
  position: fixed;
  z-index: 20;
  bottom: max(10px, env(safe-area-inset-bottom, 10px));
  left: 50%;
  transform: translateX(-50%);
  width: min(760px, calc(100% - 20px));
  height: var(--bottom-bar-height);
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 26px;
  background: var(--menu-bg);
  border: 1px solid var(--border-color);
  transition: transform .4s cubic-bezier(.2,.75,.2,1), opacity .3s ease;
}
.bottom-bar.is-hidden {
  transform: translate(-50%, calc(100% + 30px));
  opacity: 0;
  pointer-events: none;
}
.back-button {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  border-radius: 50%;
  font-size: 18px;
  display: grid;
  place-items: center;
  background: var(--btn-bg);
  border: 1px solid var(--border-color);
  color: var(--text);
  min-height: 0;
}
.back-button:hover { background: var(--btn-bg-hover); }
.back-button.hidden { display: none !important; }
.profile-button {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  border-radius: 50%;
  background: var(--tg-blue);
  border: 0;
  display: grid;
  place-items: center;
  font-size: 16px;
  overflow: hidden;
  color: #fff;
  min-height: 0;
}

.bottom-revealed-names {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
  margin-left: 4px;
  padding-left: 8px;
  border-left: 1px solid var(--border-color);
  font-size: 11px;
  color: var(--muted);
  max-width: min(280px, 45vw);
  min-width: 0;
}
.bottom-revealed-names .rev-name {
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(0,136,204,.25);
  color: var(--text);
  font-weight: 600;
  white-space: nowrap;
  font-size: clamp(10px, .95vw, 11px);
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.bottom-revealed-names .rev-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .08em;
  opacity: .7;
  width: 100%;
  margin-bottom: 2px;
}

/* =========================================================
   МЕНЮ ПРОФИЛЯ
   ========================================================= */
.profile-menu {
  position: fixed;
  z-index: 40;
  bottom: calc(max(10px, env(safe-area-inset-bottom, 10px)) + var(--bottom-bar-height) + 10px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  width: min(320px, calc(100vw - 20px));
  padding: 12px;
  border-radius: 14px;
  background: var(--menu-bg);
  border: 1px solid var(--border-color);
  opacity: 0;
  pointer-events: none;
  transition: transform .35s cubic-bezier(.2,.75,.2,1), opacity .3s ease;
  max-height: min(80vh, 600px);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.profile-menu.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.profile-menu-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 10px;
}
.profile-avatar-preview {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--tg-blue);
  display: grid;
  place-items: center;
  font-size: 24px;
  flex-shrink: 0;
  border: 2px solid var(--border-color);
  overflow: hidden;
}
.profile-menu-name {
  font-size: 14px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.profile-menu-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.profile-menu-list { display: grid; gap: 2px; }
.profile-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  font-size: clamp(12px, 1.1vw, 13px);
  transition: background .15s;
  min-height: 40px;
}
.profile-menu-item:hover { background: var(--btn-bg-hover); }
.profile-menu-item .icon { width: 20px; text-align: center; font-size: 15px; flex-shrink: 0; }
.profile-menu-item .label { flex: 1; min-width: 0; }
.profile-menu-divider { height: 1px; background: var(--border-color); margin: 4px 0; }

/* Подписка — градиентный текст */
.subscribe-btn {
  background: var(--btn-bg) !important;
  border: 1px solid var(--border-color) !important;
  font-weight: 800;
}
.subscribe-btn:hover { background: var(--btn-bg-hover) !important; }
.subscribe-btn .label {
  background: linear-gradient(90deg, #ff4f83, #ffb347, #00c853, #00b0ff, #c8339a, #ff4f83);
  background-size: 400% 400%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  animation: rainbowFlow 3s ease infinite;
  font-weight: 800;
  letter-spacing: .02em;
}
.subscribe-btn:hover .label { animation: rainbowFlow 1.6s ease infinite; }
.subscribe-btn .icon { -webkit-text-fill-color: initial; }
@keyframes rainbowFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* =========================================================
   ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ
   ========================================================= */
.theme-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
}
.theme-toggle-label { font-size: clamp(12px, 1.1vw, 13px); font-weight: 600; }
.theme-switch {
  position: relative;
  width: 60px;
  height: 30px;
  border-radius: 15px;
  background: #2b3a4a;
  border: 1px solid var(--border-color);
  cursor: pointer;
  transition: background .35s;
  flex-shrink: 0;
  padding: 0;
  overflow: hidden;
  min-height: 0;
}
.theme-switch .thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ffd166;
  display: grid;
  place-items: center;
  font-size: 12px;
  transition: transform .35s cubic-bezier(.2,.75,.2,1), background .35s;
}
.theme-switch.is-light { background: #cfe3f5; }
.theme-switch.is-light .thumb { transform: translateX(30px); background: #ffffff; }

/* =========================================================
   МОДАЛКИ
   ========================================================= */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: clamp(10px, 2vw, 16px);
  padding-bottom: max(clamp(10px, 2vw, 16px), env(safe-area-inset-bottom));
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(6px);
}
body.light-theme .modal-backdrop { background: rgba(0,0,0,.35); }
.modal {
  width: min(520px, 100%);
  max-height: min(85vh, 90dvh);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--modal-bg);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: clamp(14px, 2.4vw, 18px);
}
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.modal-head h2 { font-size: clamp(15px, 1.5vw, 17px); margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.close-button { border-radius: 50%; width: 32px; height: 32px; min-height: 0; flex-shrink: 0; }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.theme-button {
  border-radius: 10px;
  padding: 10px;
  min-height: 56px;
  text-align: left;
  font-size: clamp(11px, 1vw, 12px);
  overflow: hidden;
  min-height: 0;
}
.theme-swatch { height: 20px; border-radius: 6px; margin-bottom: 6px; }
.color-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
.color-input { padding: 3px; height: 40px; cursor: pointer; min-height: 0; }
hr { border: 0; border-top: 1px solid var(--border-color); margin: 14px 0; }

.toast {
  position: fixed;
  z-index: 80;
  left: 50%;
  bottom: calc(max(10px, env(safe-area-inset-bottom, 10px)) + 76px);
  transform: translateX(-50%);
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--menu-bg);
  border: 1px solid var(--border-color);
  color: var(--text);
  font-size: clamp(12px, 1.1vw, 13px);
  max-width: calc(100% - 20px);
  text-align: center;
}

.emoji-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.emoji-option {
  aspect-ratio: 1;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: clamp(20px, 4vw, 26px);
  background: var(--btn-bg);
  border: 2px solid transparent;
  padding: 0;
  cursor: pointer;
  transition: border-color .15s, transform .12s;
  min-height: 0;
}
.emoji-option:hover { transform: translateY(-2px); background: var(--btn-bg-hover); }
.emoji-option.selected {
  border-color: var(--accent);
  background: rgba(0,136,204,.15);
}

/* =========================================================
   ВЫПАДАЮЩИЕ ПЛИТКИ
   ========================================================= */
.suggest-panel {
  position: absolute;
  z-index: 60;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  max-height: min(240px, 40vh);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px;
  border-radius: 12px;
  background: var(--menu-bg);
  border: 1px solid var(--border-color);
  display: grid;
  gap: 5px;
}
.suggest-panel.hidden { display: none; }

.suggest-tile {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 11px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: #ffffff;
  color: #1a1a1a;
  font-size: clamp(12px, 1.1vw, 13px);
  line-height: 1.4;
  cursor: pointer;
  transition: transform .12s, background .12s;
  white-space: normal;
  min-height: 0;
  overflow-wrap: anywhere;
}
.suggest-tile:hover { transform: translateY(-1px); background: #f0f0f0; }
.suggest-tile:active { transform: scale(.98); }

.suggest-tile.more {
  background: var(--accent);
  color: #fff;
  text-align: center;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 2px;
  padding: 8px;
}
.suggest-tile.more:hover { background: var(--accent2); }

.suggest-tile.rainbow {
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.4);
  background: linear-gradient(135deg, #ff4f83, #ffb347, #00c853, #00b0ff, #c8339a, #ff4f83);
  background-size: 400% 400%;
  animation: rainbowFlow 4s ease infinite;
}
.suggest-tile.rainbow:hover { animation: rainbowFlow 2s ease infinite; }

.suggest-tile.blue {
  background: linear-gradient(135deg, #a8e0ff, #5bc0ff);
  color: #0a2540;
}
.suggest-tile.blue:hover { background: linear-gradient(135deg, #c2ecff, #7dcfff); }

.suggest-tile.pink {
  background: linear-gradient(135deg, #ffc2d9, #ff8fb8);
  color: #4a0d28;
}
.suggest-tile.pink:hover { background: linear-gradient(135deg, #ffd6e6, #ffa8c9); }

.field-wrap { position: relative; }

/* =========================================================
   ЧЕК / БИЛЕТ
   ========================================================= */
.ticket {
  background: #ffffff;
  color: #1a1a1a;
  border-radius: 12px;
  padding: clamp(12px, 2.4vw, 16px);
  font-family: 'Inter', sans-serif;
  position: relative;
  border: 1px dashed #b0b0b0;
  overflow: hidden;
}
.ticket::before, .ticket::after {
  content: "";
  position: absolute;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--modal-bg);
  left: -12px;
}
.ticket::before { top: 20px; }
.ticket::after { bottom: 20px; }
.ticket-head {
  font-family: 'Pacifico', cursive;
  font-size: clamp(16px, 2.4vw, 20px);
  text-align: center;
  margin-bottom: 8px;
  color: #1a1a1a;
}
.ticket-divider { border-top: 1px dashed #b0b0b0; margin: 10px 0; }
.ticket-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 0;
  font-size: clamp(12px, 1.1vw, 13px);
  flex-wrap: wrap;
}
.ticket-row .k { color: #707579; font-weight: 600; }
.ticket-row .v { color: #1a1a1a; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
.ticket-note {
  margin-top: 8px;
  padding: 8px;
  border-radius: 6px;
  font-size: clamp(11px, 1vw, 12px);
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* =========================================================
   ПОДПИСКА
   ========================================================= */
.sub-section { margin-top: 6px; }
.sub-section-title {
  font-size: clamp(11px, 1vw, 12px);
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  font-weight: 700;
  margin: 14px 0 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sub-cards { display: grid; gap: 8px; }
.sub-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: clamp(10px, 1.8vw, 12px) clamp(10px, 1.8vw, 14px);
  border-radius: 12px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border-color);
  transition: transform .15s, border-color .15s;
  min-width: 0;
}
.sub-card:hover { transform: translateY(-1px); border-color: var(--accent); }
.sub-card .sub-ico {
  width: clamp(32px, 6vw, 38px);
  height: clamp(32px, 6vw, 38px);
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: clamp(16px, 3vw, 20px);
  flex-shrink: 0;
  background: linear-gradient(135deg, rgba(255,79,131,.25), rgba(0,176,255,.25));
}
.sub-card .sub-info { flex: 1; min-width: 0; }
.sub-card .sub-name {
  font-weight: 700;
  font-size: clamp(12px, 1.15vw, 13.5px);
  color: var(--text);
  overflow-wrap: anywhere;
}
.sub-card .sub-sub {
  font-size: clamp(10px, .95vw, 11px);
  color: var(--muted);
  margin-top: 2px;
  overflow-wrap: anywhere;
}
.sub-card .sub-price {
  font-weight: 800;
  font-size: clamp(13px, 1.4vw, 15px);
  background: linear-gradient(90deg, #ff4f83, #ffb347, #00c853, #00b0ff);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbowFlow 4s ease infinite;
  white-space: nowrap;
  flex-shrink: 0;
}
.sub-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  background: rgba(0,200,83,.18);
  color: #00c853;
  margin-left: 6px;
  vertical-align: middle;
}
.sub-note {
  font-size: clamp(10px, 1vw, 11px);
  color: var(--muted);
  margin-top: 12px;
  text-align: center;
  line-height: 1.5;
}

/* =========================================================
   АДАПТИВНОСТЬ
   ========================================================= */

/* Планшеты */
@media (max-width: 900px) {
  :root { --app-padding: 14px; }
  main { max-width: 100%; }
}

/* Малые планшеты / большие телефоны */
@media (max-width: 700px) {
  :root {
    --app-padding: 12px;
    --bottom-bar-height: 50px;
  }
  .theme-grid { grid-template-columns: repeat(2, 1fr); }
  .color-grid { grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .color-input { height: 36px; }
  .result-card { max-width: min(260px, 68vw); }
}

/* Телефоны */
@media (max-width: 540px) {
  :root {
    --app-padding: 10px;
    --app-bottom-padding: 78px;
    --bottom-bar-height: 46px;
  }
  .hero { padding: 6px 4px 12px; }
  h1 { font-size: clamp(26px, 8vw, 34px); }
  .subtitle { font-size: 12.5px; }
  .panel { border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .gender-options { gap: 5px; }
  .gender-option { font-size: 9px; padding: 8px 3px; min-height: 66px; gap: 4px; }
  .gender-option .pair-icons { font-size: 18px; gap: 2px; }
  .name-grid { grid-template-columns: 1fr; gap: 8px; }
  .form-section { margin-top: 12px; padding-top: 10px; }
  .actions { gap: 6px; margin-top: 12px; }
  .action-button { min-height: 40px; padding: 9px 12px; font-size: 13px; }
  .cards { gap: 8px; max-width: 100%; }
  .card-front { padding: 6px; }
  .card-front .person-name { margin-top: 6px; font-size: 12px; }
  .card-front .person-label { font-size: 8px; letter-spacing: .08em; }
  .card-back::before { width: 40px; height: 40px; font-size: 20px; }
  .bottom-bar {
    bottom: max(6px, env(safe-area-inset-bottom, 6px));
    width: calc(100% - 12px);
    padding: 4px 8px;
    border-radius: 23px;
    gap: 6px;
  }
  .back-button, .profile-button { width: 32px; height: 32px; flex-basis: 32px; font-size: 15px; }
  .bottom-revealed-names { max-width: 55vw; padding-left: 6px; margin-left: 2px; }
  .bottom-revealed-names .rev-name { padding: 2px 6px; font-size: 10px; }
  .profile-menu {
    width: calc(100vw - 12px);
    max-height: 75vh;
    padding: 10px;
    border-radius: 12px;
  }
  .profile-menu-item { padding: 8px 9px; font-size: 12.5px; }
  .modal { border-radius: 12px; }
  .theme-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
  .theme-button { padding: 8px; font-size: 11px; }
  .emoji-grid { grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
  .emoji-option { font-size: 20px; }
  .result-note-box textarea { min-height: 50px; font-size: 12px; }
  .sub-card { padding: 9px 10px; gap: 8px; }
  .sub-card .sub-ico { width: 30px; height: 30px; font-size: 15px; }
  .ticket-row { flex-direction: column; align-items: flex-start; gap: 2px; }
  .ticket-row .v { text-align: left; }
}

/* Маленькие телефоны */
@media (max-width: 380px) {
  :root { --app-padding: 8px; }
  h1 { font-size: 26px; }
  .panel { padding: 10px; }
  .gender-option { min-height: 60px; font-size: 8.5px; }
  .gender-option .pair-icons { font-size: 16px; }
  .card-front .person-name { font-size: 11px; }
  .bottom-revealed-names { display: none; }
  .actions { flex-direction: column; }
  .actions .primary { width: 100%; }
  .sub-card .sub-price { font-size: 12px; }
  .result-summary h2 { font-size: 16px; }
}

/* Ландшафт на телефоне */
@media (max-height: 500px) and (orientation: landscape) {
  :root { --bottom-bar-height: 40px; --app-bottom-padding: 60px; }
  .hero { padding: 4px 4px 8px; }
  h1 { font-size: 26px; margin: 4px 0; }
  .splash-table { display: none; }
  .splash-title { margin-bottom: 4px; }
  .splash-sub { margin-bottom: 12px; }
  .profile-menu { max-height: 70vh; }
  .modal { max-height: 92vh; }
  .bottom-bar { height: 40px; }
  .back-button, .profile-button { width: 30px; height: 30px; flex-basis: 30px; }
}

/* Очень маленькие экраны по высоте */
@media (max-height: 600px) {
  .modal { max-height: 92vh; }
  .profile-menu { max-height: 80vh; }
}

/* Широкие экраны / 4K */
@media (min-width: 1400px) {
  :root { --app-padding: 22px; }
  .app { max-width: 1200px; }
  main { max-width: 900px; }
}

/* Уменьшенная анимация */
@media (prefers-reduced-motion: reduce) {

/* =========================================================

   ========================================================= */
function loadLastNames() {
  try {
    const raw = JSON.parse(localStorage.getItem(LAST_NAMES_KEY) || "{}");
    if (!raw.savedAt || (Date.now() - raw.savedAt) > 30 * 60 * 1000) {
      localStorage.removeItem(LAST_NAMES_KEY);
      return { one: "", two: "" };
    }
    return { one: raw.one || "", two: raw.two || "" };
  } catch { return { one: "", two: "" }; }
}
function saveLastNames(one, two) {
  try { localStorage.setItem(LAST_NAMES_KEY, JSON.stringify({ one, two, savedAt: Date.now() })); } catch {}
}
function checkLastNamesExpiry() {
  try {
    const raw = JSON.parse(localStorage.getItem(LAST_NAMES_KEY) || "{}");
    if (raw.savedAt && (Date.now() - raw.savedAt) > 30 * 60 * 1000) {
      localStorage.removeItem(LAST_NAMES_KEY);
    }
  } catch {}
}

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function loadArchive() {
  try { const v = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); return Array.isArray(v) ? v : []; }
  catch { return []; }
}
function saveArchive() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(archive)); } catch { showToast("Не удалось сохранить."); }
}
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") || {}; }
  catch { return {}; }
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
}
function showToast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("hidden"), 2400);
}
function escapeHTML(v) {
  return String(v).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
}
function randomItem(list) { return list[Math.floor(Math.random() * list.length)]; }
function randomName(gender, excluded = []) {
  const list = gender === "Мужской" ? maleNames : femaleNames;
  const avail = list.filter(n => !excluded.includes(n));
  return randomItem(avail.length ? avail : list);
}
function genderLabel(t) { return t === "Мужской" ? "Мужской" : "Женский"; }

function setPhase(next) {
  phase = next;
  $("setupPanel").classList.toggle("hidden", next !== "setup");

  $("resultPanel").classList.toggle("hidden", next !== "result");
  $("bottomBar").classList.remove("is-hidden");
  closeProfileMenu();
  closeSuggest();
  const showBack = (next !== "setup");
  $("backButton").classList.toggle("hidden", !showBack);
  updateRevealedNames();
}

function updateRevealedNames() {
  const wrap = $("bottomRevealedNames");
  const list = $("revNamesList");
  if (phase === "choice" && revealedNames.length) {
    wrap.classList.remove("hidden");
    list.innerHTML = revealedNames.map(n => `<span class="rev-name">${escapeHTML(n)}</span>`).join("");
  } else {
    wrap.classList.add("hidden");
    list.innerHTML = "";
  }
}

    portrait: gender === "Мужской" ? "🤴" : "👸"
  };
}

function prepareCharacters() {
  const pair = selectedGender === "mm"
    ? ["Мужской","Мужской"]
    : selectedGender === "ff"
      ? ["Женский","Женский"]
      : ["Мужской","Женский"];

  const manualNames = [$("nameOne").value.trim(), $("nameTwo").value.trim()];
  const usedNames = [];

  cards = pair.map((gender, index) => {
    let name = manualNames[index];
    if (!name) name = randomName(gender, usedNames);
    usedNames.push(name);

    const color = gender === "Мужской"
      ? (index === 0 ? "#77c5ff" : "#77f0d0")
      : (index === 0 ? "#ff8bb8" : "#d6a0ff");
    const bg1 = gender === "Мужской"
      ? (index === 0 ? "#1b5685" : "#176c5b")
      : (index === 0 ? "#8f2452" : "#603783");
    const bg2 = gender === "Мужской"
      ? (index === 0 ? "#10253f" : "#102f2d")
      : (index === 0 ? "#42142f" : "#281b42");

    return makeCharacter(gender, name, color, bg1, bg2);
  });

  revealedNames = cards.map(c => c.name);
  saveLastNames(cards[0].name, cards[1].name);
}

function cardMarkup(character, index, faceUp = false) {
  const front = `
    <div class="card-face card-front" style="
      --person-color:${character.color};
      --person-bg1:${character.bg1};
      --person-bg2:${character.bg2}">
      <div class="crown">${character.symbol}</div>
      <div class="portrait">${character.portrait}</div>
      <div class="person-name">${escapeHTML(character.name)}</div>
      <div class="person-label">${character.gender}</div>
    </div>`;
  return `
    <button type="button" class="card ${faceUp ? "flipped" : ""}" data-index="${index}">
      <span class="card-inner">
        <span class="card-face card-back"></span>
        ${front}
      </span>
    </button>`;
}

function renderGameCards(faceUp) {
  $("gameCards").innerHTML = cards.map((c,i) => cardMarkup(c,i,faceUp)).join("");
  $("gameCards").querySelectorAll(".card").forEach(card => {
    card.disabled = (phase !== "choice");
    card.addEventListener("click", () => {
      if (phase === "choice") chooseCard(Number(card.dataset.index));
    });
  });
}

/* =========================================================
   РАУНД
   ========================================================= */
function startRound() {
  clearTimeout(roundTimer);
  roundComment = $("battleComment").value.trim();
  prepareCharacters();
  selectedCardIndex = -1;
  ratingValue = 0;
  ratingPreview = 0;
  currentRecord = null;
  $("exitButton").classList.add("hidden");
  $("resultRating").innerHTML = "";
  $("resultNote").value = "";
  $("resultNoteSaved").textContent = "";
  $("flipButton").classList.add("hidden");
  setPhase("preview");
  $("gameStatus").textContent = "Запоминай карты";
  renderGameCards(true);

  let seconds = 3;
  roundTimer = setInterval(() => {
    seconds--;
    if (seconds > 0) {
      $("gameStatus").textContent = "Запоминай: " + seconds;
    } else {
      clearInterval(roundTimer);
      $("gameStatus").textContent = "Готов?";
      $("flipButton").classList.remove("hidden");
    }
  }, 1000);

  $("flipButton").onclick = () => {
    $("flipButton").classList.add("hidden");
    renderGameCards(false);
    shuffleCards();
  };
}

function shuffleCards() {
  cards = cards.slice().sort(() => Math.random() - .5);
  setPhase("choice");
  $("gameStatus").textContent = "Выбирай";
  renderGameCards(false);
}

function chooseCard(index) {
  if (phase !== "choice" || !cards[index]) return;
  selectedCardIndex = index;
  const chosen = cards[index];
  setPhase("result");
  currentQuote = randomItem(loveQuotes);
  currentRecord = {
    id: (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
    gender: chosen.gender,
    name: chosen.name,
    symbol: chosen.symbol,
    portrait: chosen.portrait,
    color: chosen.color,
    bg1: chosen.bg1,
    bg2: chosen.bg2,
    comment: roundComment,
    quote: currentQuote,
    rating: 0,
    resultNote: "",
    resultNoteColor: noteColors[0].bg,
    pairType: selectedGender,
    bookmarkColor: bookmarkColors[0]
  };
  renderResult();
  saveRecord();
  $("exitButton").classList.remove("hidden");
}

function renderResult() {
  const chosen = cards[selectedCardIndex];
  $("resultCard").innerHTML = cardMarkup(chosen, selectedCardIndex, false);
  const card = $("resultCard").querySelector(".card");
  card.disabled = true;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      card.classList.add("flipped");
      card.classList.add("chosen");
    });
  });
  $("resultTitle").textContent = chosen.name;
  $("resultGender").textContent = genderLabel(chosen.gender);
  $("resultQuote").textContent = currentQuote;
  const comment = $("resultComment");
  if (roundComment) {
    comment.textContent = roundComment;
    comment.classList.remove("hidden");
  } else {
    comment.textContent = "";
    comment.classList.add("hidden");
  }
  $("resultNote").value = "";
  $("resultNoteSaved").textContent = "";
  buildRating();
}

/* =========================================================
   РЕЙТИНГ
   ========================================================= */
function buildRating() {
  const holder = $("resultRating");
  holder.innerHTML = "";
  for (let i = 1; i <= 5; i++) {
    const star = document.createElement("button");
    star.type = "button";
    star.className = "star";
    star.textContent = "★";
    star.dataset.value = String(i);
    star.addEventListener("pointerenter", () => { ratingPreview = i; paintStars(); });
    star.addEventListener("click", () => setRating(i));
    holder.appendChild(star);
  }
  holder.addEventListener("pointerleave", () => { ratingPreview = 0; paintStars(); });
  holder.addEventListener("pointerdown", (e) => {
    const s = e.target.closest(".star");
    if (s) { ratingPreview = Number(s.dataset.value); paintStars(); try { holder.setPointerCapture(e.pointerId); } catch {} }
  });
  holder.addEventListener("pointermove", (e) => {
    if (e.buttons === 0 && e.pointerType === "mouse") return;
    const s = document.elementFromPoint(e.clientX, e.clientY)?.closest(".star");
    if (s && holder.contains(s)) { ratingPreview = Number(s.dataset.value); paintStars(); }
  });
  holder.addEventListener("pointerup", (e) => {
    const s = document.elementFromPoint(e.clientX, e.clientY)?.closest(".star");
    if (s && holder.contains(s)) setRating(Number(s.dataset.value));
  });
  paintStars();
}

function paintStars() {
  const active = ratingPreview || ratingValue;
  $("resultRating").querySelectorAll(".star").forEach((star, i) => {
    star.classList.toggle("active", i < ratingValue);
    star.classList.toggle("hovered", ratingPreview > 0 && i < active);
  });
}

function setRating(value) {
  ratingValue = Math.max(1, Math.min(5, Number(value) || 1));
  ratingPreview = 0;
  if (currentRecord) currentRecord.rating = ratingValue;
  paintStars();
  saveRecord();
}

function saveRecord() {
  if (!currentRecord) return;
  const idx = archive.findIndex(i => i.id === currentRecord.id);
  if (idx >= 0) archive[idx] = {...currentRecord};
  else archive.unshift({...currentRecord});
  archive = archive.slice(0, 200);
  saveArchive();
}

function goBack() {
  clearTimeout(roundTimer);
  if (phase === "preview" || phase === "choice") {
    setPhase("setup");
    renderGameCards(false);
    $("flipButton").classList.add("hidden");
  } else if (phase === "result") {
    setPhase("setup");
  }
}

function newGame() {
  clearTimeout(roundTimer);
  $("battleComment").value = "";
  $("nameOne").value = "";
  $("nameTwo").value = "";
  roundComment = "";
  currentRecord = null;
  cards = [];
  revealedNames = [];
  refreshFormSectionState();
  setPhase("setup");
}

   ========================================================= */
const formSection = $("formSection");
const nameOneEl = $("nameOne");
const nameTwoEl = $("nameTwo");
const battleCommentEl = $("battleComment");

function formHasData() {
  return Boolean(nameOneEl.value.trim() || nameTwoEl.value.trim() || battleCommentEl.value.trim());
}
function refreshFormSectionState() {

}
formSection.addEventListener("mouseenter", () => formSection.classList.add("is-active"));
formSection.addEventListener("mouseleave", () => refreshFormSectionState());

[nameOneEl, nameTwoEl, battleCommentEl].forEach(el => el.addEventListener("input", refreshFormSectionState));

/* =========================================================
   ВЫПАДАЮЩИЕ СПИСКИ
   ========================================================= */
const SUGGEST_LIMIT = 5;

function closeSuggest() {
  if (suggestPanel) { suggestPanel.remove(); suggestPanel = null; }
  suggestExpanded = false;
}

function showSuggest(anchor, allTiles) {
  closeSuggest();
  const wrap = anchor.closest(".field-wrap") || anchor.parentElement;
  suggestPanel = document.createElement("div");
  suggestPanel.className = "suggest-panel";
  const visible = suggestExpanded ? allTiles : allTiles.slice(0, SUGGEST_LIMIT);
  visible.forEach(t => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "suggest-tile " + (t.type || "");
    btn.textContent = t.text;
    btn.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      t.onPick();
      closeSuggest();
    });
    suggestPanel.appendChild(btn);
  });
  if (!suggestExpanded && allTiles.length > SUGGEST_LIMIT) {
    const moreBtn = document.createElement("button");
    moreBtn.type = "button";
    moreBtn.className = "suggest-tile more";
    moreBtn.textContent = "+";
    moreBtn.title = "Ещё варианты";
    moreBtn.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      suggestExpanded = true;
      showSuggest(anchor, allTiles);
    });
    suggestPanel.appendChild(moreBtn);
  }
  wrap.style.position = "relative";
  wrap.appendChild(suggestPanel);
}

function showNameSuggest(input, gender) {
  const list = (gender === "Мужской" ? maleNames : femaleNames).slice();
  const tiles = list.map(name => ({
    text: name, type: "",
    onPick: () => { input.value = name; refreshFormSectionState(); }
  }));
  showSuggest(input, tiles);
}

function showCommentSuggest(textarea) {
  const tiles = commentSuggestions.map(item => ({
    text: item.text, type: item.type,
    onPick: () => { textarea.value = item.text; refreshFormSectionState(); }
  }));
  showSuggest(textarea, tiles);
}

nameOneEl.addEventListener("focus", () => {
  const gender = (selectedGender === "ff") ? "Женский" : "Мужской";
  showNameSuggest(nameOneEl, gender);
});
nameTwoEl.addEventListener("focus", () => {
  const gender = (selectedGender === "mm") ? "Мужской" : "Женский";
  showNameSuggest(nameTwoEl, gender);
});
battleCommentEl.addEventListener("focus", () => {
  showCommentSuggest(battleCommentEl);
});
nameOneEl.addEventListener("input", closeSuggest);
nameTwoEl.addEventListener("input", closeSuggest);
battleCommentEl.addEventListener("input", closeSuggest);

document.addEventListener("click", (e) => {
  if (suggestPanel && !suggestPanel.contains(e.target) &&
      e.target !== nameOneEl && e.target !== nameTwoEl && e.target !== battleCommentEl) {
    closeSuggest();
  }
});

function prefillLastNames() {
  const last = loadLastNames();
  if (last.one && !nameOneEl.value) nameOneEl.value = last.one;
  if (last.two && !nameTwoEl.value) nameTwoEl.value = last.two;
  refreshFormSectionState();
}

   ТЕМА
   ========================================================= */
function applyTheme(theme) {
  document.body.classList.toggle("light-theme", theme === "light");
  settings.themeMode = theme;
  saveSettings();
  updateThemeSwitch();
}

function updateThemeSwitch() {
  const sw = $("themeSwitch");
  if (!sw) return;
  const isLight = settings.themeMode === "light";
  sw.classList.toggle("is-light", isLight);
  sw.querySelector(".thumb").textContent = isLight ? "☀️" : "🌙";
  sw.setAttribute("aria-checked", isLight ? "true" : "false");
}

/* =========================================================
   ФОНОВЫЕ ИКОНКИ
   ========================================================= */
function applyBgIcons(setIndex) {
  const set = bgIconSets[setIndex];
  if (!set) return;
  const cell = 60, cols = 4, rows = 4, size = cols * cell;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = (r * cols + c) % set.icons.length;
      const emoji = set.icons[idx];
      const x = c * cell + cell / 2;
      const y = r * cell + cell / 2 + 12;
      svg += `<text x="${x}" y="${y}" font-size="28" text-anchor="middle" fill="#888" opacity="0.9">${emoji}</text>`;
    }
  }
  svg += `</svg>`;
  const dataUri = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
  document.body.style.setProperty("--bg-icons", dataUri);
  settings.bgIconsSet = setIndex;
  saveSettings();
}

      ${rec.quote ? `<div class="ticket-divider"></div><div style="font-style:italic;font-size:12px;line-height:1.5;">${escapeHTML(rec.quote)}</div>` : ""}
      ${rec.comment ? `<div class="ticket-divider"></div><div style="font-size:12px;line-height:1.5;"><b>До игры:</b> ${escapeHTML(rec.comment)}</div>` : ""}
      ${rec.resultNote ? `<div class="ticket-divider"></div><div class="ticket-note" style="background:${rec.resultNoteColor || noteColors[0].bg};">${escapeHTML(rec.resultNote)}</div>` : ""}
      <div class="ticket-divider"></div>
      <div style="text-align:center;font-size:11px;color:#707579;">Переворот · романтическая игра</div>
    </div>
    <div class="actions" style="margin-top:12px;">
      <button class="action-button primary" id="ticketShare" style="width:100%">📤 Отправить чек</button>
    </div>
  `;
  content.querySelector("#ticketShare").addEventListener("click", () => {
    let text = `✦ ЧЕК ИГРЫ «ПЕРЕВОРОТ» ✦\n`;
    text += `Кто играл: ${pairLabel}\n`;
    text += `Победитель: ${rec.symbol || "♔"} ${rec.name}\n`;
    text += `Пол: ${rec.gender}\n`;
    text += `Оценка: ${rec.rating ? rec.rating + "/5" : "—"}\n`;
    if (rec.quote) text += `\n${rec.quote}\n`;
    if (rec.comment) text += `\nДо игры: ${rec.comment}`;
    if (rec.resultNote) text += `\nЗаметка: ${rec.resultNote}`;
    shareText(text);
  });
  $("modalBackdrop").classList.remove("hidden");
}

function closeModal() { $("modalBackdrop").classList.add("hidden"); }

function applyWallpaper(colors) {
  if (!Array.isArray(colors) || colors.length < 3) return;
  const p = [...colors];
  while (p.length < 5) p.push(p[p.length - 1]);
  document.body.style.backgroundImage = `linear-gradient(-45deg,${p[0]},${p[1]},${p[2]},${p[3]},${p[4]})`;
  document.body.style.backgroundSize = "400% 400%";
  document.documentElement.style.setProperty("--accent", p[3]);
  document.documentElement.setProperty?.("--accent2", p[4]) || document.documentElement.style.setProperty("--accent2", p[4]);
}

function exportArchive() {
  const blob = new Blob([JSON.stringify(archive, null, 2)], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "perevorot-archive.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  showToast("Экспорт готов.");
}

const profileMenu = $("profileMenu");

function openProfileMenu() {

  $("profileMenuName").textContent = settings.profileName || "Игрок";

}

$("profileButton").addEventListener("contextmenu", (e) => {

});

});
document.addEventListener("click", (e) => {

});

profileMenu.querySelectorAll("[data-profile-action]").forEach(btn => {
  btn.addEventListener("click", () => {
    const action = btn.dataset.profileAction;
    closeProfileMenu();
    switch (action) {
      case "avatar": openAvatarModal(); break;
      case "settings": openProfileSettings(); break;
      case "archive": openModal("archive"); break;
      case "wallpaper": openModal("wallpaper"); break;
      case "wallet": openWallet(); break;
      case "subscribe": openSubscribe(); break;
      case "share-costume": shareCostume(); break;
      case "create-card": createCharacterCard(); break;
      case "share-result": shareGameResult(); break;
      case "ideas": openIdeasModal(); break;

  });
});

function openAvatarModal() {
  $("modalTitle").textContent = "Аватарка";
  const content = $("modalContent");
  const currentType = settings.avatarType || "emoji";
  const currentEmoji = settings.avatarEmoji || "♙";
  const currentPhoto = settings.avatarPhoto || "";
  content.innerHTML = `
    <div class="section-title">Эмодзи</div>
    <div class="emoji-grid" id="emojiGrid">
      ${avatarEmojis.map(e => `<button class="emoji-option ${currentType === "emoji" && e === currentEmoji ? "selected" : ""}" data-emoji="${e}">${e}</button>`).join("")}
    </div>
    <hr>
    <div class="section-title">Своё фото</div>
    <input type="text" id="photoUrl" placeholder="https://..." value="${escapeHTML(currentPhoto)}">
    <div style="display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap">
      <input type="file" id="photoFile" accept="image/*" style="display:none">
      <button class="action-button" id="pickFile" style="flex:1">📁 Файл</button>
      <button class="action-button primary" id="applyPhoto" style="flex:1">URL</button>
    </div>
    <div style="margin-top:14px; text-align:center">
      <div id="avatarPreview" style="width:72px; height:72px; border-radius:50%; background:var(--tg-blue); display:grid; place-items:center; font-size:34px; margin:0 auto; overflow:hidden;">
        ${currentType === "photo" && currentPhoto ? `<img src="${escapeHTML(currentPhoto)}" style="width:100%;height:100%;object-fit:cover;">` : `<span>${currentEmoji}</span>`}
      </div>
    </div>`;
  content.querySelectorAll("[data-emoji]").forEach(btn => {
    btn.addEventListener("click", () => {
      content.querySelectorAll("[data-emoji]").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      settings.avatarType = "emoji";
      settings.avatarEmoji = btn.dataset.emoji;
      settings.avatarPhoto = "";
      saveSettings();
      updateProfileAvatar();
      content.querySelector("#avatarPreview").innerHTML = `<span>${btn.dataset.emoji}</span>`;
    });
  });
  content.querySelector("#applyPhoto").addEventListener("click", () => {
    const url = content.querySelector("#photoUrl").value.trim();
    if (!url) return;
    settings.avatarType = "photo";
    settings.avatarPhoto = url;
    saveSettings();
    updateProfileAvatar();
    content.querySelector("#avatarPreview").innerHTML = `<img src="${escapeHTML(url)}" style="width:100%;height:100%;object-fit:cover;">`;
  });
  content.querySelector("#pickFile").addEventListener("click", () => content.querySelector("#photoFile").click());
  content.querySelector("#photoFile").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = (ev) => {
      settings.avatarType = "photo";
      settings.avatarPhoto = ev.target.result;
      saveSettings();
      updateProfileAvatar();
      content.querySelector("#avatarPreview").innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
    };
    r.readAsDataURL(f);
  });
  $("modalBackdrop").classList.remove("hidden");
}

function createCharacterCard() {
  $("modalTitle").textContent = "Создать карточку";
  const content = $("modalContent");
  content.innerHTML = `
    <label class="field-label">Имя персонажа</label>
    <input type="text" id="charName" maxlength="28" placeholder="Например, Король Артур">
    <label class="field-label" style="margin-top:12px">Тип</label>
    <div class="gender-options" style="grid-template-columns:1fr 1fr">
      <button class="gender-option selected" data-char-gender="Мужской">♔ Мужчина</button>
      <button class="gender-option" data-char-gender="Женский">♕ Женщина</button>
    </div>
    <div class="actions" style="margin-top:14px">
      <button class="action-button primary" id="createChar" style="width:100%">Создать</button>
    </div>`;
  let charGender = "Мужской";
  content.querySelectorAll("[data-char-gender]").forEach(btn => {
    btn.addEventListener("click", () => {
      content.querySelectorAll("[data-char-gender]").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      charGender = btn.dataset.charGender;
    });
  });
  content.querySelector("#createChar").addEventListener("click", () => {
    const name = content.querySelector("#charName").value.trim();
    if (!name) return;
    const custom = {
      id: "char_" + Date.now().toString(36),
      gender: charGender,
      name,
      symbol: charGender === "Мужской" ? "♔" : "♕",
      portrait: charGender === "Мужской" ? "🤴" : "👸",
      color: charGender === "Мужской" ? "#77c5ff" : "#ff8bb8",
      bg1: charGender === "Мужской" ? "#1b5685" : "#8f2452",
      bg2: charGender === "Мужской" ? "#10253f" : "#42142f",
      comment: "Созданная карточка",
      quote: randomItem(loveQuotes),
      rating: 0,
      isCustom: true,
      resultNote: "",
      resultNoteColor: noteColors[0].bg,
      pairType: "custom",
      bookmarkColor: bookmarkColors[0]
    };
    archive.unshift(custom);
    saveArchive();
    showToast("Карточка «" + name + "» создана!");
    closeModal();
  });
  $("modalBackdrop").classList.remove("hidden");
}

      <li>📊 Статистика</li>
    </ul>`;

async function shareText(text) {
  try {
    if (navigator.share) { await navigator.share({ title: "Переворот", text }); showToast("Отправлено!"); }
    else { await navigator.clipboard.writeText(text); showToast("Скопировано!"); }
  } catch (e) { if (e.name !== "AbortError") showToast("Не удалось."); }
}

function updateProfileAvatar() {
  const btn = $("profileButton");
  if (settings.avatarType === "photo" && settings.avatarPhoto) {
    btn.innerHTML = `<img src="${settings.avatarPhoto}" style="width:100%;height:100%;object-fit:cover;" alt="">`;
    btn.style.background = "transparent";
  } else {
    btn.innerHTML = `<span>${settings.avatarEmoji || "♙"}</span>`;
    btn.style.background = "var(--tg-blue)";
  }
}

   ОБРАБОТЧИКИ

$("genderOptions").querySelectorAll("[data-gender]").forEach(btn => {

$("menuButton").addEventListener("click", (e) => {

  closeProfileMenu();

});
$("topMenu").querySelectorAll("[data-modal]").forEach(btn => {
  btn.addEventListener("click", () => openModal(btn.dataset.modal));
});
$("closeModal").addEventListener("click", closeModal);
$("modalBackdrop").addEventListener("click", (e) => {
  if (e.target === $("modalBackdrop")) closeModal();
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".topline")) $("topMenu").classList.add("hidden");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); closeProfileMenu(); $("topMenu").classList.add("hidden"); closeSuggest(); }
});
document.addEventListener("contextmenu", (e) => {
  if (!e.target.closest("#profileButton")) { e.preventDefault(); openModal("wallpaper"); }
});

/* Обработка изменения размера — при необходимости пересчитываем */
window.addEventListener("resize", () => {
  // Панель уже на CSS — просто закрываем меню при переходе в мобильный режим
  if (window.innerWidth < 540) closeProfileMenu();
});

/* =========================================================
   ЗАГРУЗКА
   ========================================================= */
function hideSplash() {
  const splash = $("splashScreen");
  if (!splash) return;
  splash.classList.add("fade-out");
  setTimeout(() => splash.remove(), 600);
}

function initApp() {
  checkLastNamesExpiry();
  if (settings.profileName) $("profileMenuName").textContent = settings.profileName;
  if (settings.themeMode === "light") document.body.classList.add("light-theme");
  if (Array.isArray(settings.customColors)) applyWallpaper(settings.customColors);
  else if (Number.isInteger(settings.theme) && themes[settings.theme]) applyWallpaper(themes[settings.theme].colors);
  if (Number.isInteger(settings.bgIconsSet)) applyBgIcons(settings.bgIconsSet);
  else applyBgIcons(0);
  updateProfileAvatar();
  refreshFormSectionState();
  prefillLastNames();
  setTimeout(hideSplash, 3000);
}

initApp();
