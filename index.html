<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Переворот</title>

<!-- =========================================================
     СЕКЦИЯ 1 — СТИЛИ
     ========================================================= -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pacifico&display=swap');

/* ---------- СЕКЦИЯ 1.1: Переменные ---------- */
:root {
  --tg-blue: #0088cc;
  --tg-blue-light: #54a9eb;
  --panel-dark: #232e3c;
  --header-dark: #1c2733;
  --text-dark: #e4ecf3;
  --muted-dark: #7d8b99;
  --border-dark: #2f3d4c;
  --panel-light: #ffffff;
  --header-light: #ffffff;
  --text-light: #1a1a1a;
  --muted-light: #707579;
  --border-light: #d6dce1;
  --accent: var(--tg-blue);
  --accent2: var(--tg-blue-light);
  --panel: var(--panel-dark);
  --text: var(--text-dark);
  --muted: var(--muted-dark);
  --border-color: var(--border-dark);
  --menu-bg: var(--header-dark);
  --modal-bg: var(--panel-dark);
  --input-bg: #1e2836;
  --btn-bg: rgba(255,255,255,.06);
  --btn-bg-hover: rgba(255,255,255,.12);
  --card-radius: 14px;
  --bottom-bar-height: 56px;
  --app-padding: clamp(12px, 3vw, 18px);
  --app-bottom-padding: clamp(96px, 14vh, 120px);
}
body.light-theme {
  --panel: var(--panel-light);
  --text: var(--text-light);
  --muted: var(--muted-light);
  --border-color: var(--border-light);
  --menu-bg: var(--header-light);
  --modal-bg: var(--panel-light);
  --input-bg: #f4f4f5;
  --btn-bg: rgba(0,0,0,.04);
  --btn-bg-hover: rgba(0,0,0,.08);
}
body.light-theme .panel { box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04) !important; }
body.light-theme .card-back {
  background:
    radial-gradient(circle at 50% 40%, rgba(0,136,204,.18), transparent 45%),
    linear-gradient(145deg,#e8eef4,#c5d8ea 52%,#a9c3dd);
  border-color: #b9cddf;
}
body.light-theme .card-back::before { color: #2b5278; border-color: rgba(43,82,120,.35); }
body.light-theme .bottom-bar,
body.light-theme .profile-menu,
body.light-theme .bar-panel,
body.light-theme .modal { box-shadow: 0 4px 20px rgba(0,0,0,.08) !important; }

/* ---------- СЕКЦИЯ 1.2: База ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; -webkit-text-size-adjust: 100%; }
*:focus, *:active, *:visited { outline: none !important; }
::selection { background: transparent; }
body {
  margin: 0;
  min-height: 100vh; min-height: 100dvh;
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: clamp(13px, 1.05vw, 14px);
  line-height: 1.4;
  background: linear-gradient(-45deg,#eef3f7,#dbe7f1,#f4f7fa,#cfe0ee,#e6eef5);
  background-size: 400% 400%;
  animation: wallpaper 20s ease infinite;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: color .3s, background .5s;
  -webkit-font-smoothing: antialiased;
  position: relative; overflow-x: hidden;
}
body:not(.light-theme) { background: linear-gradient(-45deg,#17212b,#2b5278,#17212b,#4a76a8,#1c2733); background-size: 400% 400%; }
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: var(--bg-icons, none);
  background-size: clamp(120px, 20vw, 200px) clamp(120px, 20vw, 200px);
  background-repeat: repeat; opacity: 0.06; filter: grayscale(100%);
}
body.light-theme::before { opacity: 0.04; }
@keyframes wallpaper { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

button, input, textarea { font: inherit; }
button {
  color: var(--text); border: 1px solid var(--border-color); background: var(--btn-bg);
  cursor: pointer; border-radius: 8px; transition: transform .15s, background .15s;
  min-height: 44px; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
button:hover { background: var(--btn-bg-hover); }
button:active { transform: scale(.98); }
button:disabled { opacity: .4; cursor: default; }
button:focus, button:focus-visible { outline: none !important; box-shadow: none !important; }
input, textarea {
  color: var(--text); background: var(--input-bg); border: 1px solid var(--border-color);
  border-radius: 10px; padding: clamp(9px, 1.6vw, 11px) clamp(10px, 1.8vw, 13px);
  outline: none; width: 100%; font-size: clamp(13px, 1.05vw, 14px);
  transition: border-color .2s; -webkit-tap-highlight-color: transparent;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 72px; user-select: text; -webkit-user-select: text; }

/* ---------- СЕКЦИЯ 1.3: Splash ---------- */
#splashScreen {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 45%, rgba(84,169,235,.2), transparent 60%),
              linear-gradient(160deg, #17212b 0%, #2b5278 50%, #0e1620 100%);
  padding: 20px; text-align: center; transition: opacity .5s ease;
}
#splashScreen.fade-out { opacity: 0; pointer-events: none; }
.splash-title { font-family: 'Pacifico', cursive; font-size: clamp(24px, 6vw, 42px); font-weight: 700; color: #fff; margin-bottom: 10px; text-shadow: 0 0 20px rgba(84,169,235,.5); }
.splash-sub { font-size: clamp(12px, 3vw, 16px); color: #a8d4ff; margin-bottom: 28px; letter-spacing: .05em; }
.splash-bar { width: min(240px, 70vw); height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
.splash-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--tg-blue), var(--tg-blue-light)); border-radius: 3px; animation: splashLoad 2s ease forwards; }
@keyframes splashLoad { from { width: 0%; } to { width: 100%; } }

/* ---------- СЕКЦИЯ 1.4: Каркас ---------- */
.app {
  min-height: 100vh; min-height: 100dvh; max-width: 1080px; margin: auto;
  padding: var(--app-padding);
  padding-bottom: max(var(--app-bottom-padding), env(safe-area-inset-bottom));
  position: relative; z-index: 1;
}
.topline { display: flex; justify-content: flex-end; align-items: center; gap: 10px; position: relative; z-index: 10; }
.icon-button {
  width: clamp(36px, 5vw, 40px); height: clamp(36px, 5vw, 40px);
  border-radius: 50%; font-size: clamp(18px, 2.6vw, 22px);
  display: grid; place-items: center; background: var(--btn-bg);
  border: 1px solid var(--border-color); color: var(--text); min-height: 0;
}
.dropdown {
  position: absolute; top: calc(100% + 8px); right: 0;
  width: min(260px, calc(100vw - 24px)); padding: 6px;
  border: 1px solid var(--border-color); border-radius: 12px;
  background: var(--menu-bg); z-index: 30;
}
.dropdown button { width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; border-color: transparent; background: transparent; font-size: clamp(13px, 1.1vw, 14px); min-height: 40px; }
.dropdown button:hover { background: var(--btn-bg-hover); }
main { width: 100%; max-width: 800px; margin: 14px auto 0; }
.panel { border: 1px solid var(--border-color); border-radius: clamp(12px, 2vw, 16px); background: var(--panel); padding: clamp(13px, 2.6vw, 22px); margin-bottom: 14px; }
.section-title { font-size: clamp(14px, 1.3vw, 15px); font-weight: 700; margin: 0 0 12px; }
.muted { color: var(--muted); font-size: clamp(12px, 1.1vw, 13px); line-height: 1.5; }
.status { min-height: 22px; margin: 0 0 12px; text-align: center; color: var(--muted); font-size: clamp(12px, 1.1vw, 13px); }
.hidden { display: none !important; }

/* ---------- СЕКЦИЯ 1.5: Поля ввода ---------- */
.gender-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(6px, 1.2vw, 8px); }
.gender-option {
  border-radius: 12px; padding: clamp(8px, 1.8vw, 12px) 4px;
  min-height: clamp(70px, 12vw, 84px); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; line-height: 1.2;
  font-size: clamp(9px, 1.05vw, 11px); letter-spacing: .03em;
  text-transform: uppercase; font-weight: 600; border: 1px solid var(--border-color);
  background: var(--btn-bg); text-align: center; overflow-wrap: anywhere;
}
.gender-option .pair-icons { display: flex; gap: 4px; font-size: clamp(18px, 4vw, 26px); line-height: 1; }
.gender-option.selected { border-color: var(--accent); background: rgba(0,136,204,.15); color: var(--accent2); }
.name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 1.4vw, 10px); }
.field-wrap { position: relative; }
.field-label { display: block; font-size: clamp(11px, 1vw, 12px); color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.comment-box { margin-top: 14px; }
.form-section-title { font-size: clamp(11px, 1vw, 12px); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 14px 0 10px; }

/* Фото: крестик вынесен за плитку */
.name-input-row { position: relative; display: flex; align-items: center; overflow: visible; }
.name-input-row input { padding-right: 52px; flex: 1; min-width: 0; }
.photo-upload-btn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border-color);
  background: var(--btn-bg); color: var(--muted); display: grid; place-items: center;
  font-size: 15px; cursor: pointer; flex-shrink: 0; min-height: 0; padding: 0; z-index: 3;
}
.photo-upload-btn:hover { border-color: var(--accent); color: var(--accent); }
.photo-upload-btn.hidden { display: none !important; }
.photo-preview-btn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 8px; border: 2px solid var(--accent);
  overflow: visible; display: none; z-index: 3; background: var(--input-bg);
  cursor: pointer; padding: 0; min-height: 0;
}
.photo-preview-btn.visible { display: block; }
.photo-preview-btn img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 6px; pointer-events: none; -webkit-user-drag: none; }
.photo-remove-btn {
  position: absolute; right: -9px; top: -9px; width: 22px; height: 22px; border-radius: 50%;
  background: #ff4f83; color: #fff; border: 2px solid var(--input-bg);
  font-size: 12px; font-weight: 700; display: grid; place-items: center;
  cursor: pointer; line-height: 1; padding: 0; min-height: 0; z-index: 5;
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.photo-remove-btn:hover { background: #ff2d68; }
.photo-file-input { display: none; }

.primary {
  border: 0 !important;
  background: linear-gradient(135deg, #00c853, #00b0ff, #ff9100, #00c853, #00b0ff, #ff9100) !important;
  background-size: 400% 400% !important; animation: btnGlow 6s ease infinite;
  font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.35);
}
.primary:hover { background: linear-gradient(135deg, #00e676, #40c4ff, #ffab40, #00e676, #40c4ff, #ffab40) !important; background-size: 400% 400% !important; animation: btnGlow 3s ease infinite; }
@keyframes btnGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.action-button { min-height: clamp(40px, 6vw, 45px); padding: clamp(9px, 1.6vw, 12px) clamp(12px, 2.2vw, 18px); border-radius: 10px; font-size: clamp(13px, 1.1vw, 14px); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.actions .primary { flex: 1; }

/* ---------- СЕКЦИЯ 1.6: КАРТЫ (без translateZ) ---------- */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 2.4vw, 20px); max-width: 560px; margin: 0 auto; }
.card {
  width: 100%; aspect-ratio: 3 / 4; perspective: 1200px; padding: 0; border: 0;
  background: transparent; border-radius: var(--card-radius);
  min-width: 0; min-height: 0; -webkit-appearance: none; appearance: none;
  transition: transform .2s ease;
  transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
}
.card:disabled { opacity: 1; cursor: default; }
.card:not(:disabled):hover { transform: translateY(-3px); }
.card-inner {
  display: block; position: relative; width: 100%; height: 100%;
  border-radius: var(--card-radius);
  transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
  transform-origin: center center;
  transition: transform .72s cubic-bezier(.2,.75,.2,1);
  will-change: transform;
}
.card.flipped .card-inner { transform: rotateY(180deg); }
.card-face {
  display: flex; position: absolute; inset: 0; width: 100%; height: 100%;
  box-sizing: border-box; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; border-radius: var(--card-radius);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
}
.card-back {
  background: radial-gradient(circle at 50% 40%, rgba(84,169,235,.15), transparent 45%),
              linear-gradient(145deg,#232e3c,#4a76a8 52%,#17212b);
  border: 1px solid var(--border-color);
  transform: rotateY(0deg); -webkit-transform: rotateY(0deg);
}
.card-back::before {
  content: "✦"; display: grid; place-items: center;
  width: clamp(40px, 12vw, 70px); height: clamp(40px, 12vw, 70px);
  border: 1px solid rgba(255,255,255,.25); border-radius: 50%;
  font-size: clamp(20px, 5vw, 32px); color: #a8d4ff;
}
.card-front {
  transform: rotateY(180deg); -webkit-transform: rotateY(180deg);
  border: 2px solid var(--person-color, #54a9eb);
  background-color: #1b5685;
  background-image: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.12), transparent 55%),
                    linear-gradient(150deg, var(--person-bg1, #1b5685), var(--person-bg2, #10253f));
  padding: clamp(6px, 1.4vw, 12px);
}
.card-front .card-photo {
  width: 64%; aspect-ratio: 1; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.4); overflow: hidden;
  background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.25), transparent 45%), rgba(255,255,255,.06);
  display: grid; place-items: center; font-size: clamp(32px, 8vw, 66px); flex-shrink: 0;
}
.card-front .card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.card-front .crown { font-size: clamp(20px, 5vw, 40px); margin-bottom: 6px; }
.card-front .person-name { margin-top: clamp(6px, 1.4vw, 12px); font-size: clamp(12px, 2.6vw, 18px); font-weight: 800; text-align: center; overflow-wrap: anywhere; padding: 0 2px; }
.card-front .person-label { margin-top: 4px; color: rgba(255,255,255,.75); font-size: clamp(8px, 1vw, 10px); letter-spacing: .12em; text-transform: uppercase; }
.card.chosen .card-inner { filter: drop-shadow(0 0 14px rgba(84,169,235,.5)); }

/* ---------- СЕКЦИЯ 1.7: Квадратик-подарок ---------- */
.gift-pop {
  position: absolute;
  top: 8px; right: 8px;
  width: clamp(48px, 12vw, 64px); height: clamp(48px, 12vw, 64px);
  border-radius: 14px;
  display: grid; place-items: center;
  font-size: clamp(24px, 6vw, 34px);
  cursor: pointer;
  border: 2px solid #ffd166;
  background: linear-gradient(135deg, #ffd166, #ff9100);
  box-shadow: 0 6px 20px rgba(255,145,0,.55), 0 0 0 3px rgba(255,255,255,.35);
  z-index: 12;
  animation: giftPopIn .45s cubic-bezier(.2,1.4,.4,1) both, giftWiggle 2.2s ease-in-out .5s infinite;
  user-select: none; -webkit-user-select: none;
}
.gift-pop:hover { filter: brightness(1.1); }
.gift-pop::after {
  content: "?"; position: absolute; bottom: -8px; right: -8px;
  width: 22px; height: 22px; border-radius: 50%;
  background: #ff4f83; color: #fff; font-size: 13px; font-weight: 900;
  display: grid; place-items: center;
  border: 2px solid var(--modal-bg);
  animation: giftPulse 1.4s ease-in-out infinite;
}
@keyframes giftPopIn { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
@keyframes giftWiggle { 0%,100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-4px); } }
@keyframes giftPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
.gift-pop.expired { animation: none; filter: grayscale(1) brightness(.6); opacity: .5; cursor: default; pointer-events: none; }
.gift-pop.expired::after { content: "✕"; background: #7d8b99; animation: none; }

/* ---------- СЕКЦИЯ 1.8: Результат ---------- */
.result-card { max-width: min(280px, 70vw); margin: 0 auto; position: relative; }
.result-summary { text-align: center; margin-top: 16px; }
.result-summary h2 { font-size: clamp(17px, 2.2vw, 20px); margin: 0 0 6px; font-weight: 700; overflow-wrap: anywhere; padding: 0 4px; }
.result-summary p { margin: 4px 0; color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; font-size: clamp(12px, 1.15vw, 14px); padding: 0 4px; }
.result-quote { font-style: italic; font-size: clamp(12px, 1.2vw, 14px); color: var(--text); padding: clamp(10px, 1.8vw, 12px) clamp(12px, 2vw, 16px); margin: 10px 0; border-left: 3px solid var(--accent); background: rgba(0,136,204,.1); border-radius: 8px; text-align: left; line-height: 1.55; }
.result-bubble { position: relative; margin: 16px auto 8px; background: linear-gradient(180deg, var(--accent), var(--accent2)); color: #fff; border-radius: 18px 18px 18px 6px; padding: 12px 14px; font-size: clamp(12px, 1.05vw, 13px); line-height: 1.5; text-align: left; overflow-wrap: anywhere; white-space: pre-wrap; box-shadow: 0 4px 14px rgba(0,136,204,.35); max-width: 92%; width: fit-content; min-width: 160px; }
.result-bubble .rb-name { font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; margin-bottom: 3px; }
.exit-hearts { position: relative; width: 100%; min-height: 60px; margin-top: 10px; display: flex; align-items: center; justify-content: center; }
.exit-hearts .eh-bg { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 0; }
.exit-hearts .eh-bg .eh-heart { position: absolute; font-size: clamp(14px, 3vw, 22px); line-height: 1; filter: drop-shadow(0 2px 4px rgba(255,0,60,.35)); animation: ehFloat 6s ease-in-out infinite; }
.exit-hearts .eh-bg .eh-heart:nth-child(1) { top: 4%; left: 6%; color: #ff2d55; }
.exit-hearts .eh-bg .eh-heart:nth-child(2) { top: 0%; right: 8%; color: #ff4f83; animation-delay: .8s; }
.exit-hearts .eh-bg .eh-heart:nth-child(3) { bottom: 4%; left: 10%; color: #ff2d55; animation-delay: 1.6s; }
.exit-hearts .eh-bg .eh-heart:nth-child(4) { bottom: 0%; right: 6%; color: #ff6b9d; animation-delay: 2.4s; }
.exit-hearts .eh-bg .eh-heart:nth-child(5) { top: 40%; left: 0%; color: #ff4f83; animation-delay: 3.2s; }
.exit-hearts .eh-bg .eh-heart:nth-child(6) { top: 46%; right: 0%; color: #ff2d55; animation-delay: 4s; }
@keyframes ehFloat { 0%,100% { transform: translateY(0) scale(1) rotate(-6deg); opacity: .85; } 50% { transform: translateY(-10px) scale(1.15) rotate(6deg); opacity: 1; } }

/* ---------- СЕКЦИЯ 1.9: Нижняя панель ---------- */
.bottom-bar {
  position: fixed; z-index: 20; bottom: max(10px, env(safe-area-inset-bottom, 10px));
  left: 50%; transform: translateX(-50%);
  width: min(760px, calc(100% - 20px)); height: var(--bottom-bar-height);
  padding: 6px 10px; display: flex; align-items: center; gap: 6px;
  border-radius: 26px; background: var(--menu-bg); border: 1px solid var(--border-color);
}
.back-button { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; font-size: 18px; display: grid; place-items: center; background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text); min-height: 0; }
.profile-button { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; background: var(--tg-blue); border: 0; display: grid; place-items: center; font-size: 16px; overflow: hidden; color: #fff; min-height: 0; }
.bar-toggle-btn {
  height: 36px; padding: 0 12px; border-radius: 18px;
  background: var(--btn-bg); border: 1px solid var(--border-color);
  color: var(--text); font-size: clamp(11px, 1vw, 12px);
  font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
  min-height: 0; flex-shrink: 0; cursor: pointer;
}
.bar-toggle-btn.active { border-color: var(--accent); background: rgba(0,136,204,.15); color: var(--accent2); }
.start-bar-btn, .exit-bar-btn, .repeat-bar-btn {
  flex: 1 1 auto; height: 36px; padding: 0 14px; border-radius: 18px;
  border: 0 !important; font-weight: 800; color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,.35);
  font-size: clamp(12px, 1.05vw, 13px);
  min-height: 0; cursor: pointer; white-space: nowrap;
}
.start-bar-btn {
  background: linear-gradient(135deg, #00c853, #00b0ff, #ff9100, #00c853, #00b0ff, #ff9100) !important;
  background-size: 400% 400% !important; animation: btnGlow 6s ease infinite;
}
.exit-bar-btn {
  background: linear-gradient(135deg, #ff4f83, #ffb347, #00c853, #00b0ff, #c8339a, #ff4f83) !important;
  background-size: 400% 400% !important; animation: btnGlow 5s ease infinite;
}
.repeat-bar-btn {
  background: linear-gradient(135deg, #00c853, #00b0ff, #ff9100, #00c853, #00b0ff, #ff9100) !important;
  background-size: 400% 400% !important; animation: btnGlow 6s ease infinite;
}
.start-bar-btn.hidden, .exit-bar-btn.hidden, .repeat-bar-btn.hidden { display: none !important; }

/* ---------- СЕКЦИЯ 1.10: Меню профиля ---------- */
.profile-menu {
  position: fixed; z-index: 40;
  bottom: calc(max(10px, env(safe-area-inset-bottom, 10px)) + var(--bottom-bar-height) + 10px);
  left: 50%; transform: translateX(-50%) translateY(20px);
  width: min(340px, calc(100vw - 20px)); padding: 12px; border-radius: 14px;
  background: var(--menu-bg); border: 1px solid var(--border-color);
  opacity: 0; pointer-events: none;
  transition: transform .35s cubic-bezier(.2,.75,.2,1), opacity .3s ease;
  max-height: min(80vh, 640px); overflow-y: auto;
}
.profile-menu.is-open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.profile-menu-header { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 10px; }

/* Сторис-кружок с градиентом */
.story-avatar-wrap { position: relative; width: 56px; height: 56px; flex-shrink: 0; cursor: pointer; }
.story-avatar-ring {
  position: absolute; inset: 0; border-radius: 50%; padding: 3px;
  background: var(--story-gradient, linear-gradient(135deg,#ff4f83,#ffb347,#00c853,#00b0ff,#c8339a));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events: none;
}
.story-avatar-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: var(--tg-blue); display: grid; place-items: center;
  font-size: 24px; overflow: hidden; border: 2px solid var(--menu-bg);
}
.story-avatar-inner img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.story-badge {
  position: absolute; bottom: -2px; right: -2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #00c853; color: #fff; font-size: 10px; font-weight: 800;
  display: grid; place-items: center; border: 2px solid var(--menu-bg);
}
.profile-avatar-preview { width: 48px; height: 48px; border-radius: 50%; background: var(--tg-blue); display: grid; place-items: center; font-size: 24px; flex-shrink: 0; border: 2px solid var(--border-color); overflow: hidden; }
.profile-menu-name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile-menu-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.profile-menu-list { display: grid; gap: 2px; }
.profile-menu-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; border: 1px solid transparent; background: transparent; font-size: clamp(12px, 1.1vw, 13px); min-height: 40px; }
.profile-menu-item:hover { background: var(--btn-bg-hover); }
.profile-menu-item .icon { width: 20px; text-align: center; font-size: 15px; flex-shrink: 0; }
.profile-menu-item .label { flex: 1; min-width: 0; }
.profile-menu-divider { height: 1px; background: var(--border-color); margin: 4px 0; }
.subscribe-btn { background: var(--btn-bg) !important; border: 1px solid var(--border-color) !important; font-weight: 800; }
.subscribe-btn .label { background: linear-gradient(90deg, #ff4f83, #ffb347, #00c853, #00b0ff, #c8339a, #ff4f83); background-size: 400% 400%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: rainbowFlow 3s ease infinite; font-weight: 800; }
@keyframes rainbowFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

/* ---------- СЕКЦИЯ 1.11: Модалки ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: clamp(10px, 2vw, 16px); padding-bottom: max(clamp(10px, 2vw, 16px), env(safe-area-inset-bottom)); background: rgba(0,0,0,.6); backdrop-filter: blur(6px); }
body.light-theme .modal-backdrop { background: rgba(0,0,0,.35); }
.modal { width: min(520px, 100%); max-height: min(85vh, 90dvh); overflow-y: auto; overscroll-behavior: contain; background: var(--modal-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: clamp(14px, 2.4vw, 18px); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.modal-head h2 { font-size: clamp(15px, 1.5vw, 17px); margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.close-button { border-radius: 50%; width: 32px; height: 32px; min-height: 0; flex-shrink: 0; }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.theme-button { border-radius: 10px; padding: 10px; min-height: 56px; text-align: left; font-size: clamp(11px, 1vw, 12px); overflow: hidden; min-height: 0; transition: transform .15s, border-color .15s; position: relative; }
.theme-button:hover { transform: translateY(-2px); border-color: var(--accent); }
.theme-button.selected { border-color: var(--accent); background: rgba(0,136,204,.12); }
.theme-swatch { height: 24px; border-radius: 6px; margin-bottom: 6px; }
.color-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
.color-input { padding: 3px; height: 40px; cursor: pointer; min-height: 0; }
hr { border: 0; border-top: 1px solid var(--border-color); margin: 14px 0; }
.toast { position: fixed; z-index: 80; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom, 10px)) + 76px); transform: translateX(-50%); padding: 10px 14px; border-radius: 10px; background: var(--menu-bg); border: 1px solid var(--border-color); color: var(--text); font-size: clamp(12px, 1.1vw, 13px); max-width: calc(100% - 20px); text-align: center; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; margin-top: 10px; }
.emoji-option { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-size: clamp(20px, 4vw, 26px); background: var(--btn-bg); border: 2px solid transparent; padding: 0; cursor: pointer; min-height: 0; }
.emoji-option.selected { border-color: var(--accent); background: rgba(0,136,204,.15); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.switch-row .switch-label { font-size: clamp(12px, 1.1vw, 13px); font-weight: 600; color: var(--text); }
.switch-row .switch-desc { font-size: clamp(10.5px, .95vw, 11.5px); color: var(--muted); margin-top: 2px; }
.switch-toggle { position: relative; width: 52px; height: 28px; border-radius: 14px; background: #3a4a5a; border: 1px solid var(--border-color); cursor: pointer; flex-shrink: 0; padding: 0; overflow: hidden; min-height: 0; }
.switch-toggle .switch-thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .3s cubic-bezier(.2,.75,.2,1); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch-toggle.is-on { background: #00c853; border-color: #00c853; }
.switch-toggle.is-on .switch-thumb { transform: translateX(24px); }

/* ---------- СЕКЦИЯ 1.12: Подсказки ---------- */
.suggest-panel { position: absolute; z-index: 60; top: calc(100% + 4px); left: 0; right: 0; max-height: min(260px, 44vh); overflow-y: auto; padding: 6px; border-radius: 12px; background: var(--menu-bg); border: 1px solid var(--border-color); display: grid; gap: 5px; }
.suggest-tile { display: block; width: 100%; text-align: left; padding: 9px 11px; border-radius: 8px; border: 1px solid transparent; background: #ffffff; color: #1a1a1a; font-size: clamp(12px, 1.1vw, 13px); line-height: 1.4; cursor: pointer; min-height: 0; overflow-wrap: anywhere; }
.suggest-tile:hover { background: #f0f0f0; }
.suggest-tile.rainbow { color: #fff; background: linear-gradient(135deg, #ff4f83, #ffb347, #00c853, #00b0ff, #c8339a, #ff4f83); background-size: 400% 400%; animation: rainbowFlow 4s ease infinite; }
.suggest-tile.blue { background: linear-gradient(135deg, #a8e0ff, #5bc0ff); color: #0a2540; }
.suggest-tile.pink { background: linear-gradient(135deg, #ffc2d9, #ff8fb8); color: #4a0d28; }
.suggest-tile.refresh { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; padding: 8px 12px; border-radius: 8px; min-height: 36px; }

/* ---------- СЕКЦИЯ 1.13: Чек ---------- */
.ticket { background: #ffffff; color: #1a1a1a; border-radius: 12px; padding: clamp(12px, 2.4vw, 16px); border: 1px dashed #b0b0b0; overflow: hidden; }
.ticket-head { font-family: 'Pacifico', cursive; font-size: clamp(16px, 2.4vw, 20px); text-align: center; margin-bottom: 8px; }
.ticket-divider { border-top: 1px dashed #b0b0b0; margin: 10px 0; }
.ticket-row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: clamp(12px, 1.1vw, 13px); flex-wrap: wrap; }
.ticket-row .k { color: #707579; font-weight: 600; }
.ticket-row .v { color: #1a1a1a; font-weight: 700; text-align: right; overflow-wrap: anywhere; }

/* ---------- СЕКЦИЯ 1.14: Подписка / карточки ---------- */
.sub-section { margin-top: 6px; }
.sub-section-title { font-size: clamp(11px, 1vw, 12px); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 14px 0 6px; }
.sub-cards { display: grid; gap: 8px; }
.sub-card { display: flex; align-items: center; gap: 10px; padding: clamp(10px, 1.8vw, 12px) clamp(10px, 1.8vw, 14px); border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--border-color); min-width: 0; }
body.light-theme .sub-card { background: rgba(0,0,0,.02); }
.sub-card .sub-ico { width: clamp(32px, 6vw, 38px); height: clamp(32px, 6vw, 38px); border-radius: 10px; display: grid; place-items: center; font-size: clamp(16px, 3vw, 20px); flex-shrink: 0; background: linear-gradient(135deg, rgba(255,79,131,.25), rgba(0,176,255,.25)); }
.sub-card .sub-info { flex: 1; min-width: 0; }
.sub-card .sub-name { font-weight: 700; font-size: clamp(12px, 1.15vw, 13.5px); color: var(--text); overflow-wrap: anywhere; }
.sub-card .sub-sub { font-size: clamp(10px, .95vw, 11px); color: var(--muted); margin-top: 2px; }
.sub-card .sub-price { font-weight: 800; font-size: clamp(13px, 1.4vw, 15px); background: linear-gradient(90deg, #ff4f83, #ffb347, #00c853, #00b0ff); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; flex-shrink: 0; }
.sub-note { font-size: clamp(10px, 1vw, 11px); color: var(--muted); margin-top: 12px; text-align: center; line-height: 1.5; }

/* ---------- СЕКЦИЯ 1.15: Новости ---------- */
.news-list { display: grid; gap: 12px; }
.news-tile { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--border-color); background: var(--panel); display: flex; flex-direction: column; }
.news-photo { position: relative; width: 100%; aspect-ratio: 16 / 9; background: linear-gradient(135deg, rgba(84,169,235,.28), rgba(255,79,131,.28)); display: grid; place-items: center; overflow: hidden; }
.news-photo-emoji { font-size: clamp(48px, 12vw, 72px); filter: drop-shadow(0 4px 10px rgba(0,0,0,.25)); }
.news-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.news-headline { font-weight: 800; font-size: clamp(13px, 1.3vw, 15px); overflow-wrap: anywhere; color: var(--text); }
.news-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: clamp(10px, .95vw, 11px); color: var(--muted); }
.news-tag { padding: 2px 6px; border-radius: 6px; background: rgba(0,136,204,.12); color: #0088cc; font-weight: 700; font-size: 10px; text-transform: uppercase; }
.news-preview { font-size: clamp(11px, 1.05vw, 12.5px); color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
.news-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.news-action-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px; border-radius: 8px; background: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text); font-size: clamp(10.5px, .95vw, 11.5px); font-weight: 700; cursor: pointer; min-height: 30px; }
.news-action-btn.liked { border-color: #ff4f83; color: #ff4f83; }
.news-ico { font-size: 12px; }

/* ---------- СЕКЦИЯ 1.16: О игре ---------- */
.about-intro { font-size: clamp(13px, 1.15vw, 14px); line-height: 1.6; color: var(--text); margin: 0 0 16px; }
.rules-title { font-size: clamp(13px, 1.15vw, 14px); font-weight: 700; margin: 16px 0 10px; color: var(--text); }
.rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 6px; }
.rule-card { border: 1px solid var(--border-color); border-radius: 12px; background: rgba(255,255,255,.04); padding: 14px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 160px; }
body.light-theme .rule-card { background: rgba(0,0,0,.02); }
.rule-card .rule-img { width: 64px; height: 64px; border-radius: 12px; background: linear-gradient(135deg, rgba(255,79,131,.18), rgba(0,176,255,.18)); display: grid; place-items: center; font-size: 32px; }
.rule-card .rule-text { font-size: clamp(11px, 1vw, 12px); line-height: 1.4; color: var(--text); }
.rule-card .rule-num { display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; line-height: 22px; text-align: center; }

/* ---------- СЕКЦИЯ 1.17: Донат ---------- */
.donate-hero { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 8px 4px 14px; }
.donate-hero .donate-emoji { font-size: clamp(48px, 12vw, 72px); line-height: 1; }
.donate-hero h3 { margin: 0; font-size: clamp(16px, 2.2vw, 20px); font-weight: 800; color: var(--text); }
.donate-hero p { margin: 0; color: var(--muted); font-size: clamp(12px, 1.15vw, 13px); line-height: 1.55; max-width: 420px; }
.donate-games { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 6px 0 14px; }
.donate-game { border: 1px solid var(--border-color); border-radius: 12px; background: rgba(255,255,255,.04); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
body.light-theme .donate-game { background: rgba(0,0,0,.02); }
.donate-game .dg-img { height: 56px; border-radius: 8px; display: grid; place-items: center; font-size: 28px; background: linear-gradient(135deg, rgba(84,169,235,.22), rgba(255,79,131,.22)); }
.donate-game .dg-name { font-weight: 700; font-size: clamp(11px, 1.05vw, 12.5px); }
.donate-game .dg-meta { font-size: clamp(10px, .95vw, 11px); color: var(--muted); line-height: 1.4; }
.donate-chart { border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 10px 8px; background: rgba(255,255,255,.03); margin-bottom: 14px; }
body.light-theme .donate-chart { background: rgba(0,0,0,.02); }
.donate-bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-bottom: 4px; }
.donate-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; height: 100%; justify-content: flex-end; }
.donate-bar { width: 100%; max-width: 34px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, var(--accent2), var(--accent)); min-height: 4px; }
.donate-bar-label { font-size: 9.5px; color: var(--muted); text-align: center; white-space: nowrap; }
.donate-box { border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; background: linear-gradient(135deg, rgba(255,79,131,.08), rgba(0,176,255,.08)); }
.donate-box label { display: block; font-size: clamp(11px, 1vw, 12px); color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.donate-wallet { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.donate-wallet input { flex: 1 1 200px; font-family: ui-monospace, Menlo, monospace; font-size: clamp(11px, 1vw, 12px); padding: 10px; min-width: 0; user-select: all; -webkit-user-select: all; }
.donate-copy-btn { flex: 0 0 auto; padding: 10px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font-weight: 700; font-size: clamp(12px, 1.05vw, 13px); min-height: 40px; cursor: pointer; }

/* ---------- СЕКЦИЯ 1.18: Техподдержка ---------- */
.support-hero { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 4px 4px 12px; }
.support-hero .support-img { width: 96px; height: 96px; border-radius: 24px; display: grid; place-items: center; font-size: 52px; background: linear-gradient(135deg, rgba(84,169,235,.25), rgba(255,79,131,.25)); border: 2px solid var(--border-color); }
.support-hero h3 { margin: 0; font-size: clamp(15px, 2vw, 18px); font-weight: 800; }
.support-hero p { margin: 0; color: var(--muted); font-size: clamp(12px, 1.1vw, 13px); line-height: 1.5; max-width: 380px; }
.support-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.support-tag { padding: 6px 10px; border-radius: 999px; font-size: clamp(10.5px, 1vw, 12px); font-weight: 700; border: 1px solid transparent; background: var(--btn-bg); color: var(--text); cursor: pointer; min-height: 0; }
.support-tag.selected { border-color: currentColor; }
.support-tag.tag-sub { background: rgba(255,79,131,.18); color: #ff4f83; }
.support-tag.tag-service { background: rgba(0,176,255,.18); color: #00b0ff; }
.support-tag.tag-idea { background: rgba(255,179,71,.18); color: #ffb347; }
.support-tag.tag-help { background: rgba(0,200,83,.18); color: #00c853; }
.support-tag.tag-bug { background: rgba(200,51,154,.18); color: #c8339a; }
.support-tag.tag-other { background: rgba(125,139,153,.18); color: #7d8b99; }
.support-counter { display: flex; justify-content: flex-end; font-size: 11px; color: var(--muted); margin-top: 4px; }
.support-counter.warn { color: #ffb347; }
.support-counter.over { color: #ff4f83; }
.support-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.support-actions .action-button { flex: 1 1 140px; }
.support-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 4px; }
.support-photo-slot { position: relative; aspect-ratio: 1; border: 1.5px dashed var(--border-color); border-radius: 10px; background: rgba(255,255,255,.03); display: grid; place-items: center; cursor: pointer; overflow: visible; min-height: 0; padding: 0; }
body.light-theme .support-photo-slot { background: rgba(0,0,0,.02); }
.support-photo-slot:hover { border-color: var(--accent); }
.support-photo-slot.filled { border-style: solid; border-color: var(--accent); }
.support-photo-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; pointer-events: none; }
.support-photo-slot .slot-add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 20px; pointer-events: none; }
.support-photo-slot .slot-add small { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.support-photo-slot .slot-remove { position: absolute; right: -8px; top: -8px; width: 20px; height: 20px; border-radius: 50%; background: #ff4f83; color: #fff; border: 2px solid var(--input-bg); font-size: 11px; font-weight: 700; display: grid; place-items: center; cursor: pointer; line-height: 1; padding: 0; min-height: 0; z-index: 4; }
.support-photo-info { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 6px; }

/* ---------- СЕКЦИЯ 1.19: Промокоды ---------- */
.promo-section-title { font-size: clamp(11px, 1vw, 12px); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 14px 0 8px; }
.promo-grid { display: grid; gap: 10px; }
.promo-item { display: flex; gap: 12px; border: 1px solid var(--border-color); border-radius: 12px; background: rgba(255,255,255,.03); overflow: hidden; }
body.light-theme .promo-item { background: rgba(0,0,0,.02); }
.promo-item .promo-ico { flex: 0 0 64px; display: grid; place-items: center; font-size: 30px; background: linear-gradient(135deg, rgba(84,169,235,.22), rgba(255,79,131,.22)); }
.promo-item .promo-body { flex: 1; padding: 10px 12px 10px 0; min-width: 0; }
.promo-item .promo-name { font-weight: 700; font-size: clamp(12px, 1.1vw, 13px); overflow-wrap: anywhere; margin-bottom: 4px; }
.promo-item .promo-desc { font-size: clamp(10px, .95vw, 11px); color: var(--muted); line-height: 1.4; margin-bottom: 6px; }
.promo-item .promo-code { display: inline-block; padding: 4px 8px; border-radius: 6px; background: var(--input-bg); border: 1px dashed var(--border-color); font-family: ui-monospace, Menlo, monospace; font-size: clamp(11px, 1vw, 12px); font-weight: 700; letter-spacing: .04em; user-select: all; -webkit-user-select: all; }
.promo-item .promo-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.promo-btn { padding: 6px 10px; border-radius: 8px; background: var(--btn-bg); border: 1px solid var(--border-color); font-size: clamp(10.5px, .95vw, 11.5px); font-weight: 700; color: var(--text); cursor: pointer; min-height: 32px; }
.promo-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

"use strict";

/* =========================================================
   СЕКЦИЯ 8.1 — ЛИМИТЫ ФАЙЛОВ И ВВОДА (п.3)
   ========================================================= */
const NAME_MAX = 15;
const COMMENT_MAX = 500;
const SUPPORT_MAX = 1500;
const PHOTO_MAX_BYTES = 2 * 1024 * 1024;         // Фото карты: 2 МБ
const AVATAR_MAX_BYTES = 2 * 1024 * 1024;        // Аватар: 2 МБ
const SUPPORT_PHOTO_MAX = 3;                     // Максимум 3 фото
const SUPPORT_PHOTO_MAX_BYTES = 5 * 1024 * 1024; // Каждое фото 5 МБ
const STORY_MAX_BYTES = 10 * 1024 * 1024;        // Сторис: 10 МБ
const ALLOWED_IMAGE_TYPES = ["image/png","image/jpeg","image/jpg"];

const STORAGE_KEY = "perevorot_archive_v17";
const SETTINGS_KEY = "perevorot_settings_v17";
const LAST_NAMES_KEY = "perevorot_lastnames_v17";
const PROMO_STORAGE_KEY = "perevorot_promos_v17";
const NEWS_STORAGE_KEY = "perevorot_news_v17";
const WALLET_STORAGE_KEY = "perevorot_wallet_v17";
const BONUS_STORAGE_KEY = "perevorot_bonus_v17";
const STORY_STORAGE_KEY = "perevorot_story_v17";

const DONATE_WALLET = "UQCpQQ5DdYWyv7qwQANvd_aGRYwKq7OpSZdoRuP2ekKF3i9T";
const GAME_REWARD_COINS = 5;

/* =========================================================
   СЕКЦИЯ 8.2 — Санитайзеры
   ========================================================= */
function sanitizeName(raw) {
  if (typeof raw !== "string") return "";
  let clean = raw.replace(/[^a-zA-Zа-яА-ЯёЁ\s\-]/g, "");
  clean = clean.replace(/\s+/g, " ").trim();
  return clean.slice(0, NAME_MAX);
}
function sanitizeComment(raw) {
  if (typeof raw !== "string") return "";
  let clean = raw.replace(/<[^>]*>/g, "");
  clean = clean.replace(/(https?:\/\/|www\.)\S+/gi, "");
  clean = clean.replace(/javascript\s*:/gi, "");
  clean = clean.replace(/on\w+\s*=/gi, "");
  clean = clean.replace(/[<>\\]/g, "");
  return clean.slice(0, COMMENT_MAX);
}
function sanitizeSupport(raw) {
  if (typeof raw !== "string") return "";
  let clean = raw.replace(/<[^>]*>/g, "");
  clean = clean.replace(/javascript\s*:/gi, "");
  clean = clean.replace(/on\w+\s*=/gi, "");
  clean = clean.replace(/[<>\\]/g, "");
  return clean.slice(0, SUPPORT_MAX);

function generateTonAddress() {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  let out = "UQ"; for (let i = 0; i < 46; i++) out += chars[Math.floor(Math.random() * chars.length)]; return out;
}
function generateQrSvg(seed) {
  const size = 21; let hash = 0;
  for (let i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
  const rand = () => { hash ^= hash << 13; hash >>>= 0; hash ^= hash >> 17; hash ^= hash << 5; hash >>>= 0; return hash; };
  let cells = "";
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const inMarker = (cx, cy) => { const dx = x - cx, dy = y - cy; return dx >= 0 && dx < 7 && dy >= 0 && dy < 7; };
    let fill = false;
    if (inMarker(0,0) || inMarker(size-7,0) || inMarker(0,size-7)) {
      const cx = inMarker(0,0) ? 0 : inMarker(size-7,0) ? size-7 : 0;
      const cy = inMarker(0,0) ? 0 : inMarker(size-7,0) ? 0 : size-7;
      const dx = x - cx, dy = y - cy;
      fill = dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
    } else { fill = (rand() & 1) === 1; }
    if (fill) cells += `<rect x="${x}" y="${y}" width="1" height="1" fill="#0a0a0a"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21" shape-rendering="crispEdges">${cells}</svg>`;
}

    const f = e.target.files[0]; if (!f) return;
    if (!ALLOWED_IMAGE_TYPES.includes(f.type)) { showToast("Только PNG или JPG."); fileInput.value = ""; return; }
    if (f.size > PHOTO_MAX_BYTES) { showToast(`Фото больше ${PHOTO_MAX_BYTES / 1024 / 1024} МБ.`); fileInput.value = ""; return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      onSet(ev.target.result);
      previewImg.src = ev.target.result;
      preview.classList.add("visible");
      uploadBtn.classList.add("hidden");
      fileInput.value = "";
    };
    reader.readAsDataURL(f);
  });
  removeBtn.addEventListener("click", (e) => {
    e.stopPropagation(); e.preventDefault();
    onSet(""); previewImg.src = "";
    preview.classList.remove("visible");
    uploadBtn.classList.remove("hidden");
    fileInput.value = "";
  });
  const existing = getPhoto();
  if (existing) { previewImg.src = existing; preview.classList.add("visible"); uploadBtn.classList.add("hidden"); }
}

/* =========================================================
   СЕКЦИЯ 8.8 — Фазы
   ========================================================= */
function setPhase(next) {
  phase = next;
  $("setupPanel").classList.toggle("hidden", next === "result");
  $("resultPanel").classList.toggle("hidden", next !== "result");
  closeProfileMenu();
  closeSuggest();
  $("backButton").classList.toggle("hidden", next === "setup");
  const showFlip = (next === "setup" || next === "preview" || next === "choice");
  $("flipBarBtn").classList.toggle("hidden", !showFlip);
  $("flipBarBtn").disabled = (next === "choice");
  const showResultBarBtns = (next === "result");
  $("exitBarBtn").classList.toggle("hidden", !showResultBarBtns);
  $("repeatBarBtn").classList.toggle("hidden", !showResultBarBtns);
}

/* =========================================================
   СЕКЦИЯ 8.9 — Персонажи (ВСЕГДА обычные карты)
   ========================================================= */
function makeCharacter(gender, name, color, bg1, bg2, photo) {
  return {
    gender: gender || "Мужской", name: name || "",
    color: color || "#54a9eb", bg1: bg1 || "#1b5685", bg2: bg2 || "#10253f",
    photo: photo || "",
    symbol: gender === "Мужской" ? "♔" : "♕",
    portrait: gender === "Мужской" ? "🤴" : "👸"
  };
}
function readNameValue(idx) {
  const el = $(idx === 1 ? "nameOne" : "nameTwo");
  return (el && el.value && el.value.trim()) ? el.value : "";
}
function readCommentValue() {
  const el = $("battleComment");
  return (el && el.value) ? el.value : "";
}
function buildCharacters() {
  const pair = selectedGender === "mm" ? ["Мужской","Мужской"]
             : selectedGender === "ff" ? ["Женский","Женский"]
             : ["Мужской","Женский"];
  const manualNames = [sanitizeName(readNameValue(1)), sanitizeName(readNameValue(2))];
  const usedNames = [];
  return pair.map((gender, index) => {
    let name = manualNames[index];
    if (!name) name = randomName(gender, usedNames);
    usedNames.push(name);
    const color = gender === "Мужской" ? (index === 0 ? "#77c5ff" : "#77f0d0") : (index === 0 ? "#ff8bb8" : "#d6a0ff");
    const bg1 = gender === "Мужской" ? (index === 0 ? "#1b5685" : "#176c5b") : (index === 0 ? "#8f2452" : "#603783");
    const bg2 = gender === "Мужской" ? (index === 0 ? "#10253f" : "#102f2d") : (index === 0 ? "#42142f" : "#281b42");
    const photo = index === 0 ? photoOne : photoTwo;
    return makeCharacter(gender, name, color, bg1, bg2, photo);
  });
}

function cardMarkup(character, index, faceUp = false) {
  if (!character) return "";
  const isMale = character.gender === "Мужской";
  const symbol = character.symbol || (isMale ? "♔" : "♕");
  const portrait = character.portrait || (isMale ? "🤴" : "👸");
  const color = character.color || (isMale ? "#77c5ff" : "#ff8bb8");
  const bg1 = character.bg1 || (isMale ? "#1b5685" : "#8f2452");
  const bg2 = character.bg2 || (isMale ? "#10253f" : "#42142f");
  const name = character.name || "";
  const genderText = character.gender || "";
  const photoHtml = character.photo ? `<img src="${character.photo}" alt="" loading="lazy" draggable="false">` : escapeHTML(portrait);
  return `
    <button type="button" class="card ${faceUp ? "flipped" : ""}" data-index="${index}">
      <span class="card-inner">
        <span class="card-face card-back"></span>
        <div class="card-face card-front" style="--person-color:${color};--person-bg1:${bg1};--person-bg2:${bg2};">
          <div class="crown">${escapeHTML(symbol)}</div>
          <div class="card-photo">${photoHtml}</div>
          <div class="person-name">${escapeHTML(name)}</div>
          <div class="person-label">${escapeHTML(genderText)}</div>
        </div>
      </span>
    </button>`;
}

function renderGameCards(faceUp) {
  const container = $("gameCards");
  container.innerHTML = cards.map((c,i) => cardMarkup(c,i,faceUp)).join("");
  container.querySelectorAll(".card").forEach(card => {
    card.disabled = (phase !== "choice");
    card.addEventListener("click", () => { if (phase === "choice") chooseCard(Number(card.dataset.index)); });
  });
}
function refreshGameCards() {
  if (phase !== "setup" && phase !== "preview" && phase !== "choice") return;
  const faceUp = (phase === "setup"); // на старте лицом, чтобы видеть иконку
  cards = buildCharacters();
  renderGameCards(faceUp);
}

/* =========================================================
   СЕКЦИЯ 8.10 — Игровой цикл
   Стартовый экран: карты ЛИЦОМ (король/дама видны) — «спички».
   «Перевернуть» → карты закрываются (рубашки) → перемешиваются → выбор.
   ========================================================= */
function prepareRound() {
  document.querySelectorAll(".gift-pop").forEach(el => el.remove());
  if (roundTimer) { clearInterval(roundTimer); roundTimer = null; }
  const rawOne = readNameValue(1), rawTwo = readNameValue(2);
  const cleanOne = sanitizeName(rawOne), cleanTwo = sanitizeName(rawTwo);
  if (rawOne.trim() && !cleanOne) { showToast("Имя 1: только буквы, пробел, дефис."); if ($("nameOne")) $("nameOne").value = ""; return false; }
  if (rawTwo.trim() && !cleanTwo) { showToast("Имя 2: только буквы, пробел, дефис."); if ($("nameTwo")) $("nameTwo").value = ""; return false; }
  if ($("nameOne")) $("nameOne").value = cleanOne;
  if ($("nameTwo")) $("nameTwo").value = cleanTwo;
  roundComment = sanitizeComment(readCommentValue());
  cards = buildCharacters();
  saveLastNames(cards[0].name, cards[1].name);
  lastRoundSnapshot = { names: [cards[0].name, cards[1].name], gender: selectedGender, photos: [photoOne, photoTwo], comment: roundComment };
  selectedCardIndex = -1;
  currentRecord = null;
  return true;
}

/* «Перевернуть»: стартовый экран → карты закрываются → перемешиваются → выбор */
function startGame() {
  if (phase === "setup") {
    if (!prepareRound()) return;
    /* Показываем карты лицом на мгновение, потом закрываем */
    setPhase("preview");
    $("gameStatus").textContent = "Запомни карты…";
    renderGameCards(true);
    setTimeout(() => {
      renderGameCards(false);
      setTimeout(() => {
        cards = cards.slice().sort(() => Math.random() - .5);
        setPhase("choice");
        $("gameStatus").textContent = "Выбирай карту";
        renderGameCards(false);
      }, 400);
    }, 800);
  }
}

function chooseCard(index) {
  if (phase !== "choice" || !cards[index]) return;
  if (selectedCardIndex !== -1) return;
  const chosen = cards[index];
  selectedCardIndex = index;
  setPhase("result");
  currentQuote = randomItem(loveQuotes);
  wallet.coins = (wallet.coins || 0) + GAME_REWARD_COINS;
  saveWallet();
  currentRecord = {
    id: (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
    gender: chosen.gender, name: chosen.name, symbol: chosen.symbol, portrait: chosen.portrait,
    photo: chosen.photo || "", color: chosen.color, bg1: chosen.bg1, bg2: chosen.bg2,
    comment: roundComment, quote: currentQuote, resultNote: "", resultNoteColor: noteColors[0].bg,
    pairType: selectedGender
  };
  renderResult();
  saveRecord();
  maybeShowGiftPopup();
}

/* =========================================================
   СЕКЦИЯ 8.11 — Квадратик-подарок
   ========================================================= */
function maybeShowGiftPopup() {
  if (!prizeSystemEnabled) return;
  if (Math.random() >= PRIZE_CHANCE) return;
  const prize = randomItem(PRIZE_POOL);
  const resultCard = $("resultCard");
  if (!resultCard) return;
  if (getComputedStyle(resultCard).position === "static") resultCard.style.position = "relative";
  const pop = document.createElement("button");
  pop.type = "button"; pop.className = "gift-pop"; pop.textContent = "🎁";
  pop.title = "Открыть подарок"; pop.setAttribute("aria-label", "Открыть подарок");
  resultCard.appendChild(pop);
  let expired = false;
  const expireTimer = setTimeout(() => {
    if (expired) return;
    expired = true;
    pop.classList.add("expired");
    pop.title = "Подарок исчез";
    pop.removeEventListener("click", onClick);
    pop.addEventListener("click", () => showToast("Подарок уже исчез."));
  }, 8000);
  const onClick = () => {
    if (expired) return;
    expired = true;
    clearTimeout(expireTimer);
    pop.remove();
    openGiftModal(prize);
  };
  pop.addEventListener("click", onClick);
}
function openGiftModal(prize) {
  $("modalTitle").textContent = "Вам подарок!";
  const content = $("modalContent");
  const qrSvg = prize.type === "qr" ? generateQrSvg(prize.code + Date.now()) : "";
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:8px 4px;">
      <div style="font-size:clamp(56px,16vw,96px);line-height:1;">${prize.emoji}</div>
      <div style="font-size:clamp(16px,2.4vw,22px);font-weight:800;color:var(--text);">${escapeHTML(prize.title)}</div>
      <div style="font-size:clamp(12px,1.2vw,14px);color:var(--muted);line-height:1.5;max-width:320px;">${escapeHTML(prize.sub)}</div>
      ${prize.type === "qr"
        ? `<div style="width:clamp(100px,30vw,160px);aspect-ratio:1;background:#fff;border-radius:10px;padding:6px;">${qrSvg}</div>`
        : `<div style="font-family:ui-monospace,Menlo,monospace;font-size:clamp(13px,2.4vw,16px);font-weight:800;padding:8px 12px;border-radius:8px;background:var(--input-bg);border:1px dashed var(--border-color);letter-spacing:.06em;">${escapeHTML(prize.code)}</div>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;margin-top:8px;">
        <button class="action-button primary" id="giftAccept" type="button" style="flex:1 1 140px;">🎁 Принять подарок</button>
        <button class="action-button" id="giftDecline" type="button" style="flex:1 1 120px;">Закрыть</button>
      </div>
      <div style="font-size:10.5px;color:var(--muted);line-height:1.4;">Если закрыть окно — подарок пропадёт и не попадёт в «Промокоды».</div>
    </div>`;
  $("modalBackdrop").classList.remove("hidden");
  content.querySelector("#giftAccept").addEventListener("click", () => {
    addPrizeToPromos(prize); closeModal();
    showToast(`Подарок «${prize.title}» добавлен в «Промокоды»!`);
  });
  content.querySelector("#giftDecline").addEventListener("click", () => {
    closeModal(); showToast("Подарок пропал. В следующий раз повезёт!");
  });
}
function addPrizeToPromos(prize) {
  promos.unshift({
    id: "prize_" + Date.now().toString(36),
    icon: prize.emoji, name: prize.title, desc: prize.sub, code: prize.code,
    used: false, type: prize.type, priceTon: prize.priceTon || "0.0 TON",
    source: "prize", receivedAt: Date.now()
  });
  savePromos();
}

/* =========================================================
   СЕКЦИЯ 8.12 — Результат
   ВАЖНО: карта-результат создаётся БЕЗ класса .flipped (рубашка),
   затем через 2×rAF получает .flipped → гарантированно видно фото/иконку.
   ========================================================= */
function renderResult() {
  if (!currentRecord) return;
  const holder = $("resultCard");
  holder.innerHTML = "";

  const characterForResult = {
    gender: currentRecord.gender, name: currentRecord.name, symbol: currentRecord.symbol,
    portrait: currentRecord.portrait, photo: currentRecord.photo,
    color: currentRecord.color, bg1: currentRecord.bg1, bg2: currentRecord.bg2
  };

  holder.innerHTML = cardMarkup(characterForResult, 0, false);
  const card = holder.querySelector(".card");
  if (!card) return;
  card.disabled = true;
  card.setAttribute("aria-disabled", "true");
  card.tabIndex = -1;

  /* Форсируем reflow, затем через 2×rAF переворачиваем */
  void card.offsetWidth;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      card.classList.add("flipped", "chosen");
    });
  });

  $("resultTitle").textContent = currentRecord.name || "";
  $("resultGender").textContent = genderLabel(currentRecord.gender) + ` · +${GAME_REWARD_COINS} 🪙 за игру`;
  $("resultQuote").textContent = currentQuote;
  const bubble = $("resultBubble");
  if (roundComment) {
    $("resultBubbleName").textContent = "Комментарий";
    $("resultBubbleText").textContent = roundComment;
    bubble.classList.remove("hidden");
  } else bubble.classList.add("hidden");
}

function saveRecord() {
  if (!currentRecord) return;
  const idx = archive.findIndex(i => i.id === currentRecord.id);
  if (idx >= 0) archive[idx] = {...currentRecord};
  else archive.unshift({...currentRecord});
  archive = archive.slice(0, 200);
  saveArchive();
}

function goBack() {
  document.querySelectorAll(".gift-pop").forEach(el => el.remove());
  if (roundTimer) { clearInterval(roundTimer); roundTimer = null; }
  setPhase("setup");
  cards = buildCharacters();
  renderGameCards(true);
}
function newGame() {
  document.querySelectorAll(".gift-pop").forEach(el => el.remove());
  if (roundTimer) { clearInterval(roundTimer); roundTimer = null; }
  roundComment = ""; currentRecord = null; selectedCardIndex = -1; lastRoundSnapshot = null;
  $("resultCard").innerHTML = ""; $("resultBubble").classList.add("hidden");
  if ($("battleComment")) $("battleComment").value = "";
  if ($("nameOne")) $("nameOne").value = "";
  if ($("nameTwo")) $("nameTwo").value = "";
  photoOne = ""; photoTwo = "";
  if ($("photoPreviewOne")) { $("photoPreviewOne").classList.remove("visible"); $("photoPreviewOneImg").src = ""; $("photoUploadOne").classList.remove("hidden"); }
  if ($("photoPreviewTwo")) { $("photoPreviewTwo").classList.remove("visible"); $("photoPreviewTwoImg").src = ""; $("photoUploadTwo").classList.remove("hidden"); }
  setPhase("setup");
  cards = buildCharacters();
  renderGameCards(true);
  $("gameStatus").textContent = "Две карты. Один выбор.";
}
function repeatRound() {
  document.querySelectorAll(".gift-pop").forEach(el => el.remove());
  if (roundTimer) { clearInterval(roundTimer); roundTimer = null; }
  if (lastRoundSnapshot) {
    const snap = lastRoundSnapshot;
    selectedGender = snap.gender;
    photoOne = snap.photos[0] || ""; photoTwo = snap.photos[1] || "";
    if ($("nameOne")) $("nameOne").value = snap.names[0] || "";
    if ($("nameTwo")) $("nameTwo").value = snap.names[1] || "";
    if ($("battleComment")) $("battleComment").value = snap.comment || "";
    syncGenderSelection();
  }
  roundComment = sanitizeComment(readCommentValue());
  cards = buildCharacters();
  selectedCardIndex = -1; currentRecord = null;
  $("resultCard").innerHTML = ""; $("resultBubble").classList.add("hidden");
  setPhase("setup");
  renderGameCards(true);
  $("gameStatus").textContent = "Две карты. Один выбор.";
}

/* =========================================================
   СЕКЦИЯ 8.13 — Подсказки
   ========================================================= */
function closeSuggest() { if (suggestPanel) { suggestPanel.remove(); suggestPanel = null; } suggestExpanded = false; }
function showSuggest(anchor, allTiles, refreshCb) {
  closeSuggest();
  const wrap = anchor.closest(".field-wrap") || anchor.parentElement;
  suggestPanel = document.createElement("div");
  suggestPanel.className = "suggest-panel";
  const visible = suggestExpanded ? allTiles : allTiles.slice(0, 5);
  visible.forEach(t => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "suggest-tile " + (t.type || "");
    btn.textContent = t.text;
    btn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); t.onPick(); closeSuggest(); });
    suggestPanel.appendChild(btn);
  });
  if (refreshCb) {
    const refreshBtn = document.createElement("button");
    refreshBtn.type = "button"; refreshBtn.className = "suggest-tile refresh";
    refreshBtn.innerHTML = `<span>🔄</span><span>Обновить</span>`;
    refreshBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); suggestExpanded = true; showSuggest(anchor, refreshCb(), refreshCb); });
    suggestPanel.appendChild(refreshBtn);
  }
  wrap.style.position = "relative";
  wrap.appendChild(suggestPanel);
}
function bindSuggestFor(el, kind, genderFn) {
  if (!el) return;
  const buildTiles = () => {
    if (kind === "name") {
      const gender = genderFn ? genderFn() : "Мужской";
      const pool = (gender === "Мужской" ? maleNames : femaleNames).slice().sort(() => Math.random() - 0.5).slice(0, 30);
      return pool.map(name => ({ text: name, type: "", onPick: () => { el.value = sanitizeName(name); refreshGameCards(); } }));
    }
    const pool = commentSuggestions.slice().sort(() => Math.random() - 0.5);
    return pool.map(item => ({ text: item.text, type: item.type, onPick: () => { el.value = sanitizeComment(item.text); } }));
  };
  el.addEventListener("focus", () => { suggestExpanded = false; showSuggest(el, buildTiles(), () => { suggestExpanded = true; return buildTiles(); }); });
}
function bindNameInput(el) { if (!el) return; el.addEventListener("input", () => { const c = sanitizeName(el.value); if (c !== el.value) el.value = c; }); }
function bindCommentInput(el) { if (!el) return; el.addEventListener("input", () => { const c = sanitizeComment(el.value); if (c !== el.value) el.value = c; }); }

/* =========================================================
   СЕКЦИЯ 8.14 — Тема / Фон
   ========================================================= */
function applyTheme(theme) { document.body.classList.toggle("light-theme", theme === "light"); settings.themeMode = theme; saveSettings(); }
function applyBgIcons(setIndex) {
  const set = bgIconSets[setIndex]; if (!set) return;
  const cell = 60, cols = 4, rows = 4, size = cols * cell;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const emoji = set.icons[(r * cols + c) % set.icons.length];
    svg += `<text x="${c*cell+cell/2}" y="${r*cell+cell/2+12}" font-size="28" text-anchor="middle" fill="#888" opacity="0.9">${emoji}</text>`;
  }
  svg += `</svg>`;
  document.body.style.setProperty("--bg-icons", `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`);
  settings.bgIconsSet = setIndex; saveSettings();
}
function applyWallpaper(colors) {
  if (!Array.isArray(colors) || colors.length < 3) return;
  const p = [...colors]; while (p.length < 5) p.push(p[p.length - 1]);
  document.body.style.backgroundImage = `linear-gradient(-45deg,${p[0]},${p[1]},${p[2]},${p[3]},${p[4]})`;
  document.body.style.backgroundSize = "400% 400%";
  document.documentElement.style.setProperty("--accent", p[3]);
  document.documentElement.style.setProperty("--accent2", p[4]);
}

        const reader = new FileReader();

    content.querySelector("#donateCopy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(DONATE_WALLET); showToast("Адрес кошелька скопирован."); }
      catch { showToast("Не удалось скопировать."); }
    });
  } else if (type === "services") {
    title.textContent = "Сервисы";
    content.innerHTML = `
      <p class="muted" style="margin-top:0;">Покупка монет за TON и другие игры проекта.</p>
      <div class="sub-section-title">🪙 Купить монеты</div>
      <div class="sub-cards">
        <div class="sub-card"><div class="sub-ico">🪙</div><div class="sub-info"><div class="sub-name">100 монет</div><div class="sub-sub">Стартовый набор</div></div><div class="sub-price">0.5 TON</div></div>
        <div class="sub-card"><div class="sub-ico">💰</div><div class="sub-info"><div class="sub-name">500 монет</div><div class="sub-sub">Выгоднее на 20%</div></div><div class="sub-price">2.0 TON</div></div>
        <div class="sub-card"><div class="sub-ico">💎</div><div class="sub-info"><div class="sub-name">1500 монет</div><div class="sub-sub">Максимум эмоций</div></div><div class="sub-price">5.0 TON</div></div>
      </div>
      <div class="sub-section-title">🎮 Другие игры</div>
      <div class="services-games" id="servicesGames"></div>
      <p class="sub-note">Оплата монет — в разработке. Другие игры — скоро!</p>`;
    const gamesHolder = content.querySelector("#servicesGames");
    gamesHolder.innerHTML = OTHER_GAMES.map(g => `
      <div class="service-game ${g.disabled ? "disabled" : ""}" data-game-name="${escapeHTML(g.name)}">
        <div class="sg-img">${g.emoji}</div>
        <div class="sg-name">${escapeHTML(g.name)}</div>
        <div class="sg-meta">${escapeHTML(g.meta)}</div>
        ${g.disabled ? `<span class="service-soon">скоро</span>` : ""}
      </div>`).join("");
    gamesHolder.querySelectorAll(".service-game").forEach(card => {
      card.addEventListener("click", () => {

      });

  backdrop.classList.remove("hidden");
}

function renderNewsList(content) {
  const list = content.querySelector("#newsList"); if (!list) return;
  list.innerHTML = news.map(item => `
    <div class="news-tile" data-news-id="${item.id}">
      <div class="news-photo"><div class="news-photo-emoji">${item.icon || "📰"}</div></div>
      <div class="news-body">
        <div>
          <div class="news-headline">${escapeHTML(item.title)}</div>
          <div class="news-meta"><span class="news-tag">${escapeHTML(item.tag)}</span><span>${escapeHTML(item.date)}</span></div>
          <div class="news-preview">${escapeHTML(item.preview)}</div>
        </div>
        <div class="news-actions">
          <button class="news-action-btn ${item.liked ? "liked" : ""}" data-news-like="${item.id}"><span class="news-ico">${item.liked ? "❤️" : "🤍"}</span><span>${item.likes}</span></button>
          <button class="news-action-btn" data-news-view="${item.id}"><span class="news-ico">👁</span><span>${item.views}</span></button>
          <button class="news-action-btn" data-news-open="${item.id}"><span class="news-ico">📖</span><span>Читать</span></button>
          <button class="news-action-btn" data-news-share="${item.id}"><span class="news-ico">📤</span><span>Поделиться</span></button>
        </div>
      </div>
    </div>`).join("");
  list.querySelectorAll("[data-news-like]").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); const rec = news.find(n => n.id === btn.dataset.newsLike); if (!rec) return; if (rec.liked) { rec.liked = false; rec.likes = Math.max(0, rec.likes - 1); } else { rec.liked = true; rec.likes += 1; } saveNews(); renderNewsList(content); });
  });
  list.querySelectorAll("[data-news-view]").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); const rec = news.find(n => n.id === btn.dataset.newsView); if (!rec) return; rec.views += 1; saveNews(); renderNewsList(content); });
  });
  list.querySelectorAll("[data-news-open]").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); openNewsDetail(btn.dataset.newsOpen); });
  });
  list.querySelectorAll("[data-news-share]").forEach(btn => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); const rec = news.find(n => n.id === btn.dataset.newsShare); if (!rec) return; shareText(`📰 ${rec.title}\n\n${rec.preview}\n\nПереворот · новости`); });
  });
}
function openNewsDetail(id) {
  const rec = news.find(n => n.id === id); if (!rec) return;
  rec.views += 1; saveNews();
  $("modalTitle").textContent = "Новость";
  const content = $("modalContent");
  content.innerHTML = `
    <div style="width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin-bottom:12px;background:linear-gradient(135deg, rgba(84,169,235,.25), rgba(255,79,131,.25));display:grid;place-items:center;font-size:64px;">${rec.icon || "📰"}</div>
    <h2 style="font-size:20px;font-weight:800;margin:0 0 8px;">${escapeHTML(rec.title)}</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:12px;"><span class="news-tag">${escapeHTML(rec.tag)}</span><span>${escapeHTML(rec.date)}</span><span>👁 ${rec.views}</span><span>❤️ ${rec.likes}</span></div>
    <div style="font-size:13px;line-height:1.6;white-space:pre-wrap;">${escapeHTML(rec.body)}</div>`;
  $("modalBackdrop").classList.remove("hidden");
}
function openTicket(rec) {
  $("modalTitle").textContent = "Чек игры";
  const pairLabel = rec.pairType === "mm" ? "М / М" : rec.pairType === "ff" ? "Ж / Ж" : "М / Ж";
  const content = $("modalContent");
  content.innerHTML = `
    <div class="ticket">
      <div class="ticket-head">✦ Переворот ✦</div>
      <div class="ticket-row"><span class="k">Кто играл</span><span class="v">${pairLabel}</span></div>
      <div class="ticket-divider"></div>
      <div class="ticket-row"><span class="k">Победитель</span><span class="v">${escapeHTML(rec.symbol || "♔")} ${escapeHTML(rec.name || "—")}</span></div>
      <div class="ticket-row"><span class="k">Пол</span><span class="v">${escapeHTML(rec.gender || "—")}</span></div>
      ${rec.quote ? `<div class="ticket-divider"></div><div style="font-style:italic;font-size:12px;line-height:1.5;">${escapeHTML(rec.quote)}</div>` : ""}
    </div>
    <div class="actions" style="margin-top:12px;"><button class="action-button primary" id="ticketShare" style="width:100%">📤 Отправить чек</button></div>`;
  content.querySelector("#ticketShare").addEventListener("click", () => {
    shareText(`✦ ЧЕК ИГРЫ «ПЕРЕВОРОТ» ✦\nПобедитель: ${rec.symbol || "♔"} ${rec.name}`);
  });
  $("modalBackdrop").classList.remove("hidden");
}
function closeModal() { $("modalBackdrop").classList.add("hidden"); }
function exportArchive() {
  const blob = new Blob([JSON.stringify(archive, null, 2)], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = "perevorot-archive.json";
  document.body.appendChild(link); link.click(); link.remove();
  URL.revokeObjectURL(url);
  showToast("Экспорт готов.");
}
function updateExitHeartsVisibility() {
  const hearts = document.querySelector(".exit-hearts .eh-bg");
  if (!hearts) return;
  hearts.style.display = exitHeartsEnabled ? "" : "none";
}
async function shareText(text) {
  try {
    if (navigator.share) { await navigator.share({ title: "Переворот", text }); showToast("Отправлено!"); }
    else { await navigator.clipboard.writeText(text); showToast("Скопировано!"); }
  } catch (e) { if (e.name !== "AbortError") showToast("Не удалось."); }
}

   СЕКЦИЯ 8.17 — Профиль
   ========================================================= */
const profileMenu = $("profileMenu");
function openProfileMenu() {
  profileMenu.classList.add("is-open");
  $("profileMenuName").textContent = sanitizeName(settings.profileName || "Игрок") || "Игрок";
  $("profileMenuSub").textContent = wallet.coins + " 🪙 · " + (wallet.subscriptionUntil > Date.now() ? "Подписка активна" : "Без подписки");
  renderStoryAvatar();
}
function closeProfileMenu() { profileMenu.classList.remove("is-open"); }
function toggleProfileMenu() { if (profileMenu.classList.contains("is-open")) closeProfileMenu(); else openProfileMenu(); }

function renderStoryAvatar() {
  const inner = $("storyAvatarInner"), ring = $("storyAvatarRing"), badge = $("storyBadge");
  if (!inner || !ring || !badge) return;
  const av = settings.avatarType === "photo" && settings.avatarPhoto
    ? `<img src="${settings.avatarPhoto}" alt="">`
    : `<span>${settings.avatarEmoji || "♙"}</span>`;
  inner.innerHTML = av;
  ring.style.setProperty("--story-gradient", settings.storyGradient || storyGradients[0]);
  if (currentStory && currentStory.photo) {
    badge.textContent = "👁";
  } else {
    badge.textContent = "+";
  }
}

$("storyAvatarWrap").addEventListener("click", (e) => {
  e.stopPropagation();
  if (currentStory && currentStory.photo) openStoryViewer();
  else openStoryCreator();
});

profileMenu.querySelectorAll("[data-profile-action]").forEach(btn => {
  btn.addEventListener("click", () => {
    const action = btn.dataset.profileAction;
    closeProfileMenu();
    switch (action) {
      case "story": if (currentStory && currentStory.photo) openStoryViewer(); else openStoryCreator(); break;
      case "settings": openProfileSettings(); break;
      case "promo": openPromosModal(); break;
      case "tables": openTablesModal(); break;
      case "bets": openBetsModal(); break;
      case "archive": openModal("archive"); break;
      case "wallpaper": openModal("wallpaper"); break;
      case "wallet": openWallet(); break;
      case "subscribe": openSubscribe(); break;
    }
  });
});

/* =========================================================
   СЕКЦИЯ 8.18 — ИСТОРИИ (п.3)
   Загрузка до 10 МБ PNG/JPEG, градиент вокруг кружка, лайк и просмотры.
   ========================================================= */
function openStoryCreator() {
  $("modalTitle").textContent = "История";
  const content = $("modalContent");
  content.innerHTML = `
    <p class="muted">Выложи фото как историю. PNG / JPEG, до 10 МБ.</p>
    <input type="file" id="storyFileInput" accept="image/png,image/jpeg,image/jpg" style="display:none">
    <div class="actions"><button class="action-button primary" id="storyPickFile" style="width:100%">📷 Загрузить фото</button></div>
    <div class="section-title" style="margin-top:16px;">Градиент вокруг кружка</div>
    <div class="story-gradient-grid" id="storyGradientGrid"></div>
    <p class="muted" style="margin-top:12px;font-size:11px;">Выбери градиент — он будет крутиться вокруг кружка истории в профиле.</p>`;
  content.querySelector("#storyPickFile").addEventListener("click", () => content.querySelector("#storyFileInput").click());
  content.querySelector("#storyFileInput").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    if (!ALLOWED_IMAGE_TYPES.includes(f.type)) { showToast("Только PNG или JPEG."); return; }
    if (f.size > STORY_MAX_BYTES) { showToast(`Файл больше ${STORY_MAX_BYTES / 1024 / 1024} МБ.`); return; }
    const r = new FileReader();
    r.onload = (ev) => {
      currentStory = {
        photo: ev.target.result,
        createdAt: Date.now(),
        likes: 0,
        views: 0,
        liked: false
      };
      saveStory();
      renderStoryAvatar();
      closeModal();
      showToast("История выложена!");
    };
    r.readAsDataURL(f);
  });
  renderStoryGradientPicker(content);
  $("modalBackdrop").classList.remove("hidden");
}
function renderStoryGradientPicker(content) {
  const holder = content.querySelector("#storyGradientGrid");
  if (!holder) return;
  const current = settings.storyGradient || storyGradients[0];
  holder.innerHTML = storyGradients.map((g, i) => `
    <button type="button" class="story-gradient-btn ${current === g ? "selected" : ""}" data-gradient-index="${i}">
      <div class="sg-inner" style="background:${g};"></div>
    </button>`).join("");
  holder.querySelectorAll("[data-gradient-index]").forEach(btn => {
    btn.addEventListener("click", () => {
      const g = storyGradients[Number(btn.dataset.gradientIndex)];
      settings.storyGradient = g;
      saveSettings();
      holder.querySelectorAll(".story-gradient-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      renderStoryAvatar();
      showToast("Градиент истории обновлён.");
    });
  });
}
function openStoryViewer() {
  if (!currentStory || !currentStory.photo) return;
  const viewer = $("storyViewer");
  viewer.classList.remove("hidden");
  $("storyViewerImg").src = currentStory.photo;
  $("storyViewerName").textContent = sanitizeName(settings.profileName || "Игрок") || "Игрок";
  const t = new Date(currentStory.createdAt || Date.now());

  content.querySelector("#promoActivate").addEventListener("click", () => {
    const code = (content.querySelector("#promoInput").value || "").trim().toUpperCase();

    const found = promos.find(p => p.code === code) || DEFAULT_PROMOS.find(p => p.code === code);
    if (!found) { showToast("Промокод не найден."); return; }
    const existing = promos.find(p => p.code === code);
    if (existing && existing.used) { showToast("Уже активирован."); return; }
    if (existing) existing.used = true;
    else promos.push({ ...found, used: true, type: found.type || "promo", priceTon: found.priceTon || "0.3 TON" });
    savePromos(); openPromosModal(); showToast(`Промокод «${found.name}» активирован!`);
  });
