function renderBonusList(content) {
  const holder = content.querySelector("#bonusList"); if (!holder) return;
  holder.innerHTML = bonusGifts.map(g => `
    <div class="promo-item" style="opacity:${g.accepted ? .6 : 1};">
      <div class="promo-ico">${g.emoji}</div>
      <div class="promo-body">
        <div class="promo-name">${escapeHTML(g.name)}</div>
        <div class="promo-desc">${escapeHTML(g.desc)}</div>
        <div class="promo-desc" style="font-weight:800;color:#00c853;">+${g.coins} 🪙</div>
        ${g.accepted ? `<div class="promo-desc" style="color:#00c853;font-weight:800;margin-top:6px;">✅ Принято</div>` : `<button class="promo-btn primary" data-bonus-accept="${g.id}" style="margin-top:6px;">Принять</button>`}
      </div>
    </div>`).join("");
  holder.querySelectorAll("[data-bonus-accept]").forEach(btn => {
    btn.addEventListener("click", () => {
      const gift = bonusGifts.find(x => x.id === btn.dataset.bonusAccept);
      if (!gift || gift.accepted) return;
      gift.accepted = true;
      wallet.coins = (wallet.coins || 0) + gift.coins;
      saveWallet(); saveBonusGifts(); renderBonusList(content);
      showToast(`Бонус «${gift.name}» принят: +${gift.coins} монет!`);
    });
  });
}
function renderPromoList(content) {
  const holder = content.querySelector("#promoList"); if (!holder) return;
  holder.innerHTML = promos.map(p => `
    <div class="promo-item ${p.used ? "used" : ""}">
      <div class="promo-ico">${p.icon || "🎟️"}</div>
      <div class="promo-body">
        <div class="promo-name">${escapeHTML(p.name)}</div>
        <div class="promo-desc">${escapeHTML(p.desc)}</div>
        <span class="promo-code">${escapeHTML(p.code)}</span>
        <div class="promo-actions">
          <button class="promo-btn" data-promo-copy="${p.id}">📋 Скопировать</button>
          ${!p.used ? `<button class="promo-btn primary" data-promo-use="${p.id}">✅ Использовать</button>` : ""}
        </div>
      </div>
    </div>`).join("");
  holder.querySelectorAll("[data-promo-copy]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const rec = promos.find(p => p.id === btn.dataset.promoCop);
      if (!rec) return;
      try { await navigator.clipboard.writeText(rec.code); showToast("Код скопирован."); } catch { showToast("Не удалось."); }
    });
  });
  holder.querySelectorAll("[data-promo-use]").forEach(btn => {
    btn.addEventListener("click", () => {
      const rec = promos.find(p => p.id === btn.dataset.promoUse);
      if (!rec) return;
      rec.used = true;
      savePromos(); renderPromoList(content);
      showToast(`Промокод «${rec.name}» использован!`);
    });
  });
}

function generateTables(count) {
  const tables = [];
  const ROBOT_NAMES = ["Альфа","Бета","Гамма","Дельта","Эпсилон","Зета","Эта","Тета"];
  for (let i = 0; i < count; i++) {
    const pair = randomItem(["mm","mf","ff"]);
    const status = randomItem(["waiting","playing","done"]);
    const players = [];
    const n = Math.floor(Math.random() * 2) + 2;
    for (let j = 0; j < n; j++) players.push({ name: randomItem(ROBOT_NAMES) + "-" + (j + 1), isBot: true });
    tables.push({ id: "table_" + i + "_" + Date.now().toString(36), title: "Стол #" + (i + 1), pair, status, players, pot: Math.floor(Math.random() * 500) + 50, round: Math.floor(Math.random() * 20) + 1 });
  }
  return tables;
}
function openBetsModal() {
  $("modalTitle").textContent = "Ставки";
  const content = $("modalContent");
  const coins = wallet.coins || 0;
  content.innerHTML = `
    <div class="bets-balance-box"><div><div class="bb-label">Баланс</div><div class="bb-value">${coins} 🪙</div></div><div class="muted" style="font-size:11px;text-align:right;">+${GAME_REWARD_COINS} за игру</div></div>
    <p class="muted">Сделайте ставку на карту. Победа — ×2.</p>
    <div class="bets-form">
      <div class="bf-row"><label>Ставка</label><input type="number" id="betAmount" min="1" max="${coins}" value="${Math.min(10, coins)}" inputmode="numeric"></div>
      <div class="bf-row"><label>Карта</label><select id="betChoice" style="color:var(--text);background:var(--input-bg);border:1px solid var(--border-color);border-radius:10px;padding:10px;"><option value="0">Первая карта</option><option value="1">Вторая карта</option></select></div>
      <button class="action-button primary" id="placeBet" type="button" style="width:100%">🎰 Сделать ставку</button>
      <div class="bf-result hidden" id="betResult"></div>
    </div>`;
  content.querySelector("#placeBet").addEventListener("click", () => {
    const amount = Math.floor(Number(content.querySelector("#betAmount").value) || 0);
    if (amount <= 0) { showToast("Введите ставку больше 0."); return; }
    if (amount > (wallet.coins || 0)) { showToast("Недостаточно монет."); return; }
    wallet.coins -= amount; saveWallet();
    const win = Math.random() < 0.5;
    const prize = win ? amount * 2 : 0;
    if (win) { wallet.coins += prize; saveWallet(); }
    const result = content.querySelector("#betResult");
    result.classList.remove("hidden", "win", "lose");
    if (win) { result.classList.add("win"); result.textContent = `🎉 Победа! +${prize} 🪙. Баланс: ${wallet.coins} 🪙`; }
    else { result.classList.add("lose"); result.textContent = `😔 Проигрыш. -${amount} 🪙. Баланс: ${wallet.coins} 🪙`; }
    content.querySelector(".bb-value").textContent = wallet.coins + " 🪙";
  });
  $("modalBackdrop").classList.remove("hidden");
}

function hideSplash() {
  const splash = $("splashScreen");
  if (!splash) return;

}
function initApp() {
  if (settings.themeMode !== "dark") { document.body.classList.add("light-theme"); settings.themeMode = "light"; }
  else document.body.classList.remove("light-theme");
  if (Array.isArray(settings.customColors)) applyWallpaper(settings.customColors);
  else if (Number.isInteger(settings.theme) && themes[settings.theme]) applyWallpaper(themes[settings.theme].colors);
  if (Number.isInteger(settings.bgIconsSet)) applyBgIcons(settings.bgIconsSet); else applyBgIcons(0);
  updateProfileAvatar();
  renderStoryAvatar();
  if (typeof wallet.coins !== "number") { wallet.coins = 100; saveWallet(); }
  bindPhotoLoader({ suffix: "One", onSet: (val) => { photoOne = val; }, getPhoto: () => photoOne });
  bindPhotoLoader({ suffix: "Two", onSet: (val) => { photoTwo = val; }, getPhoto: () => photoTwo });
  bindNameInput($("nameOne")); bindNameInput($("nameTwo")); bindCommentInput($("battleComment"));
  bindSuggestFor($("nameOne"), "name", () => (selectedGender === "ff") ? "Женский" : "Мужской");
  bindSuggestFor($("nameTwo"), "name", () => (selectedGender === "mm") ? "Мужской" : "Женский");
  bindSuggestFor($("battleComment"), "comment");
  const last = loadLastNames();
  if (last.one && $("nameOne") && !$("nameOne").value) $("nameOne").value = last.one;
  if (last.two && $("nameTwo") && !$("nameTwo").value) $("nameTwo").value = last.two;

  cards = buildCharacters();
  setPhase("setup");
  renderGameCards(true);
  $("gameStatus").textContent = "Две карты. Один выбор.";
  syncGenderSelection();
  updateExitHeartsVisibility();
  setTimeout(hideSplash, 1500);
}
initApp();
</script>
</body>
</html>
