      <div class="rules-title">Правила игры</div>
      <div class="rules-grid">
        ${gameRules.map(r => `
          <div class="rule-card">
            <div class="rule-img">${r.icon}</div>
            <div class="rule-num">${r.num}</div>
            <div class="rule-text">${escapeHTML(r.text)}</div>
          </div>
        `).join("")}
      </div>
    `;
  } else if (type === "news") {
    /* NEW: Новости — только официальный шрифт, адаптивные */
    title.textContent = "Новости";
    content.innerHTML = `<div class="news-list" id="newsList"></div>`;
    renderNewsList(content);
  } else if (type === "support") {
    title.textContent = "Техподдержка";
    supportSelectedTags = new Set();
    supportPhotos = [];
    content.innerHTML = `
      <div class="support-hero">
        <div class="support-img" aria-hidden="true">🛟</div>
        <h3>Мы на связи</h3>
        <p>Опиши ситуацию — выбери тему хештегом, приложи до 3 фото (PNG/JPG, до 5 МБ) и напиши сообщение до 1500 символов.</p>
      </div>
      <div class="support-tags" id="supportTags">
        ${supportTags.map(t => `
          <button type="button" class="support-tag ${t.cls}" data-tag-id="${t.id}">${t.label}</button>
        `).join("")}
      </div>
      <div class="support-photos" id="supportPhotos">
        ${[0,1,2].map(i => `
          <button type="button" class="support-photo-slot" data-slot="${i}" aria-label="Добавить фото">
            <span class="slot-add">📷<small>фото</small></span>
          </button>
        `).join("")}
      </div>
      <div class="support-photo-info">PNG / JPG · до 5 МБ · максимум 3 фото</div>
      <textarea id="supportMessage" maxlength="${SUPPORT_MAX}" placeholder="Опиши проблему, идею или вопрос…" style="margin-top:12px"></textarea>
      <div class="support-counter" id="supportCounter">0 / ${SUPPORT_MAX}</div>
      <div class="support-actions">
        <button class="action-button primary" id="sendSupport" type="button">Отправить</button>
        <button class="action-button" id="copySupport" type="button">Скопировать</button>
      </div>
    `;

    const textarea = content.querySelector("#supportMessage");
    const counter = content.querySelector("#supportCounter");
    const photosWrap = content.querySelector("#supportPhotos");

    textarea.addEventListener("input", () => {
      const clean = sanitizeSupport(textarea.value);
      if (clean !== textarea.value) textarea.value = clean;
      const len = clean.length;
      counter.textContent = len + " / " + SUPPORT_MAX;
      counter.classList.toggle("warn", len > SUPPORT_MAX * 0.85 && len <= SUPPORT_MAX);
      counter.classList.toggle("over", len >= SUPPORT_MAX);
    });

    content.querySelectorAll("[data-tag-id]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.tagId;
        if (supportSelectedTags.has(id)) {
          supportSelectedTags.delete(id);
          btn.classList.remove("selected");
        } else {
          supportSelectedTags.add(id);
          btn.classList.add("selected");
        }
      });
    });

    photosWrap.querySelectorAll(".support-photo-slot").forEach((slot, idx) => {
      slot.addEventListener("click", (e) => {
        if (e.target.closest(".slot-remove")) return;
        if (supportPhotos[idx]) return;
        openSupportPhotoPicker(idx);
      });
    });

    function openSupportPhotoPicker(slotIdx) {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/png,image/jpeg,image/jpg";
      input.style.display = "none";
      document.body.appendChild(input);
      input.addEventListener("change", () => {
        const f = input.files[0];
        if (!f) { input.remove(); return; }
        const okTypes = ["image/png", "image/jpeg", "image/jpg"];
        if (!okTypes.includes(f.type)) { showToast("Только PNG или JPG."); input.remove(); return; }
        if (f.size > SUPPORT_PHOTO_MAX_BYTES) { showToast("Фото больше 5 МБ."); input.remove(); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const dataUrl = ev.target.result;
          if (!/^data:image\/(png|jpeg|jpg);base64,/.test(dataUrl)) { showToast("Некорректный файл."); input.remove(); return; }
          supportPhotos[slotIdx] = dataUrl;
          renderSupportPhotoSlot(slotIdx);
          input.remove();
        };
        reader.readAsDataURL(f);
      });
      input.click();
    }

    function renderSupportPhotoSlot(slotIdx) {
      const slot = photosWrap.querySelector(`[data-slot="${slotIdx}"]`);
      if (!slot) return;
      const dataUrl = supportPhotos[slotIdx];
      if (!dataUrl) {
        slot.classList.remove("filled");
        slot.innerHTML = `<span class="slot-add">📷<small>фото</small></span>`;
        return;
      }
      slot.classList.add("filled");
      slot.innerHTML = `
        <img src="${dataUrl}" alt="">
        <span class="slot-remove" data-remove-slot="${slotIdx}" aria-label="Удалить фото">×</span>
      `;
      const rm = slot.querySelector("[data-remove-slot]");
      rm.addEventListener("click", (e) => {
        e.stopPropagation(); e.preventDefault();
        supportPhotos[slotIdx] = "";
        renderSupportPhotoSlot(slotIdx);
      });
    }

    content.querySelector("#sendSupport").addEventListener("click", async () => {
      const msg = sanitizeSupport(textarea.value.trim());
      if (!msg) { showToast("Напиши сообщение."); return; }
      const tagsLine = [...supportSelectedTags]
        .map(id => supportTags.find(t => t.id === id)?.label)
        .filter(Boolean)
        .join(" ");
      const photosCount = supportPhotos.filter(Boolean).length;
      const full = `Переворот · Техподдержка\n${tagsLine ? tagsLine + "\n" : ""}Фото: ${photosCount}\n${msg}`;
      try {
        await navigator.clipboard.writeText(full);
        showToast("Сообщение скопировано. Отправь его в поддержку.");
      } catch { showToast("Не удалось скопировать."); }
    });

    content.querySelector("#copySupport").addEventListener("click", async () => {
      const msg = sanitizeSupport(textarea.value.trim());
      if (!msg) { showToast("Напиши сообщение."); return; }
      try {
        await navigator.clipboard.writeText("Переворот: " + msg);
        showToast("Скопировано.");
      } catch { showToast("Не удалось скопировать."); }
    });
  } else if (type === "donate") {
    title.textContent = "Поддержать проект";
    content.innerHTML = `
      <div class="donate-hero">
        <div class="donate-emoji" aria-hidden="true">💖</div>
        <h3>Спасибо, что ты с нами!</h3>
        <p>Каждая поддержка помогает развивать «Переворот»: новые режимы, карточки, темы и сюрпризы.</p>
      </div>
      <div class="sub-section-title">🎮 Активные игры</div>
      <div class="donate-games">
        ${activeGameModes.map(g => `
          <div class="donate-game">
            <div class="dg-img">${g.icon}</div>
            <div class="dg-name">${escapeHTML(g.name)}</div>
            <div class="dg-meta">${escapeHTML(g.meta)}</div>
          </div>
        `).join("")}
      </div>
      <div class="sub-section-title">📊 Игры за неделю</div>
      <div class="donate-chart">
        <div class="donate-bars">
          ${donateStats.map(s => `
            <div class="donate-bar-col">
              <div class="donate-bar" style="height:${Math.max(6, s.value)}%"></div>
              <div class="donate-bar-label">${escapeHTML(s.day)}</div>
            </div>
          `).join("")}
        </div>
      </div>
      <div class="sub-section-title">💎 Поддержать</div>
      <div class="donate-box">
        <label for="donateWallet">Telegram / TON кошелёк</label>
        <div class="donate-wallet">
          <input id="donateWallet" type="text" readonly value="${DONATE_WALLET}">
          <button class="donate-copy-btn" id="donateCopy" type="button">Скопировать</button>
        </div>
        <div class="donate-hint">Нажми «Скопировать» — адрес попадёт в буфер.</div>
      </div>
    `;
    content.querySelector("#donateCopy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(DONATE_WALLET);
        showToast("Адрес кошелька скопирован.");
      } catch { showToast("Не удалось скопировать."); }
    });
  } else if (type === "services") {
    title.textContent = "Сервисы";
    content.innerHTML = `<p class="muted">Дополнительные сервисы.</p>`;
  }
  backdrop.classList.remove("hidden");
}

/* NEW: рендер списка новостей (только официальный шрифт) */
function renderNewsList(content) {
  const list = content.querySelector("#newsList");
  if (!list) return;
  list.innerHTML = news.map(item => `
    <div class="news-tile" data-news-id="${item.id}">
      <div class="news-photo">
        <div class="news-photo-emoji">${item.icon || "📰"}</div>
      </div>
      <div class="news-fade"></div>
      <div class="news-body">
        <div>
          <div class="news-headline">${escapeHTML(item.title)}</div>
          <div class="news-meta">
            <span class="news-tag">${escapeHTML(item.tag)}</span>
            <span>${escapeHTML(item.date)}</span>
          </div>
          <div class="news-preview">${escapeHTML(item.preview)}</div>
        </div>
        <div class="news-actions">
          <button class="news-action-btn ${item.liked ? "liked" : ""}" data-news-like="${item.id}">
            <span class="news-ico">${item.liked ? "❤️" : "🤍"}</span><span>${item.likes}</span>
          </button>
          <button class="news-action-btn" data-news-view="${item.id}">
            <span class="news-ico">👁</span><span>${item.views}</span>
          </button>
          <button class="news-action-btn" data-news-open="${item.id}">
            <span class="news-ico">📖</span><span>Читать</span>
          </button>
          <button class="news-action-btn" data-news-share="${item.id}">
            <span class="news-ico">📤</span><span>Поделиться</span>
          </button>
        </div>
      </div>
    </div>
  `).join("");

  list.querySelectorAll("[data-news-like]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.newsLike;
      const rec = news.find(n => n.id === id);
      if (!rec) return;
      if (rec.liked) { rec.liked = false; rec.likes = Math.max(0, rec.likes - 1); }
      else { rec.liked = true; rec.likes += 1; }
      saveNews();
      renderNewsList(content);
    });
  });
  list.querySelectorAll("[data-news-view]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.newsView;
      const rec = news.find(n => n.id === id);
      if (!rec) return;
      rec.views += 1;
      saveNews();
      renderNewsList(content);
    });
  });
  list.querySelectorAll("[data-news-open]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      openNewsDetail(btn.dataset.newsOpen);
    });
  });
  list.querySelectorAll("[data-news-share]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const rec = news.find(n => n.id === btn.dataset.newsShare);
      if (!rec) return;
      shareText(`📰 ${rec.title}\n\n${rec.preview}\n\nПереворот · новости`);
    });
  });
}

/* NEW: детальный просмотр новости + комментарии */
function openNewsDetail(id) {
  const rec = news.find(n => n.id === id);
  if (!rec) return;
  rec.views += 1;
  saveNews();

  $("modalTitle").textContent = "Новость";
  const content = $("modalContent");
  content.innerHTML = `
    <div class="news-detail-photo">
      <div class="news-photo-emoji" style="width:100%;height:100%;display:grid;place-items:center;font-size:64px;background:linear-gradient(135deg, rgba(84,169,235,.25), rgba(255,79,131,.25));">${rec.icon || "📰"}</div>
    </div>
    <h2 class="news-detail-title">${escapeHTML(rec.title)}</h2>
    <div class="news-detail-meta">
      <span class="news-tag" style="padding:2px 6px;border-radius:6px;background:rgba(0,136,204,.12);color:#0088cc;font-weight:700;font-size:10px;text-transform:uppercase;">${escapeHTML(rec.tag)}</span>
      <span>${escapeHTML(rec.date)}</span>
      <span>👁 ${rec.views}</span>
      <span>❤️ ${rec.likes}</span>
    </div>
    <div class="news-detail-body">${escapeHTML(rec.body)}</div>
    <div class="news-comments">
      <div class="news-comments-title">Комментарии (${rec.comments.length})</div>
      <div id="newsCommentsList"></div>
      <div class="news-comment-row">
        <input type="text" id="newsCommentInput" maxlength="200" placeholder="Оставить комментарий…">
        <button class="action-button primary" id="newsCommentSend" type="button">Отправить</button>
      </div>
    </div>
  `;
  renderNewsComments(content, rec);

  content.querySelector("#newsCommentSend").addEventListener("click", () => {
    const input = content.querySelector("#newsCommentInput");
    const text = sanitizeComment(input.value.trim());
    if (!text) { showToast("Напиши комментарий."); return; }
    rec.comments.push({
      name: sanitizeName(settings.profileName || "Игрок") || "Игрок",
      text, ts: Date.now()
    });
    saveNews();
    input.value = "";
    renderNewsComments(content, rec);
    showToast("Комментарий добавлен.");
  });
}

function renderNewsComments(content, rec) {
  const holder = content.querySelector("#newsCommentsList");
  if (!holder) return;
  if (!rec.comments.length) {
    holder.innerHTML = `<p class="muted" style="font-size:11px;">Пока нет комментариев.</p>`;
    return;
  }
  holder.innerHTML = rec.comments.map(c => `
    <div class="news-comment">
      <div class="nc-name">${escapeHTML(c.name)}</div>
      <div class="nc-text">${escapeHTML(c.text)}</div>
    </div>
  `).join("");
}

function closeModal() { $("modalBackdrop").classList.add("hidden"); }

function applyWallpaper(colors) {
  if (!Array.isArray(colors) || colors.length < 3) return;
  const p = [...colors];
  while (p.length < 5) p.push(p[p.length - 1]);
  document.body.style.backgroundImage = `linear-gradient(-45deg,${p[0]},${p[1]},${p[2]},${p[3]},${p[4]})`;
  document.body.style.backgroundSize = "400% 400%";
  document.documentElement.style.setProperty("--accent", p[3]);
  document.documentElement.style.setProperty("--accent2", p[4]);
}

function exportArchive() {
  const blob = new Blob([JSON.stringify(archive, null, 2)], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "perevorot-archive.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  showToast("Экспорт готов.");
}

      const found = DEFAULT_PROMOS.find(p => p.code === code);
      if (!found) { showToast("Промокод не найден."); return; }
      promos.push({ ...found, used: false });
      savePromos();
      content.querySelector("#promoInput").value = "";
      renderPromoList(content);
      showToast(`Промокод «${found.name}» добавлен!`);
    });
    return;
  }

  content.innerHTML = `
    <p class="muted" style="margin-top:0;">Здесь собраны ваши купоны, промокоды и подарочные карты. Введите код, чтобы активировать новый.</p>
    <div class="promo-section-title">Активные</div>
    <div class="promo-grid" id="promoList"></div>
    <div class="promo-section-title">Активировать код</div>
    <div class="promo-input-row">
      <input type="text" id="promoInput" maxlength="24" placeholder="Введите промокод" autocomplete="off">
      <button class="promo-btn primary" id="promoActivate" type="button">Активировать</button>
    </div>
    <div class="muted" style="margin-top:8px;font-size:11px;">Доступные коды: START2026 · TON15 · GIFT10NFT</div>
  `;
  renderPromoList(content);

  const input = content.querySelector("#promoInput");
  input.addEventListener("input", () => {
    input.value = input.value.toUpperCase().replace(/[^A-Z0-9\-]/g, "").slice(0, 24);
  });

  content.querySelector("#promoActivate").addEventListener("click", () => {
    const code = (content.querySelector("#promoInput").value || "").trim().toUpperCase();
    if (!code) { showToast("Введите промокод."); return; }
    const found = promos.find(p => p.code === code) || DEFAULT_PROMOS.find(p => p.code === code);
    if (!found) { showToast("Промокод не найден."); return; }

    if (existing && existing.used) { showToast("Этот промокод уже активирован."); return; }
    if (existing) { existing.used = true; }
    else { promos.push({ ...found, used: true }); }
    savePromos();
    content.querySelector("#promoInput").value = "";
    renderPromoList(content);
    showToast(`Промокод «${found.name}» активирован!`);
  });
}

function renderPromoList(content) {
  const holder = content.querySelector("#promoList");
  if (!holder) return;
  if (!promos.length) {
    holder.innerHTML = `<p class="muted" style="font-size:12px;">Пока нет промокодов.</p>`;
    return;
  }
  holder.innerHTML = promos.map(p => `
    <div class="promo-item ${p.used ? "used" : ""}" data-promo-id="${p.id}">
      <div class="promo-ico">${p.icon || "🎟️"}</div>
      <div class="promo-body">
        <div class="promo-name">${escapeHTML(p.name)}</div>
        <div class="promo-desc">${escapeHTML(p.desc)}</div>
        <span class="promo-code">${escapeHTML(p.code)}</span>
        <div class="promo-actions">
          <button class="promo-btn primary" data-promo-copy="${p.id}" ${p.used ? "disabled" : ""}>
            ${p.used ? "Активирован" : "Скопировать код"}
          </button>
        </div>
      </div>
    </div>
  `).join("");

  holder.querySelectorAll("[data-promo-copy]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-promo-copy");
      const rec = promos.find(p => p.id === id);
      if (!rec) return;
      try {
        await navigator.clipboard.writeText(rec.code);
        showToast("Код скопирован.");
      } catch { showToast("Не удалось скопировать."); }
    });
  });
}

/* NEW: Настройки профиля — с аватаркой (перенесена сюда) */
function openProfileSettings() {
  $("modalTitle").textContent = "Настройки профиля";
  const content = $("modalContent");
  const currentType = settings.avatarType || "emoji";
  const currentEmoji = settings.avatarEmoji || "♙";
  const currentPhoto = settings.avatarPhoto || "";

  content.innerHTML = `
    <label class="field-label">Имя</label>
    <input type="text" id="profileNameInput" maxlength="15" value="${escapeHTML(sanitizeName(settings.profileName || "Игрок"))}">

    <hr>
    <div class="section-title">Аватарка</div>
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
      <div id="avatarPreview" style="width:64px; height:64px; border-radius:50%; background:var(--tg-blue); display:grid; place-items:center; font-size:30px; overflow:hidden; flex-shrink:0;">
        ${currentType === "photo" && currentPhoto ? `<img src="${currentPhoto}" style="width:100%;height:100%;object-fit:cover;">` : `<span>${currentEmoji}</span>`}
      </div>
      <div style="display:flex; flex-direction:column; gap:6px; flex:1;">
        <input type="file" id="photoFile" accept="image/png,image/jpeg,image/jpg" style="display:none">
        <button class="action-button primary" id="pickFile" type="button" style="width:100%">📁 Загрузить PNG / JPG</button>
        <button class="action-button" id="pickEmoji" type="button" style="width:100%">😀 Выбрать эмодзи</button>
      </div>
    </div>

    <div id="emojiSection" class="hidden">
      <div class="section-title">Эмодзи</div>
      <div class="emoji-grid" id="emojiGrid">
        ${avatarEmojis.map(e => `<button class="emoji-option ${currentType === "emoji" && e === currentEmoji ? "selected" : ""}" data-emoji="${e}" type="button">${e}</button>`).join("")}
      </div>
    </div>

    <div class="actions" style="margin-top:14px">
      <button class="action-button primary" id="saveProfileName" style="width:100%">Сохранить</button>
    </div>`;

  const input = content.querySelector("#profileNameInput");
  input.addEventListener("input", () => {
    const clean = sanitizeName(input.value);
    if (clean !== input.value) input.value = clean;
  });

  // NEW: аватарка — файл
  content.querySelector("#pickFile").addEventListener("click", () => content.querySelector("#photoFile").click());
  content.querySelector("#photoFile").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const okTypes = ["image/png", "image/jpeg", "image/jpg"];
    if (!okTypes.includes(f.type)) { showToast("Только PNG или JPG."); e.target.value = ""; return; }
    if (f.size > PHOTO_MAX_BYTES) { showToast("Файл больше 2 МБ."); e.target.value = ""; return; }
    const r = new FileReader();
    r.onload = (ev) => {
      if (!/^data:image\/(png|jpeg|jpg);base64,/.test(ev.target.result)) { showToast("Некорректный файл."); return; }
      settings.avatarType = "photo";
      settings.avatarPhoto = ev.target.result;
      saveSettings();
      updateProfileAvatar();
      content.querySelector("#avatarPreview").innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;">`;
      showToast("Аватарка обновлена.");
    };
    r.readAsDataURL(f);
  });

  // NEW: аватарка — эмодзи
  content.querySelector("#pickEmoji").addEventListener("click", () => {
    content.querySelector("#emojiSection").classList.toggle("hidden");
  });
  content.querySelectorAll("[data-emoji]").forEach(btn => {
    btn.addEventListener("click", () => {
      content.querySelectorAll("[data-emoji]").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      settings.avatarType = "emoji";
      settings.avatarEmoji = btn.dataset.emoji;
      settings.avatarPhoto = "";
      saveSettings();
      updateProfileAvatar();
      content.querySelector("#avatarPreview").innerHTML = `<span>${btn.dataset.emoji}</span>`;
    });
  });

  content.querySelector("#saveProfileName").addEventListener("click", () => {
    const name = sanitizeName(content.querySelector("#profileNameInput").value) || "Игрок";
    settings.profileName = name;
    saveSettings();
    $("profileMenuName").textContent = name;
    showToast("Сохранено.");
    closeModal();
  });
  $("modalBackdrop").classList.remove("hidden");
}

      bg1: charGender === "Мужской" ? "#1b5685" : "#8f2452",
      bg2: charGender === "Мужской" ? "#10253f" : "#42142f",

async function shareText(text) {
  try {
    if (navigator.share) { await navigator.share({ title: "Переворот", text }); showToast("Отправлено!"); }
    else { await navigator.clipboard.writeText(text); showToast("Скопировано!"); }
  } catch (e) { if (e.name !== "AbortError") showToast("Не удалось."); }
}

function updateProfileAvatar() {
  const btn = $("profileButton");
  if (settings.avatarType === "photo" && settings.avatarPhoto) {
    btn.innerHTML = `<img src="${settings.avatarPhoto}" style="width:100%;height:100%;object-fit:cover;" alt="">`;
    btn.style.background = "transparent";
  } else {
    btn.innerHTML = `<span>${settings.avatarEmoji || "♙"}</span>`;
    btn.style.background = "var(--tg-blue)";
  }
}

});

});

    closeModal();

});

});

/* =========================================================
   ЗАГРУЗКА
   ========================================================= */
function hideSplash() {
  const splash = $("splashScreen");
  if (!splash) return;
  splash.classList.add("fade-out");
  setTimeout(() => splash.remove(), 600);
}

function initApp() {
  checkLastNamesExpiry();
  if (settings.profileName) $("profileMenuName").textContent = sanitizeName(settings.profileName) || "Игрок";
  if (settings.themeMode === "light") document.body.classList.add("light-theme");
  if (Array.isArray(settings.customColors)) applyWallpaper(settings.customColors);
  else if (Number.isInteger(settings.theme) && themes[settings.theme]) applyWallpaper(themes[settings.theme].colors);
  if (Number.isInteger(settings.bgIconsSet)) applyBgIcons(settings.bgIconsSet);
  else applyBgIcons(0);
  updateProfileAvatar();

  setupBarPhotoLoader(1);
  setupBarPhotoLoader(2);

  const last = loadLastNames();
  if (last.one && $("nameOneBar") && !$("nameOneBar").value) $("nameOneBar").value = last.one;
  if (last.two && $("nameTwoBar") && !$("nameTwoBar").value) $("nameTwoBar").value = last.two;

  cards = buildCharacters();
  revealedNames = cards.map(c => c.name);
  setPhase("setup");
  renderGameCards(true);
  closeBarPanels();
  syncGenderSelection();

  setTimeout(hideSplash, 3000);
}

initApp();
